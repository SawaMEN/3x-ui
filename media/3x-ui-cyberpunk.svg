<?xml version="1.0" encoding="UTF-8"?>
<svg width="520" height="120" viewBox="0 0 520 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">3X-UI cyberpunk logo</title>
  <desc id="desc">3X-UI neon cyberpunk wordmark in cyan, violet and magenta.</desc>
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="18%" stop-color="#A8FBFF"/>
      <stop offset="42%" stop-color="#00F6FF"/>
      <stop offset="64%" stop-color="#7F8CFF"/>
      <stop offset="84%" stop-color="#FF55E5"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <text
    x="260"
    y="78"
    text-anchor="middle"
    font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif"
    font-size="78"
    font-weight="900"
    letter-spacing="0.8"
    fill="none"
    stroke="#00F6FF"
    stroke-width="10"
    stroke-opacity="0.28"
    filter="url(#softGlow)"
    transform="skewX(-7) rotate(-1 260 60)"
  >3X-UI</text>

  <text
    x="260"
    y="78"
    text-anchor="middle"
    font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif"
    font-size="78"
    font-weight="900"
    letter-spacing="0.8"
    fill="url(#logoGradient)"
    stroke="rgba(255,255,255,0.75)"
    stroke-width="1"
    paint-order="stroke fill"
    filter="url(#glow)"
    transform="skewX(-7) rotate(-1 260 60)"
  >3X-UI</text>

  <path
    d="M 88 91 C 168 96, 322 96, 432 89"
    fill="none"
    stroke="url(#logoGradient)"
    stroke-width="3"
    stroke-linecap="round"
    opacity="0.9"
    filter="url(#glow)"
  />
</svg>
