name: temp-node-singbox-followup-run

on:
  push:
    branches:
      - temp/node-singbox-status

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temp/node-singbox-status
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Recover and apply compatibility patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          previous = subprocess.check_output(
              ['git', 'show', '7a9865ea3c3cade43708ec04b000e8c069851a47:.github/workflows/temp-node-singbox-followup.yml'],
              text=True,
          )

          def extract(start_marker, end_marker, start_at=0):
              start = previous.index(start_marker, start_at) + len(start_marker)
              end = previous.index(end_marker, start)
              body = previous[start:end]
              body = '\n'.join(
                  line[10:] if line.startswith('          ') else line
                  for line in body.splitlines()
              ) + '\n'
              return body, end

          py, _ = extract("          python3 - <<'PY'\n", "\n          PY")
          # Those spaces belong to the TypeScript string literal, not to YAML/Python.
          # Restore them after stripping the YAML run-block indentation above.
          py = py.replace("\nrecord.singboxInstalled === false", "\n          record.singboxInstalled === false")
          py = py.replace("\nif (record.singboxKnown !== true)", "\n          if (record.singboxKnown !== true)")
          py = py.replace("\nif (!record.singboxInstalled)", "\n          if (!record.singboxInstalled)")
          py = py.replace("\nreturn record.singboxVersion", "\n          return record.singboxVersion")
          Path('/tmp/apply-node-singbox-followup.py').write_text(py)

          remote_test, remote_end = extract(
              "          cat > internal/web/runtime/remote_core_test.go <<'EOF'\n",
              "\n          EOF",
          )
          Path('/tmp/remote_core_test.go').write_text(remote_test)

          service_test, _ = extract(
              "          cat > internal/web/service/node_core_status_test.go <<'EOF'\n",
              "\n          EOF",
              remote_end,
          )
          Path('/tmp/node_core_status_test.go').write_text(service_test)
          PY

          python3 /tmp/apply-node-singbox-followup.py
          cp /tmp/remote_core_test.go internal/web/runtime/remote_core_test.go
          cp /tmp/node_core_status_test.go internal/web/service/node_core_status_test.go
          gofmt -w \
            internal/database/model/model.go \
            internal/web/service/node.go \
            internal/web/service/node_contract.go \
            internal/web/service/node_tree.go \
            internal/web/service/node_core_status_test.go \
            internal/web/runtime/remote.go \
            internal/web/runtime/remote_core_test.go

      - name: Backend tests
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if GODEBUG=http2client=0 go test ./internal/web/service ./internal/web/runtime ./internal/database/model; then
              exit 0
            fi
            echo "Backend test attempt ${attempt} failed; retrying"
            sleep $((attempt * 5))
          done
          exit 1

      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npx oxlint src/pages/nodes/NodeList.tsx src/schemas/node.ts

      - name: Commit compatibility fixes
        shell: bash
        run: |
          rm -f .github/workflows/temp-node-singbox-followup-run.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(nodes): complete sing-box status compatibility"
          git push origin HEAD:temp/node-singbox-status
