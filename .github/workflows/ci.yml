name: CI

on:
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "frontend/**"
      - ".nvmrc"
      - "Makefile"
      - "internal/config/version"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Format Gateway control
        run: npx oxfmt src/pages/settings/GatewayModeControl.tsx
        working-directory: frontend
      - name: Regenerate schemas, examples and OpenAPI
        run: npm run gen
        working-directory: frontend
      - name: Upload exact generated results
        uses: actions/upload-artifact@v4
        with:
          name: gateway-ci-results
          if-no-files-found: error
          path: |
            frontend/src/pages/settings/GatewayModeControl.tsx
            frontend/public/openapi.json
            frontend/src/generated/examples.ts
            frontend/src/generated/schemas.ts
            frontend/src/generated/types.ts
            frontend/src/generated/zod.ts
