name: Telemt format temporary
on:
  push:
    branches: [feat/telemt-native-optional-inbounds]
    paths:
      - '.github/workflows/telemt-format-temporary.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Canonical oxfmt formatting
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx oxfmt src/pages/api-docs/endpoints.ts src/pages/inbounds/InboundsPage.tsx src/pages/index/TelemtConnectionsCard.tsx src/pages/settings/SystemUpdateModal.tsx src/pages/telemt/TelemtPage.tsx
      - name: Commit formatted changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(telemt): apply canonical frontend formatting"
          git push origin HEAD:feat/telemt-native-optional-inbounds
