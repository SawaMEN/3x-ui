name: Gateway recovery patch

on:
  push:
    branches:
      - fix/gateway-fail-closed

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gateway-fail-closed
          fetch-depth: 0

      - name: Harden recovery baseline handling
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('internal/web/service/gateway_network.go')
          text = p.read_text()

          old = '''type gatewayNetworkState struct {\n\tOldForwarding string\n\tConfig        GatewayNetworkConfig\n\tLANNetwork    string\n\tDesiredActive bool\n}\n'''
          new = '''type gatewayNetworkState struct {\n\tOldForwarding string\n\tConfig        GatewayNetworkConfig\n\tLANNetwork    string\n\tDesiredActive bool\n\t// Legacy identifies the pre-unified gateway.env format, which did not\n\t// manage rp_filter and did not have a NETWORK_ENABLED marker.\n\tLegacy bool\n}\n'''
          if old not in text:
              raise SystemExit('state struct target not found')
          text = text.replace(old, new, 1)

          old = '''\tstatus := GatewayNetworkStatus{Configured: true, Config: state.Config}\n\tstatus.RPFilter = true\n'''
          new = '''\tstatus := GatewayNetworkStatus{Configured: true, Config: state.Config}\n\tif !state.Legacy {\n\t\tif snapshotErr := s.validateGatewayRPSnapshot(); snapshotErr != nil {\n\t\t\tstatus.Error = fmt.Sprintf("Gateway rp_filter recovery snapshot: %v", snapshotErr)\n\t\t}\n\t}\n\tstatus.RPFilter = true\n'''
          if old not in text:
              raise SystemExit('status target not found')
          text = text.replace(old, new, 1)

          old = '''\tif state, stateErr := s.loadGatewayNetworkState(); stateErr == nil {\n\t\tif state.Config != normalized {\n\t\t\treturn fmt.Errorf("Gateway network is already configured for %s (%s); disable it before changing network settings", state.Config.LANInterface, state.LANNetwork)\n\t\t}\n\t\t// Reconcile a partially lost runtime state without overwriting the\n\t\t// forwarding value captured before Gateway Mode was first enabled.\n\t\treturn s.applyGatewayNetwork(ctx, normalized, lanNetwork, state.OldForwarding, false)\n'''
          new = '''\tif state, stateErr := s.loadGatewayNetworkState(); stateErr == nil {\n\t\tif state.Config != normalized {\n\t\t\treturn fmt.Errorf("Gateway network is already configured for %s (%s); disable it before changing network settings", state.Config.LANInterface, state.LANNetwork)\n\t\t}\n\t\t// The unified implementation changes rp_filter and therefore requires\n\t\t// its original-value snapshot for every repair. Recreating a missing\n\t\t// snapshot from the already-modified live sysctls would destroy the\n\t\t// baseline. Pre-unified state is the only safe exception: it never\n\t\t// changed rp_filter, so the current values are still the baseline.\n\t\tif !state.Legacy {\n\t\t\tif snapshotErr := s.validateGatewayRPSnapshot(); snapshotErr != nil {\n\t\t\t\treturn fmt.Errorf("Gateway rp_filter recovery snapshot is unavailable; suspend Gateway and restore the snapshot before repair: %w", snapshotErr)\n\t\t\t}\n\t\t}\n\t\treturn s.applyGatewayNetwork(ctx, normalized, lanNetwork, state.OldForwarding, false)\n'''
          if old not in text:
              raise SystemExit('enable repair target not found')
          text = text.replace(old, new, 1)

          old = '''func (s *GatewayNetworkService) Suspend(ctx context.Context) error {\n\tstate, err := s.loadGatewayNetworkState()\n\tif os.IsNotExist(err) {\n\t\treturn nil\n\t}\n\tif err != nil {\n\t\treturn err\n\t}\n\tstate.DesiredActive = false\n\tif err := s.saveGatewayNetworkState(state); err != nil {\n\t\treturn err\n\t}\n\treturn s.removeGatewayTables(ctx)\n}\n'''
          new = '''func (s *GatewayNetworkService) Suspend(ctx context.Context) error {\n\tstate, err := s.loadGatewayNetworkState()\n\tif os.IsNotExist(err) {\n\t\treturn nil\n\t}\n\tif err != nil {\n\t\treturn err\n\t}\n\n\tvar recoveryErr error\n\tif state.Legacy {\n\t\t// Older Gateway networking never changed rp_filter. Capture those live\n\t\t// values before writing the new state marker so future cleanup has a\n\t\t// trustworthy baseline.\n\t\tif err := s.captureGatewayRPFilter(ctx, state.Config.LANInterface); err != nil {\n\t\t\trecoveryErr = errors.Join(recoveryErr, fmt.Errorf("capture legacy Gateway rp_filter baseline: %w", err))\n\t\t}\n\t} else if err := s.validateGatewayRPSnapshot(); err != nil {\n\t\trecoveryErr = errors.Join(recoveryErr, fmt.Errorf("Gateway rp_filter recovery snapshot is unavailable: %w", err))\n\t}\n\n\tstate.DesiredActive = false\n\tif err := s.saveGatewayNetworkState(state); err != nil {\n\t\treturn errors.Join(recoveryErr, err)\n\t}\n\n\tif state.Legacy {\n\t\t// Pre-unified restore units do not understand NETWORK_ENABLED=0. Disable\n\t\t// their boot links before returning, even if baseline capture failed.\n\t\tfor _, unit := range []struct{\n\t\t\tpath string\n\t\t\tname string\n\t\t}{{s.networkPaths().firewallUnit, "xui-gateway-firewall.service"}, {s.networkPaths().routingUnit, "xui-gateway-routing.service"}} {\n\t\t\tif _, statErr := os.Stat(unit.path); statErr == nil {\n\t\t\t\tif err := s.commandOnly(ctx, "systemctl", "disable", unit.name); err != nil {\n\t\t\t\t\trecoveryErr = errors.Join(recoveryErr, fmt.Errorf("disable legacy %s: %w", unit.name, err))\n\t\t\t\t}\n\t\t\t}\n\t\t}\n\t}\n\n\tif err := s.removeGatewayTables(ctx); err != nil {\n\t\treturn errors.Join(recoveryErr, err)\n\t}\n\treturn recoveryErr\n}\n'''
          if old not in text:
              raise SystemExit('suspend target not found')
          text = text.replace(old, new, 1)

          old = '''\tstate := gatewayNetworkState{\n\t\tOldForwarding: values["IP_FORWARD_OLD"],\n\t\tLANNetwork:    values["LAN_NETWORK"],\n\t\tDesiredActive: values["NETWORK_ENABLED"] != "0",\n\t\tConfig: GatewayNetworkConfig{\n'''
          new = '''\tstate := gatewayNetworkState{\n\t\tOldForwarding: values["IP_FORWARD_OLD"],\n\t\tLANNetwork:    values["LAN_NETWORK"],\n\t\tDesiredActive: values["NETWORK_ENABLED"] != "0",\n\t\tLegacy:        values["NETWORK_ENABLED"] == "",\n\t\tConfig: GatewayNetworkConfig{\n'''
          if old not in text:
              raise SystemExit('load state target not found')
          text = text.replace(old, new, 1)

          anchor = '''var gatewayInterfaceName = regexp.MustCompile(`^[a-zA-Z0-9_.:-]+$`)\nvar gatewayTableRule = regexp.MustCompile(`(?m)\\b(?:lookup|table) 100(?:\\s|$)`)\nvar gatewayPolicyRule = regexp.MustCompile(`(?m)\\bfwmark 0x40/0xc0 (?:lookup|table) 100(?:\\s|$)`)\n'''
          replacement = anchor + '''\nfunc (s *GatewayNetworkService) validateGatewayRPSnapshot() error {\n\tdata, err := os.ReadFile(s.networkPaths().rpFilter)\n\tif err != nil {\n\t\treturn err\n\t}\n\t_, err = parseGatewayRPSnapshot(string(data))\n\treturn err\n}\n'''
          if anchor not in text:
              raise SystemExit('snapshot helper anchor not found')
          text = text.replace(anchor, replacement, 1)

          p.write_text(text)

          t = Path('internal/web/service/gateway_network_lifecycle_test.go')
          text = t.read_text()
          anchor = '''func TestGatewayRepairLateFailureSuspendsInterception(t *testing.T) {\n\ts, h, cfg := newGatewayTestHost(t)\n\tif err := s.Enable(context.Background(), cfg); err != nil {\n\t\tt.Fatal(err)\n\t}\n\th.failures["systemctl enable"] = 1\n\tif err := s.Enable(context.Background(), cfg); err == nil {\n\t\tt.Fatal("late repair failure ignored")\n\t}\n\tstate, err := s.loadGatewayNetworkState()\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif state.DesiredActive {\n\t\tt.Fatal("failed repair remained armed for boot restoration")\n\t}\n\tif h.firewall != "" {\n\t\tt.Fatal("failed repair left TPROXY interception active")\n\t}\n\tif err := s.Enable(context.Background(), cfg); err != nil {\n\t\tt.Fatal("repair retry failed:", err)\n\t}\n\tassertGatewayHealthy(t, s)\n}\n'''
          addition = anchor + '''func TestGatewayMissingRPFilterSnapshotFailsClosed(t *testing.T) {\n\ts, h, cfg := newGatewayTestHost(t)\n\tbaseline := map[string]string{}\n\tfor key, value := range h.sys {\n\t\tbaseline[key] = value\n\t}\n\tif err := s.Enable(context.Background(), cfg); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tsnapshot, err := os.ReadFile(s.paths.rpFilter)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif err := os.Remove(s.paths.rpFilter); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif status := s.Status(context.Background()); status.Error == "" {\n\t\tt.Fatal("missing recovery baseline was not reported")\n\t}\n\tif err := s.Enable(context.Background(), cfg); err == nil {\n\t\tt.Fatal("repair recreated a missing recovery baseline from modified sysctls")\n\t}\n\tif h.firewall == "" {\n\t\tt.Fatal("rejected repair unnecessarily removed the previously active firewall")\n\t}\n\tif err := s.Suspend(context.Background()); err == nil {\n\t\tt.Fatal("suspend hid the missing recovery baseline")\n\t}\n\tif h.firewall != "" {\n\t\tt.Fatal("baseline failure did not fail closed")\n\t}\n\tstate, err := s.loadGatewayNetworkState()\n\tif err != nil || state.DesiredActive {\n\t\tt.Fatalf("unsafe suspended state: %+v %v", state, err)\n\t}\n\tif err := os.WriteFile(s.paths.rpFilter, snapshot, 0600); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif err := s.Disable(context.Background()); err != nil {\n\t\tt.Fatal("cleanup after restoring baseline:", err)\n\t}\n\tif !reflect.DeepEqual(h.sys, baseline) {\n\t\tt.Fatalf("restored baseline differs: got=%v want=%v", h.sys, baseline)\n\t}\n}\n\nfunc TestGatewayLegacySuspendCapturesBaselineAndDisablesOldBootUnits(t *testing.T) {\n\ts, h, cfg := newGatewayTestHost(t)\n\tlegacy := fmt.Sprintf("IP_FORWARD_OLD=0\\nLAN_IF=%s\\nLAN_IP=%s\\nLAN_PREFIX=%d\\nLAN_NETWORK=192.168.50.0/24\\nWAN_IF=\\n", cfg.LANInterface, cfg.LANIP, cfg.LANPrefix)\n\tif err := os.WriteFile(s.paths.state, []byte(legacy), 0600); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tfor _, path := range []string{s.paths.routingUnit, s.paths.firewallUnit} {\n\t\tif err := os.WriteFile(path, []byte("legacy"), 0600); err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t}\n\th.enabled = true\n\th.firewall = gatewayNFTRules("192.168.50.0/24", "", cfg.LANInterface)\n\tif err := s.Suspend(context.Background()); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif h.firewall != "" || h.enabled {\n\t\tt.Fatalf("legacy suspension left runtime/boot interception active: %+v", h)\n\t}\n\tif _, err := os.Stat(s.paths.rpFilter); err != nil {\n\t\tt.Fatal("legacy baseline was not captured:", err)\n\t}\n\tstate, err := s.loadGatewayNetworkState()\n\tif err != nil || state.Legacy || state.DesiredActive {\n\t\tt.Fatalf("legacy state was not migrated safely: %+v %v", state, err)\n\t}\n}\n'''
          if anchor not in text:
              raise SystemExit('lifecycle test anchor not found')
          t.write_text(text.replace(anchor, addition, 1))
          PY

          gofmt -w internal/web/service/gateway_network.go internal/web/service/gateway_network_lifecycle_test.go

      - name: Test Gateway packages
        run: |
          go test ./internal/gateway ./internal/web/service

      - name: Commit patch and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/gateway-recovery-patch.yml
          git add internal/web/service/gateway_network.go internal/web/service/gateway_network_lifecycle_test.go
          git commit -m "fix(gateway): preserve rp-filter recovery baseline"
          git push origin HEAD:fix/gateway-fail-closed
