name: Apply NodeList key fix

on:
  push:
    branches:
      - fix/ci-compilation-tests-20261001

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Remove React key from status component props
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/pages/nodes/NodeList.tsx')
          text = path.read_text()
          replacements = {
              "function StatusDot(props: HealthProps) {\n  if (props.status === 'online') {\n    return hasCoreProblem(props) ? (":
                  "function StatusDot({ record }: { record: HealthProps }) {\n  if (record.status === 'online') {\n    return hasCoreProblem(record) ? (",
              "  return <Badge status={badgeStatus(props.status)} />;\n}\n\nfunction StatusLabel(props: HealthProps) {\n  const { t } = useTranslation();\n  if (props.status === 'online') {\n    const health = coreHealth(props);\n    if (hasCoreProblem(props)) {":
                  "  return <Badge status={badgeStatus(record.status)} />;\n}\n\nfunction StatusLabel({ record }: { record: HealthProps }) {\n  const { t } = useTranslation();\n  if (record.status === 'online') {\n    const health = coreHealth(record);\n    if (hasCoreProblem(record)) {",
              "        {props.runningCore ? ` (${props.runningCore})` : ''}":
                  "        {record.runningCore ? ` (${record.runningCore})` : ''}",
              "  return <span>{t(`pages.nodes.statusValues.${props.status || 'unknown'}`)}</span>;":
                  "  return <span>{t(`pages.nodes.statusValues.${record.status || 'unknown'}`)}</span>;",
              "<StatusDot {...record} />": "<StatusDot record={record} />",
              "<StatusLabel {...record} />": "<StatusLabel record={record} />",
              "<StatusDot {...statsNode} />": "<StatusDot record={statsNode} />",
              "<StatusLabel {...statsNode} />": "<StatusLabel record={statsNode} />",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected source fragment: {old!r}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Commit source fix and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/nodes/NodeList.tsx
          git rm .github/workflows/fix-node-row-keys.yml
          git commit -m "fix(frontend): avoid duplicate React keys in node status cells"
          git push origin HEAD:${{ github.ref_name }}
