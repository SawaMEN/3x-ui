name: Scale audit (up)
on:
  push:
    branches: [up]
    paths:
      - 'internal/**'
      - '.github/workflows/scale-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scale-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  subscription-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOPROXY: 'https://proxy.golang.org|direct'
      XUI_SCALE_TEST: '1'
      XUI_SCALE_SIZES: '10000'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Stub embedded frontend assets
        run: mkdir -p internal/web/dist && touch internal/web/dist/.gitkeep
      - name: Download dependencies with retries
        run: bash tools/ci/download-go-modules.sh
      - name: Test 10,000-client subscription generation
        run: go test -p 1 -timeout=20m -count=1 -run '^TestGetSubsScale$' -v ./internal/sub

  ip-check-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOPROXY: 'https://proxy.golang.org|direct'
      XUI_SCALE_TEST: '1'
      XUI_SCALE_SIZES: '10000'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Stub embedded frontend assets
        run: mkdir -p internal/web/dist && touch internal/web/dist/.gitkeep
      - name: Download dependencies with retries
        run: bash tools/ci/download-go-modules.sh
      - name: Test 10,000-client IP-limit reconciliation
        run: go test -p 1 -timeout=20m -count=1 -run '^TestCheckClientIpScale$' -v ./internal/web/job

  config-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOPROXY: 'https://proxy.golang.org|direct'
      XUI_SCALE_TEST: '1'
      XUI_SCALE_SIZES: '10000'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Stub embedded frontend assets
        run: mkdir -p internal/web/dist && touch internal/web/dist/.gitkeep
      - name: Download dependencies with retries
        run: bash tools/ci/download-go-modules.sh
      - name: Test 10,000-client config and websocket payloads
        run: go test -p 1 -timeout=20m -count=1 -run '^(TestGetXrayConfigScale|TestWsPayloadScale)$' -v ./internal/web/service
