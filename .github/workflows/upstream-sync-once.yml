name: One-time upstream sync

on:
  push:
    branches:
      - sync-upstream-2026-10-03
    paths:
      - .github/workflows/upstream-sync-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: sync-upstream-2026-10-03

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/MHSanaei/3x-ui.git || true
          git fetch --no-tags upstream main
          git cat-file -e 721de5adde36ed16952fcec81db970959ef9b32a^{commit}
          git cat-file -e 815c9c57726d0c5df77878da3f49a5d6b95c6c46^{commit}

      - name: Replay upstream commits preserving local changes
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t commits < <(git rev-list --reverse 721de5adde36ed16952fcec81db970959ef9b32a..815c9c57726d0c5df77878da3f49a5d6b95c6c46)
          echo "Replaying ${#commits[@]} upstream commits"
          for commit in "${commits[@]}"; do
            echo "=== $commit $(git show -s --format=%s "$commit")"
            if git cherry-pick -X ours "$commit"; then
              continue
            fi

            echo "Cherry-pick stopped; resolving remaining unmerged paths in favor of the local branch"
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              if git checkout --ours -- "$path" 2>/dev/null; then
                git add -- "$path"
              elif git rm -f --ignore-unmatch -- "$path"; then
                :
              fi
            done < <(git diff --name-only --diff-filter=U)

            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "Unresolved conflicts remain:"
              git status --short
              exit 1
            fi
            GIT_EDITOR=true git cherry-pick --continue
          done

      - name: Record upstream source
        run: |
          printf '%s\n' 'MHSanaei/3x-ui main @ 815c9c57726d0c5df77878da3f49a5d6b95c6c46' > .upstream-sync
          git add .upstream-sync
          git commit -m "chore: record upstream sync point" || true

      - name: Remove one-time workflow and push result
        run: |
          git rm .github/workflows/upstream-sync-once.yml
          git commit -m "chore: finish one-time upstream sync"
          git push origin HEAD:sync-upstream-2026-10-03

      - name: Backend tests
        continue-on-error: true
        run: go test ./...

      - name: Frontend checks
        continue-on-error: true
        run: |
          cd frontend
          corepack enable
          npm ci
          npm run typecheck
          npm run build:ci
