name: Time audit - fix lint formatting

on:
  push:
    branches: [time]
    paths:
      - '.github/workflows/time-audit-lint-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Format files rejected by golangci-lint
        run: |
          go run mvdan.cc/gofumpt@v0.9.2 -w \
            internal/logger/logger_test.go \
            internal/util/tail/tail.go \
            internal/util/tail/tail_test.go
          git diff --check
      - name: Commit formatted files to time
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/logger/logger_test.go internal/util/tail/tail.go internal/util/tail/tail_test.go
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(time): format logger and tail for gofumpt"
          git push origin HEAD:time
