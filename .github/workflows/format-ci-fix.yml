name: Format CI fix

on:
  push:
    branches:
      - fix/ci-compilation-tests-20261001

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Format regression test
        working-directory: frontend
        run: npx oxfmt src/test/node-list-rowkey.test.tsx
      - name: Commit formatted file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/test/node-list-rowkey.test.tsx
          git diff --cached --quiet && exit 1
          git commit -m "style(frontend): format NodeList key regression test"
          git push origin HEAD:${{ github.ref_name }}
