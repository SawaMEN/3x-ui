name: OxiDNS creation UI verification
on:
  push:
    branches: [dns]
    paths:
      - 'frontend/src/pages/singbox/OxiDNSSettings.tsx'
      - 'frontend/src/test/oxidns-settings.test.tsx'
      - 'frontend/src/pages/settings/SystemUpdateModal.tsx'
      - 'frontend/src/test/system-update-components.test.tsx'
      - '.github/workflows/oxidns-ui-verification.yml'
permissions:
  contents: read
jobs:
  verify-creation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Run creation and package lifecycle tests
        working-directory: frontend
        run: npx vitest run src/test/oxidns-settings.test.tsx src/test/system-update-components.test.tsx
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Canonical format snapshot
        if: always()
        working-directory: frontend
        run: |
          npx oxfmt src/pages/settings/SystemUpdateModal.tsx src/pages/singbox/OxiDNSSettings.tsx src/test/oxidns-settings.test.tsx src/test/system-update-components.test.tsx
          node -e 'const fs=require("fs");for(const p of process.argv.slice(1)) console.log("OXFMT_FILE:"+p+":"+fs.readFileSync(p).toString("base64"))' src/pages/settings/SystemUpdateModal.tsx src/pages/singbox/OxiDNSSettings.tsx src/test/oxidns-settings.test.tsx src/test/system-update-components.test.tsx
