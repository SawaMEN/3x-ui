name: Temporary outbound formatting

on:
  push:
    branches: [feat/outbound-universal-import]
    paths:
      - "frontend/src/**"
      - ".github/workflows/outbound-format-temp.yml"

permissions:
  contents: write

jobs:
  format:
    if: "!startsWith(github.event.head_commit.message, 'chore(format):')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Format outbound changes
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx oxfmt src/lib/xray/outbound-loss-check.ts src/pages/xray/outbounds/OutboundFormModal.tsx src/test/outbound-loss-check.test.ts src/test/outbound-form-modal.test.tsx
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/lib/xray/outbound-loss-check.ts frontend/src/pages/xray/outbounds/OutboundFormModal.tsx frontend/src/test/outbound-loss-check.test.ts frontend/src/test/outbound-form-modal.test.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(format): apply oxfmt to outbound safety checks"
          git push origin HEAD:feat/outbound-universal-import
