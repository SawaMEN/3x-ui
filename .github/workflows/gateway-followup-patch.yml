name: Gateway follow-up patch

on:
  push:
    branches:
      - fix/gateway-fail-closed

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gateway-fail-closed
          fetch-depth: 0

      - name: Apply fail-closed fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          cli = Path('internal/gateway/cli.go')
          text = cli.read_text()
          old = '''\tif !states[core].Configured {\n\t\tif err := EnableForCore(core); err != nil {\n\t\t\treturn err\n\t\t}\n\t\tchanged = append(changed, core)\n\t\tif err := restartGatewayPanel(ctx); err != nil {\n\t\t\treturn rollback(false, err)\n\t\t}\n\t}\n'''
          new = '''\tif !states[core].Configured {\n\t\tif err := EnableForCore(core); err != nil {\n\t\t\treturn err\n\t\t}\n\t\tchanged = append(changed, core)\n\t\t// A saved Linux Gateway may outlive an interrupted template change.\n\t\t// Remove TPROXY before restarting the panel/core so LAN traffic is not\n\t\t// redirected to port 52345 while the listener is temporarily absent.\n\t\tif before.Configured {\n\t\t\tif err := network.Suspend(ctx); err != nil {\n\t\t\t\treturn rollback(false, err)\n\t\t\t}\n\t\t}\n\t\tif err := restartGatewayPanel(ctx); err != nil {\n\t\t\treturn rollback(false, err)\n\t\t}\n\t}\n'''
          if old not in text:
              raise SystemExit('cli target not found')
          cli.write_text(text.replace(old, new, 1))

          network = Path('internal/web/service/gateway_network.go')
          text = network.read_text()
          old = '''\tdefer func() {\n\t\tif err != nil && persistState {\n\t\t\tcleanupCtx, cancel := context.WithTimeout(context.Background(), 30*time.Second)\n\t\t\tdefer cancel()\n\t\t\tif cleanupErr := s.Disable(cleanupCtx); cleanupErr != nil {\n\t\t\t\terr = errors.Join(err, fmt.Errorf("Gateway rollback failed: %w", cleanupErr))\n\t\t\t}\n\t\t}\n\t}()\n'''
          new = '''\tfirewallApplied := false\n\tdefer func() {\n\t\tif err == nil {\n\t\t\treturn\n\t\t}\n\t\tcleanupCtx, cancel := context.WithTimeout(context.Background(), 30*time.Second)\n\t\tdefer cancel()\n\t\tvar cleanupErr error\n\t\tswitch {\n\t\tcase persistState:\n\t\t\tcleanupErr = s.Disable(cleanupCtx)\n\t\tcase firewallApplied:\n\t\t\t// A repair/resume already had durable recovery state. If it fails\n\t\t\t// after replacing the live firewall, fail closed instead of leaving\n\t\t\t// interception active while reporting an unsuccessful operation.\n\t\t\tcleanupErr = s.Suspend(cleanupCtx)\n\t\tdefault:\n\t\t\treturn\n\t\t}\n\t\tif cleanupErr != nil {\n\t\t\terr = errors.Join(err, fmt.Errorf("Gateway rollback failed: %w", cleanupErr))\n\t\t}\n\t}()\n'''
          if old not in text:
              raise SystemExit('network defer target not found')
          text = text.replace(old, new, 1)
          old = '''\tif err = s.commandInput(ctx, batch, "nft", "-f", "-"); err != nil {\n\t\treturn fmt.Errorf("apply Gateway nftables rules: %w", err)\n\t}\n\tif err = gatewayAtomicWrite(s.networkPaths().nft, []byte(nftRules), 0o600); err != nil {\n'''
          new = '''\tif err = s.commandInput(ctx, batch, "nft", "-f", "-"); err != nil {\n\t\treturn fmt.Errorf("apply Gateway nftables rules: %w", err)\n\t}\n\tfirewallApplied = true\n\tif err = gatewayAtomicWrite(s.networkPaths().nft, []byte(nftRules), 0o600); err != nil {\n'''
          if old not in text:
              raise SystemExit('network nft target not found')
          network.write_text(text.replace(old, new, 1))

          tests = Path('internal/web/service/gateway_network_lifecycle_test.go')
          text = tests.read_text()
          anchor = '''func TestGatewayRepairFailureKeepsExistingFirewall(t *testing.T) {\n\ts, h, cfg := newGatewayTestHost(t)\n\tif err := s.Enable(context.Background(), cfg); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tprevious := h.firewall\n\th.failures["nft apply"] = 1\n\tif err := s.Enable(context.Background(), cfg); err == nil {\n\t\tt.Fatal("repair failure ignored")\n\t}\n\tif h.firewall != previous {\n\t\tt.Fatal("repair removed old firewall before replacement validated/applied")\n\t}\n\tif _, err := os.Stat(s.paths.rpFilter); err != nil {\n\t\tt.Fatal("repair lost baseline")\n\t}\n}\n'''
          addition = anchor + '''func TestGatewayRepairLateFailureSuspendsInterception(t *testing.T) {\n\ts, h, cfg := newGatewayTestHost(t)\n\tif err := s.Enable(context.Background(), cfg); err != nil {\n\t\tt.Fatal(err)\n\t}\n\th.failures["systemctl enable"] = 1\n\tif err := s.Enable(context.Background(), cfg); err == nil {\n\t\tt.Fatal("late repair failure ignored")\n\t}\n\tstate, err := s.loadGatewayNetworkState()\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif state.DesiredActive {\n\t\tt.Fatal("failed repair remained armed for boot restoration")\n\t}\n\tif h.firewall != "" {\n\t\tt.Fatal("failed repair left TPROXY interception active")\n\t}\n\tif err := s.Enable(context.Background(), cfg); err != nil {\n\t\tt.Fatal("repair retry failed:", err)\n\t}\n\tassertGatewayHealthy(t, s)\n}\n'''
          if anchor not in text:
              raise SystemExit('test anchor not found')
          tests.write_text(text.replace(anchor, addition, 1))
          PY

          gofmt -w internal/gateway/cli.go internal/web/service/gateway_network.go internal/web/service/gateway_network_lifecycle_test.go

      - name: Test Gateway packages
        run: |
          go test ./internal/gateway ./internal/web/service

      - name: Commit patch and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/gateway-followup-patch.yml
          git add internal/gateway/cli.go internal/web/service/gateway_network.go internal/web/service/gateway_network_lifecycle_test.go
          git commit -m "fix(gateway): fail closed during restart and repair"
          git push origin HEAD:fix/gateway-fail-closed
