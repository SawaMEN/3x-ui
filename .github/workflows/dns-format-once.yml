name: DNS lifecycle formatter snapshot (final)
on:
  push:
    branches: [dns]
    paths: ['.github/workflows/dns-format-once.yml']
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Canonical gofmt output
        run: |
          gofmt -w internal/oxidns/manager.go internal/oxidns/lifecycle_systemd_test.go
          python3 - <<'PY'
          import base64
          from pathlib import Path
          for p in ['internal/oxidns/manager.go','internal/oxidns/lifecycle_systemd_test.go']:
              print('GOFMT_FILE:'+p+':'+base64.b64encode(Path(p).read_bytes()).decode())
          PY
      - name: Install frontend formatter
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Canonical frontend output
        working-directory: frontend
        run: |
          npx oxfmt src/pages/singbox/OxiDNSSettings.tsx src/pages/settings/SystemUpdateModal.tsx
          node -e 'const fs=require("fs"); for (const p of process.argv.slice(1)) console.log("OXFMT_FILE:"+p+":"+fs.readFileSync(p).toString("base64"))' src/pages/singbox/OxiDNSSettings.tsx src/pages/settings/SystemUpdateModal.tsx
