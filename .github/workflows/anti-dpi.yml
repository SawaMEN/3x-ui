name: Anti-DPI validation

on:
  push:
    branches: [Anti-DPI]
    paths:
      - 'frontend/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.nvmrc'
      - 'tools/ci/download-go-modules.sh'
      - '.github/workflows/anti-dpi.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anti-dpi-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'push' }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Anti-DPI frontend and report contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Diagnostic parsers, policy and HTTP contract
        run: |
          npm test -- --project unit src/test/anti-dpi-report.test.ts src/test/adaptive-connect-audit.test.ts src/test/adaptive-connect-policy.test.ts src/test/vetroff-diagnostic-report.test.ts src/test/connectivity-report.test.ts src/test/address-report.test.ts src/test/http-init-msw.test.ts
      - name: Full frontend typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck
      - name: Production frontend build
        if: ${{ !cancelled() }}
        run: npm run build:ci

  backend:
    name: Anti-DPI server and subscription integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOPROXY: 'https://proxy.golang.org|direct'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Stub embedded frontend for backend compilation
        run: mkdir -p internal/web/dist && touch internal/web/dist/.gitkeep
      - name: Download dependencies
        run: bash tools/ci/download-go-modules.sh
      - name: Race-test server diagnostics
        run: go test -race -count=1 -timeout=5m ./internal/antidpi
      - name: Compile settings controllers
        if: ${{ !cancelled() }}
        run: go test -count=1 -timeout=10m ./internal/web/controller -run '^$'
      - name: Subscription observatory regression
        if: ${{ !cancelled() }}
        run: go test -count=1 -timeout=10m ./internal/sub -run '^TestSubJson_ObservatoryConfigInvalidValuesFallBack$'


  cross-repository:
    name: VetrOFF-Core / 3x-ui JSON contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out reviewed core contract revision
        uses: actions/checkout@v7
        with:
          repository: SawaMEN/VetrOFF-Core
          ref: 781ad319aa345d503a56ef4f1227bb61b815038f
          path: .contract-core
          persist-credentials: false
          sparse-checkout: migration/adaptive-connect
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate actual Go report fixtures
        working-directory: .contract-core/migration/adaptive-connect
        shell: bash
        run: |
          set -euo pipefail
          dir=$(mktemp -d "$RUNNER_TEMP/vetroff-contract.XXXXXX")
          echo "VETROFF_CONTRACT_DIR=$dir" >> "$GITHUB_ENV"
          VETROFF_CONTRACT_DIR="$dir" GO111MODULE=off go test -count=1 -run '^TestExportDiagnosticContractFixtures$' .
          test "$(find "$dir" -maxdepth 1 -name '*.json' | wc -l)" -eq 11
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Import Go reports and export actual panel policies
        working-directory: frontend
        run: |
          test -n "$VETROFF_CONTRACT_DIR"
          npm test -- --project unit src/test/vetroff-contract.test.ts
          test -s "$VETROFF_CONTRACT_DIR/panel-default.json"
          test -s "$VETROFF_CONTRACT_DIR/panel-enabled.json"
      - name: Parse actual panel exports in Go
        working-directory: .contract-core/migration/adaptive-connect
        run: GO111MODULE=off go test -count=1 -run '^TestPanelPolicyContract$' .
