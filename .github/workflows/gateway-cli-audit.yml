name: Gateway CLI audit

on:
  push:
    branches:
      - fix/gateway-mode-hardening

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gateway-mode-hardening
      - name: Locate Gateway CLI code
        shell: bash
        run: |
          echo '=== gateway/tproxy references in x-ui-core.sh ==='
          grep -nEi 'gateway|tproxy|fwmark|52345|table[[:space:]]+100|ip rule|nft' x-ui-core.sh || true
          echo '=== shell syntax ==='
          bash -n x-ui-core.sh
