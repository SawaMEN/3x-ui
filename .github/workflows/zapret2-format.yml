name: Zapret2 integration formatter (temporary)

on:
  push:
    branches:
      - feature/zapret2-virtual-outbound
    paths:
      - 'internal/zapret2/**'
      - 'internal/web/service/**'
      - 'frontend/src/**'
      - '.github/workflows/zapret2-format.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/zapret2-virtual-outbound
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install repository Go formatters
        shell: bash
        run: |
          set -euo pipefail
          go install mvdan.cc/gofumpt@latest
          go install golang.org/x/tools/cmd/goimports@latest
      - name: Apply Go formatters to changed files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=50
          mapfile -t source_files < <(git diff --name-only "$(git merge-base origin/main HEAD)" HEAD -- '*.go')
          source_files+=("internal/externalvpn/manager.go")
          if (( ${#source_files[@]} > 0 )); then
            "$(go env GOPATH)/bin/goimports" -w "${source_files[@]}"
            "$(go env GOPATH)/bin/gofumpt" -w "${source_files[@]}"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Format frontend
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npm run format
      - name: Push formatted sources to the feature branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- '*.go' 'frontend/src/**'
            git commit -m 'style(zapret2): apply Go and TypeScript repository formatters'
            git push origin HEAD:refs/heads/feature/zapret2-virtual-outbound
          fi
