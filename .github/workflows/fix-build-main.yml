name: Fix build main

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!startsWith(github.event.head_commit.message, 'chore(build-fix):')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fix Telemt runtime config naming
        run: |
          sed -i 's/func telemtRuntimeConfigResponse()/func fetchTelemtRuntimeConfig()/g' internal/web/service/telemt.go
          sed -i 's/telemtRuntimeConfigResponse();/fetchTelemtRuntimeConfig();/g' internal/web/service/telemt.go
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/web/service/telemt.go
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(build-fix): fix Telemt runtime config helper"
          git push origin HEAD:main
