name: temp-node-singbox-lifecycle

on:
  push:
    branches:
      - temp/node-singbox-status

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temp/node-singbox-status
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Fix sing-box lifecycle semantics
        shell: bash
        run: |
          cat > internal/web/service/singbox_lifecycle.go <<'EOF'
          package service

          import (
          	"os"
          	"sync/atomic"

          	"github.com/SawaMEN/3x-ui/v3/internal/singbox"
          )

          var isSingBoxManuallyStopped atomic.Bool

          // Installed reports whether the configured sing-box binary exists as a
          // regular filesystem entry. It deliberately avoids executing the binary,
          // so status/watchdog checks stay cheap when sing-box is not installed.
          func (s *SingBoxService) Installed() bool {
          	info, err := os.Stat(singbox.GetBinaryPath())
          	return err == nil && !info.IsDir()
          }

          // DidCrash distinguishes an unexpected process exit from the two normal
          // stopped states: the operator explicitly stopped sing-box, or sing-box
          // is not installed on this panel/node at all.
          func (s *SingBoxService) DidCrash() bool {
          	return s.Installed() && !s.IsRunning() && !isSingBoxManuallyStopped.Load()
          }

          func markSingBoxStarted() {
          	isSingBoxManuallyStopped.Store(false)
          }

          func markSingBoxStopped() {
          	isSingBoxManuallyStopped.Store(true)
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          p = Path('internal/web/service/singbox.go')
          s = p.read_text()
          s = s.replace(
          '''func (s *SingBoxService) Restart(ctx context.Context) error {
          \tif _, err := singBoxProcess.Version(ctx); err != nil {''',
          '''func (s *SingBoxService) Restart(ctx context.Context) error {
          \tmarkSingBoxStarted()
          \tif _, err := singBoxProcess.Version(ctx); err != nil {''')
          s = s.replace(
          '''func (s *SingBoxService) Start(ctx context.Context) error {
          \tif _, err := singBoxProcess.Version(ctx); err != nil {''',
          '''func (s *SingBoxService) Start(ctx context.Context) error {
          \tmarkSingBoxStarted()
          \tif _, err := singBoxProcess.Version(ctx); err != nil {''')
          s = s.replace(
          '''func (s *SingBoxService) Stop(ctx context.Context) error {
          \treturn singBoxProcess.Stop()
          }''',
          '''func (s *SingBoxService) Stop(ctx context.Context) error {
          \tmarkSingBoxStopped()
          \treturn singBoxProcess.Stop()
          }''')
          p.write_text(s)

          p = Path('internal/web/job/check_xray_running_job.go')
          s = p.read_text()
          old = '''\tif coreType == service.CoreTypeSingBox {
          \t\tif !j.singBox.IsRunning() {
          \t\t\tj.checkTime++
          \t\t\tif j.checkTime > 1 {
          \t\t\t\terr := j.singBox.Restart(context.Background())
          \t\t\t\tj.checkTime = 0
          \t\t\t\tif err != nil {
          \t\t\t\t\tlogger.Error("Restart sing-box failed:", err)
          \t\t\t\t}
          \t\t\t}
          \t\t\treturn
          \t\t}
          \t\tj.checkTime = 0
          \t\treturn
          \t}'''
          new = '''\tif coreType == service.CoreTypeSingBox {
          \t\tif !j.singBox.DidCrash() {
          \t\t\tj.checkTime = 0
          \t\t\treturn
          \t\t}
          \t\tj.checkTime++
          \t\tif j.checkTime > 1 {
          \t\t\terr := j.singBox.Restart(context.Background())
          \t\t\tj.checkTime = 0
          \t\t\tif err != nil {
          \t\t\t\tlogger.Error("Restart sing-box failed:", err)
          \t\t\t}
          \t\t}
          \t\treturn
          \t}'''
          if old not in s:
              raise SystemExit('sing-box watchdog block not found')
          p.write_text(s.replace(old, new))
          PY

          gofmt -w internal/web/service/singbox_lifecycle.go internal/web/service/singbox.go internal/web/job/check_xray_running_job.go
          git add internal/web/service/singbox_lifecycle.go internal/web/service/singbox.go internal/web/job/check_xray_running_job.go
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(singbox): distinguish stopped absent and crashed core"

      - name: Avoid probing missing sing-box on status
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('internal/web/controller/server.go')
          s = p.read_text()
          old = '''\tsingBoxVersion := ""
          \tsingBoxInstalled := false
          \tif version, versionErr := a.singBoxService.CachedVersion(c.Request.Context()); versionErr == nil && version != "" {
          \t\tsingBoxInstalled = true
          \t\tsingBoxVersion = version
          \t}'''
          new = '''\tsingBoxVersion := ""
          \tsingBoxInstalled := a.singBoxService.Installed()
          \tif singBoxInstalled {
          \t\tif version, versionErr := a.singBoxService.CachedVersion(c.Request.Context()); versionErr == nil && version != "" {
          \t\t\tsingBoxVersion = version
          \t\t}
          \t}'''
          if old not in s:
              raise SystemExit('status sing-box version block not found')
          p.write_text(s.replace(old, new))
          PY
          gofmt -w internal/web/controller/server.go
          git add internal/web/controller/server.go
          git diff --cached --check
          git commit -m "perf(nodes): skip sing-box exec probe when absent"

      - name: Backend tests
        shell: bash
        run: |
          GODEBUG=http2client=0 go test ./internal/web/job ./internal/web/controller ./internal/web/service ./internal/web/runtime

      - name: Remove temporary workflow and push
        shell: bash
        run: |
          rm -f .github/workflows/temp-node-singbox-lifecycle.yml
          git add -A
          git commit -m "chore: remove temporary sing-box lifecycle workflow"
          git push origin HEAD:temp/node-singbox-status
