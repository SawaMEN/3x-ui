name: Format Snell editor fields
on:
  push:
    branches:
      - fix/snell-reliability
    paths:
      - .github/workflows/snell-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Format only the Snell editors
        working-directory: frontend
        run: npx oxfmt src/pages/inbounds/form/protocols/snell.tsx src/pages/xray/outbounds/AdditionalOutboundEditor.tsx
      - name: Commit formatter-only changes
        shell: bash
        run: |
          if git diff --quiet -- frontend/src/pages/inbounds/form/protocols/snell.tsx frontend/src/pages/xray/outbounds/AdditionalOutboundEditor.tsx; then
            echo "Nothing to format"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/inbounds/form/protocols/snell.tsx frontend/src/pages/xray/outbounds/AdditionalOutboundEditor.tsx
          git commit -m "chore(snell-format): match project oxfmt rules"
          git push origin HEAD:fix/snell-reliability
