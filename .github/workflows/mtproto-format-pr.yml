name: Temporary MTProto formatter
on:
  push:
    branches: [refactor/mtproto-native-web-lifecycle]
    paths:
      - ".github/workflows/mtproto-format-pr.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Canonical Go formatting
        run: |
          gofmt -w internal/mtproto/manager.go internal/web/runtime/local.go internal/web/service/inbound_mtproto.go internal/web/service/inbound.go internal/web/service/mtproto_web.go internal/web/service/telemt.go internal/web/service/telemt_webproxy.go internal/web/job/mtproto_job.go internal/sub/service.go internal/sub/service_mtproto_test.go
      - name: Canonical frontend formatting
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx oxfmt src/pages/inbounds/InboundsPage.tsx src/pages/inbounds/form/protocols/mtproto.tsx src/schemas/protocols/inbound/mtproto.ts src/lib/xray/inbound-link.ts
      - name: Commit formatting to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/mtproto/manager.go internal/web/runtime/local.go internal/web/service/inbound_mtproto.go internal/web/service/inbound.go internal/web/service/mtproto_web.go internal/web/service/telemt_webproxy.go internal/web/job/mtproto_job.go internal/sub/service.go frontend/src
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(mtproto): apply project formatters"
          git push origin HEAD:refactor/mtproto-native-web-lifecycle
