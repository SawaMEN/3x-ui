name: Routing DNS gateway and firewall audit
on:
  push:
    branches: [update]
    paths: ['internal/**', 'frontend/src/pages/firewall/**', 'frontend/src/test/firewall*', '.github/workflows/routing-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: routing-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare dependencies
        run: mkdir -p internal/web/dist && touch internal/web/dist/.gitkeep && bash tools/ci/download-go-modules.sh
      - name: Reproduce policy errors before fixes
        run: |
          set -o pipefail
          git fetch --depth=1 origin fdeba8766eef7baeef5289a11e51bff4f379efe9
          for name in xray_setting_routing_sync.go routing_catalog.go; do
            cp "internal/web/service/$name" "$RUNNER_TEMP/$name"
            git show "fdeba8766eef7baeef5289a11e51bff4f379efe9:internal/web/service/$name" > "internal/web/service/$name"
          done
          cp internal/web/service/firewall_managed.go "$RUNNER_TEMP/firewall-current.go"
          python3 - <<'PY'
          import subprocess,pathlib
          p=pathlib.Path('internal/web/service/firewall_managed.go')
          old=subprocess.check_output(['git','show','fdeba8766eef7baeef5289a11e51bff4f379efe9:internal/web/service/firewall_managed.go'],text=True)
          current=p.read_text()
          def span(s):
              a=s.index('func applyManagedNftables(')
              return a,s.index('\nfunc ',a+1)
          a,b=span(old);x,y=span(current)
          p.write_text(current[:x]+old[a:b]+current[y:])
          PY
          set +e
          go test -json ./internal/web/service -run '^(TestStage7DeletedInboundCannotBroadenPolicy|TestStage7CatalogDoesNotEraseInvalidRules|TestStage7NftReplacementFailurePreservesFirewall)$' -count=1 > before-policy.jsonl
          status=$?
          set -e
          for name in xray_setting_routing_sync.go routing_catalog.go; do cp "$RUNNER_TEMP/$name" "internal/web/service/$name"; done
          cp "$RUNNER_TEMP/firewall-current.go" internal/web/service/firewall_managed.go
          test "$status" -ne 0
          python3 - <<'PY'
          import json
          failed={e.get('Test') for line in open('before-policy.jsonl') if (e:=json.loads(line)).get('Action')=='fail'}
          assert {'TestStage7DeletedInboundCannotBroadenPolicy','TestStage7CatalogDoesNotEraseInvalidRules','TestStage7NftReplacementFailurePreservesFirewall'} <= failed, failed
          PY
      - name: Routing DNS firewall policy contracts
        run: |
          set -o pipefail
          go test -race -timeout 20m -p 2 -json ./internal/web/service -run 'Stage7|Routing|Route|Gateway|Firewall|Automatic|Balancer|AdBlock|YouTube|DomainFront|DNS|Tun' -count=1 | tee policies.jsonl
          python3 tools/ci/require-go-tests.py policies.jsonl TestStage7DeletedInboundCannotBroadenPolicy TestStage7CatalogDoesNotEraseInvalidRules TestStage7FirewallInterval TestStage7NftReplacementFailurePreservesFirewall
          go test -race -p 2 -json ./internal/gateway ./internal/routingcatalog ./internal/domainfront ./internal/adblock ./internal/singbox ./internal/hiddify ./internal/web/controller -count=1 | tee engines.jsonl
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Firewall routing and DNS UI contracts
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test -- src/test/firewall-autorefresh.test.tsx src/test/gateway-mode-control.test.tsx src/test/routing*.test.* src/test/dns*.test.* src/test/native-dns-editor.test.tsx src/test/singbox-route-rule.test.ts src/test/oxidns-settings.test.tsx src/test/dnstt-settings.test.tsx
      - name: Vet changed services
        run: go vet ./internal/web/service ./internal/web/controller ./internal/gateway ./internal/singbox
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: routing-contract-evidence
          path: '*.jsonl'
  dns-components:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Download checksum pinned DNS binaries
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/svenshi/oxidns/releases/download/v1.6.1/oxidns-x86_64-unknown-linux-musl.tar.gz -o "$RUNNER_TEMP/oxidns.tar.gz"
          echo "2ac8e103e03407a73c29da848f6ce2d524e751ce1da8a744aa9168fc1384e3b0  $RUNNER_TEMP/oxidns.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/oxidns.tar.gz" -C "$RUNNER_TEMP"
          base=https://github.com/NNdroid/dnstt/releases/download/2026-05-01-0c5c52a
          curl -fsSL --retry 3 "$base/dnstt-server-linux-amd64" -o "$RUNNER_TEMP/dnstt-server"
          curl -fsSL --retry 3 "$base/dnstt-client-linux-amd64" -o "$RUNNER_TEMP/dnstt-client"
          echo "def817a91ea0fce57c37c3d82c97799d7caa38618b8a73e94c05c14a1300560c  $RUNNER_TEMP/dnstt-server" | sha256sum -c -
          echo "92f7afb857740e482f577990bce601b9f0c5a9771e3890e20ce951e33e6e1e5c  $RUNNER_TEMP/dnstt-client" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/dnstt-server" "$RUNNER_TEMP/dnstt-client"
      - name: Real OxiDNS and DNSTT payload and TLS
        run: |
          set -o pipefail
          OXIDNS_CHECK_BINARY="$RUNNER_TEMP/oxidns" go test -race -json ./internal/oxidns -count=1 | tee oxidns.jsonl
          python3 tools/ci/require-go-tests.py oxidns.jsonl TestGeneratedYAMLAgainstOfficialBinary TestDoHCertificateAndOfficialParser TestOfficialOxiDNSForwardsRealTraffic
          DNSTT_SERVER_BINARY="$RUNNER_TEMP/dnstt-server" DNSTT_CLIENT_BINARY="$RUNNER_TEMP/dnstt-client" go test -race -json ./internal/dnstt -count=1 | tee dnstt.jsonl
          python3 tools/ci/require-go-tests.py dnstt.jsonl TestOfficialDNSTTTunnelRoundTrip
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dns-component-evidence
          path: '*.jsonl'
