name: Routing DNS gateway and firewall audit
on:
  push:
    branches: [update]
    paths: ['internal/**', 'frontend/src/pages/firewall/**', 'frontend/src/test/firewall*', '.github/workflows/routing-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: routing-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Kernel network tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nftables iptables iproute2 python3
          test -c /dev/net/tun || { sudo mkdir -p /dev/net; sudo mknod /dev/net/tun c 10 200; }
      - name: Pinned native cores
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/ci/download-audit-cores.sh amd64
      - name: Compile isolated kernel and DNS probes
        run: |
          mkdir -p internal/web/dist && touch internal/web/dist/.gitkeep
          go test -c -race ./internal/web/service -o "$RUNNER_TEMP/service.test"
          go test -c -race ./internal/hiddify -o "$RUNNER_TEMP/dns.test"
          printf 'nameserver 127.0.0.1\noptions timeout:1 attempts:1\n' > "$RUNNER_TEMP/stage7-resolv.conf"
      - name: Real packets in private network and mount namespaces
        run: |
          set -o pipefail
          sudo env XUI_STAGE4_CORE_DIR="$XUI_STAGE4_CORE_DIR" STAGE7_NETNS=1 STAGE7_ISOLATED=1 GODEBUG=netdns=go \
            STAGE7_TEMP="$RUNNER_TEMP" STAGE7_GO="$(command -v go)" \
            unshare --mount --net --mount-proc bash -euc '
              set -o pipefail
              mount --make-rprivate /
              mount -t sysfs sysfs /sys
              ip link set lo up
              mount --bind "$STAGE7_TEMP/stage7-resolv.conf" /etc/resolv.conf
              "$STAGE7_GO" tool test2json -p github.com/SawaMEN/3x-ui/v3/internal/web/service -t "$STAGE7_TEMP/service.test" -test.v -test.run "^TestStage7Kernel" -test.timeout 5m | tee kernel.jsonl
              "$STAGE7_GO" tool test2json -p github.com/SawaMEN/3x-ui/v3/internal/hiddify -t "$STAGE7_TEMP/dns.test" -test.v -test.run "^TestStage7DNSPolicy$" -test.timeout 2m | tee dns-leak.jsonl
            '
          python3 tools/ci/require-go-tests.py kernel.jsonl TestStage7KernelGateway TestStage7KernelTun TestStage7KernelFirewall
          python3 tools/ci/require-go-tests.py dns-leak.jsonl TestStage7DNSPolicy
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: routing-kernel-evidence
          path: |
            kernel.jsonl
            dns-leak.jsonl
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Download pinned engines
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/ci/download-audit-cores.sh ${{ matrix.arch }}
      - name: Packet backed routing policy
        run: |
          set -o pipefail
          go test -race -json ./internal/hiddify -run '^TestStage7' -count=1 | tee routing-native.jsonl
          python3 tools/ci/require-go-tests.py routing-native.jsonl TestStage7RoutingTraffic TestStage7DNSPolicy TestStage7SelectorTraffic
      - name: Live selector and adblock policy
        run: |
          set -o pipefail
          mkdir -p internal/web/dist && touch internal/web/dist/.gitkeep
          SINGBOX_E2E_BINARY="$XUI_STAGE4_CORE_DIR/owner/x-ui/bin/hiddify-core-linux-${{ matrix.arch }}" go test -race -json ./internal/singbox -run '^TestSelectorLiveSwitch_E2E$' -count=1 | tee selector.jsonl
          python3 tools/ci/require-go-tests.py selector.jsonl TestSelectorLiveSwitch_E2E
          XUI_ADBLOCK_XRAY_BINARY="$XUI_STAGE4_CORE_DIR/xray/xray" XUI_ADBLOCK_SINGBOX_BINARY="$XUI_STAGE4_CORE_DIR/upstream/sing-box" \
            go test -race -json ./internal/web/service -run '^(TestAdBlockRealCores|TestAdBlockManagedServerRealCores|TestAdBlockScopedConfigsAcceptedByRealCores|TestAdBlockPolicyRealCores)$' -count=1 | tee adblock-native.jsonl
          python3 tools/ci/require-go-tests.py adblock-native.jsonl TestAdBlockRealCores TestAdBlockManagedServerRealCores TestAdBlockScopedConfigsAcceptedByRealCores TestAdBlockPolicyRealCores
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: routing-native-${{ matrix.arch }}
          path: |
            routing-native.jsonl
            selector.jsonl
            adblock-native.jsonl
            native-binaries.sha256
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare dependencies
        run: mkdir -p internal/web/dist && touch internal/web/dist/.gitkeep && bash tools/ci/download-go-modules.sh
      - name: Reproduce policy errors before fixes
        run: |
          set -o pipefail
          git fetch --depth=1 origin fdeba8766eef7baeef5289a11e51bff4f379efe9
          for name in xray_setting_routing_sync.go routing_catalog.go; do
            cp "internal/web/service/$name" "$RUNNER_TEMP/$name"
            git show "fdeba8766eef7baeef5289a11e51bff4f379efe9:internal/web/service/$name" > "internal/web/service/$name"
          done
          cp internal/web/service/firewall_managed.go "$RUNNER_TEMP/firewall-current.go"
          cp internal/web/service/gateway_network.go "$RUNNER_TEMP/gateway-current.go"
          python3 - <<'PY'
          import subprocess,pathlib
          p=pathlib.Path('internal/web/service/firewall_managed.go')
          old=subprocess.check_output(['git','show','fdeba8766eef7baeef5289a11e51bff4f379efe9:internal/web/service/firewall_managed.go'],text=True)
          current=p.read_text()
          def span(s):
              a=s.index('func applyManagedNftables(')
              return a,s.index('\nfunc ',a+1)
          a,b=span(old);x,y=span(current)
          p.write_text(current[:x]+old[a:b]+current[y:])
          p=pathlib.Path('internal/web/service/gateway_network.go')
          old=subprocess.check_output(['git','show','fdeba8766eef7baeef5289a11e51bff4f379efe9:internal/web/service/gateway_network.go'],text=True)
          current=p.read_text()
          marker='func (s *GatewayNetworkService) Suspend('
          a=old.index(marker);b=old.index('\nfunc ',a+1)
          x=current.index(marker);y=current.index('\nfunc ',x+1)
          p.write_text(current[:x]+old[a:b]+current[y:])
          PY
          set +e
          go test -json ./internal/web/service -run '^(TestStage7DeletedInboundCannotBroadenPolicy|TestStage7CatalogDoesNotEraseInvalidRules|TestStage7NftReplacementFailurePreservesFirewall|TestStage7GatewayPauseCannotBecomeDirectFallback)$' -count=1 > before-policy.jsonl
          status=$?
          set -e
          for name in xray_setting_routing_sync.go routing_catalog.go; do cp "$RUNNER_TEMP/$name" "internal/web/service/$name"; done
          cp "$RUNNER_TEMP/firewall-current.go" internal/web/service/firewall_managed.go
          cp "$RUNNER_TEMP/gateway-current.go" internal/web/service/gateway_network.go
          test "$status" -ne 0
          python3 - <<'PY'
          import json
          failed={e.get('Test') for line in open('before-policy.jsonl') if (e:=json.loads(line)).get('Action')=='fail'}
          assert {'TestStage7DeletedInboundCannotBroadenPolicy','TestStage7CatalogDoesNotEraseInvalidRules','TestStage7NftReplacementFailurePreservesFirewall','TestStage7GatewayPauseCannotBecomeDirectFallback'} <= failed, failed
          PY
      - name: Routing DNS firewall policy contracts
        run: |
          set -o pipefail
          go test -race -timeout 20m -p 2 -json ./internal/web/service -run 'Stage7|Routing|Route|Gateway|Firewall|Automatic|Balancer|AdBlock|YouTube|DomainFront|DNS|Tun' -count=1 | tee policies.jsonl
          python3 tools/ci/require-go-tests.py policies.jsonl TestStage7DeletedInboundCannotBroadenPolicy TestStage7CatalogDoesNotEraseInvalidRules TestStage7FirewallInterval TestStage7NftReplacementFailurePreservesFirewall TestStage7GatewayPauseCannotBecomeDirectFallback TestStage7ExternalFirewallRules TestStage7FirewallRuleLexer TestStage7GatewayResumeRouteFormat
          go test -race -p 2 -json ./internal/gateway ./internal/routingcatalog ./internal/domainfront ./internal/adblock/... ./internal/singbox ./internal/hiddify ./internal/web/controller -count=1 | tee engines.jsonl
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Firewall routing and DNS UI contracts
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test -- src/test/firewall-autorefresh.test.tsx src/test/gateway-mode-control.test.tsx src/test/routing*.test.* src/test/dns*.test.* src/test/native-dns-editor.test.tsx src/test/singbox-route-rule.test.ts src/test/oxidns-settings.test.tsx src/test/dnstt-settings.test.tsx
      - name: Vet changed services
        run: go vet ./internal/web/service ./internal/web/controller ./internal/gateway ./internal/singbox
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: routing-contract-evidence
          path: '*.jsonl'
  dns-components:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Download checksum pinned DNS binaries
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/svenshi/oxidns/releases/download/v1.6.1/oxidns-x86_64-unknown-linux-musl.tar.gz -o "$RUNNER_TEMP/oxidns.tar.gz"
          echo "2ac8e103e03407a73c29da848f6ce2d524e751ce1da8a744aa9168fc1384e3b0  $RUNNER_TEMP/oxidns.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/oxidns.tar.gz" -C "$RUNNER_TEMP"
          base=https://github.com/NNdroid/dnstt/releases/download/2026-05-01-0c5c52a
          curl -fsSL --retry 3 "$base/dnstt-server-linux-amd64" -o "$RUNNER_TEMP/dnstt-server"
          curl -fsSL --retry 3 "$base/dnstt-client-linux-amd64" -o "$RUNNER_TEMP/dnstt-client"
          echo "def817a91ea0fce57c37c3d82c97799d7caa38618b8a73e94c05c14a1300560c  $RUNNER_TEMP/dnstt-server" | sha256sum -c -
          echo "92f7afb857740e482f577990bce601b9f0c5a9771e3890e20ce951e33e6e1e5c  $RUNNER_TEMP/dnstt-client" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/dnstt-server" "$RUNNER_TEMP/dnstt-client"
      - name: Real OxiDNS and DNSTT payload and TLS
        run: |
          set -o pipefail
          OXIDNS_CHECK_BINARY="$RUNNER_TEMP/oxidns" go test -race -json ./internal/oxidns -count=1 | tee oxidns.jsonl
          python3 tools/ci/require-go-tests.py oxidns.jsonl TestGeneratedYAMLAgainstOfficialBinary TestDoHCertificateAndOfficialParser TestOfficialOxiDNSForwardsRealTraffic
          DNSTT_SERVER_BINARY="$RUNNER_TEMP/dnstt-server" DNSTT_CLIENT_BINARY="$RUNNER_TEMP/dnstt-client" go test -race -json ./internal/dnstt -count=1 | tee dnstt.jsonl
          python3 tools/ci/require-go-tests.py dnstt.jsonl TestOfficialDNSTTTunnelRoundTrip
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dns-component-evidence
          path: '*.jsonl'
