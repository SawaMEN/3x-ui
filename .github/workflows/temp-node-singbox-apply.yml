name: temp-node-singbox-apply

on:
  push:
    branches:
      - temp/node-singbox-status

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temp/node-singbox-status
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Recover and apply implementation patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          previous = subprocess.check_output(
              ['git', 'show', 'c4489ac80bf466ff4186e126798ca16a75573c22:.github/workflows/temp-node-singbox-apply.yml'],
              text=True,
          )
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n"
          start = previous.index(start_marker) + len(start_marker)
          end = previous.index(end_marker, start)
          body = previous[start:end]
          body = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in body.splitlines()
          ) + '\n'
          body = re.sub(
              r"\n    if s\.count\(old\) != 1:\n        raise SystemExit\(f'non-unique replacement marker in \{path\}: \{old\[:120\]!r\}'\)\n",
              "\n",
              body,
              count=1,
          )
          body = body.replace(
              "if marker not in s:\n    raise SystemExit('NodeList version column marker missing')\n",
              "",
          )
          Path('/tmp/apply-node-singbox.py').write_text(body)
          PY
          python3 /tmp/apply-node-singbox.py

          python3 - <<'PY'
          from pathlib import Path

          p = Path('frontend/src/pages/nodes/NodeList.tsx')
          s = p.read_text()
          marker = (
              "      {\n"
              "        title: t('pages.nodes.xrayVersion'),\n"
              "        dataIndex: 'xrayVersion',\n"
              "        align: 'center',\n"
              "        render: (_value, record) => record.xrayVersion || '-',\n"
              "      },"
          )
          replacement = (
              "      {\n"
              "        title: 'Core',\n"
              "        dataIndex: 'runningCore',\n"
              "        align: 'center',\n"
              "        render: (_value, record) => (\n"
              "          <Tooltip title={`Configured: ${record.coreType || '-'}`}>\n"
              "            <Tag color={record.runningCore ? 'green' : 'default'} style={{ margin: 0 }}>\n"
              "              {record.runningCore || 'stopped'}\n"
              "            </Tag>\n"
              "          </Tooltip>\n"
              "        ),\n"
              "      },\n"
              "      {\n"
              "        title: t('pages.nodes.xrayVersion'),\n"
              "        dataIndex: 'xrayVersion',\n"
              "        align: 'center',\n"
              "        render: (_value, record) => record.xrayVersion || '-',\n"
              "      },\n"
              "      {\n"
              "        title: 'sing-box',\n"
              "        dataIndex: 'singboxVersion',\n"
              "        align: 'center',\n"
              "        render: (_value, record) =>\n"
              "          record.singboxInstalled === false ? 'not installed' : record.singboxVersion || '-',\n"
              "      },"
          )
          if marker not in s:
              raise SystemExit('current NodeList xray version column marker missing')
          p.write_text(s.replace(marker, replacement, 1))
          PY

          rm -f .github/workflows/temp-node-singbox-pr.yml
          gofmt -w internal/web/controller/server.go internal/web/service/node.go internal/database/model/model.go

      - name: Backend tests
        run: go test ./internal/web/controller ./internal/web/service ./internal/web/runtime ./internal/database/model

      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm run lint

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat(nodes): expose sing-box version and running core"
          git push origin HEAD:temp/node-singbox-status
