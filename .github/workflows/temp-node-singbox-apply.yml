name: temp-node-singbox-apply

on:
  push:
    branches:
      - temp/node-singbox-status

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temp/node-singbox-status
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply implementation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'missing replacement marker in {path}: {old[:120]!r}')
              if s.count(old) != 1:
                  raise SystemExit(f'non-unique replacement marker in {path}: {old[:120]!r}')
              p.write_text(s.replace(old, new, 1))

          # 1) Remote status: keep Xray status real, expose sing-box independently,
          # and report both configured and actually running core.
          p = Path('internal/web/controller/server.go')
          s = p.read_text()
          pattern = re.compile(r'func \(a \*ServerController\) status\(c \*gin\.Context\) \{.*?\n\}\n\nfunc \(a \*ServerController\) getFail2banStatus', re.S)
          replacement = r'''func (a *ServerController) status(c *gin.Context) {
              status := a.serverService.CurrentStatus()
              if status == nil {
                  jsonObj(c, status, nil)
                  return
              }
              statusSnapshot := *status
              status = &statusSnapshot

              coreType, err := a.settingService.GetCoreType()
              if err != nil || coreType == "" {
                  coreType = service.CoreTypeXray
              }

              singBoxState := service.Stop
              singBoxError := ""
              singBoxVersion := ""
              singBoxInstalled := false
              if version, versionErr := a.singBoxService.CachedVersion(c.Request.Context()); versionErr == nil && version != "" {
                  singBoxInstalled = true
                  singBoxVersion = version
              }
              if a.singBoxService.IsRunning() {
                  singBoxState = service.Running
              } else if coreErr := a.singBoxService.LastError(); coreErr != nil {
                  singBoxState = service.Error
                  singBoxError = coreErr.Error()
              }

              runningCore := ""
              switch {
              case coreType == service.CoreTypeSingBox && a.singBoxService.IsRunning():
                  runningCore = service.CoreTypeSingBox
              case coreType == service.CoreTypeXray && status.Xray.State == service.Running:
                  runningCore = service.CoreTypeXray
              case a.singBoxService.IsRunning():
                  runningCore = service.CoreTypeSingBox
              case status.Xray.State == service.Running:
                  runningCore = service.CoreTypeXray
              }

              raw, err := json.Marshal(status)
              if err != nil {
                  jsonObj(c, status, nil)
                  return
              }
              var obj map[string]any
              if err := json.Unmarshal(raw, &obj); err != nil {
                  jsonObj(c, status, nil)
                  return
              }

              obj["singbox"] = gin.H{
                  "installed": singBoxInstalled,
                  "state":     singBoxState,
                  "errorMsg":  singBoxError,
                  "version":   singBoxVersion,
              }

              selectedState := status.Xray.State
              selectedError := status.Xray.ErrorMsg
              selectedVersion := status.Xray.Version
              if coreType == service.CoreTypeSingBox {
                  selectedState = singBoxState
                  selectedError = singBoxError
                  selectedVersion = singBoxVersion
              }
              obj["core"] = gin.H{
                  "type":     coreType,
                  "running":  runningCore,
                  "state":    selectedState,
                  "errorMsg": selectedError,
                  "version":  selectedVersion,
              }
              jsonObj(c, obj, nil)
          }

          func (a *ServerController) getFail2banStatus'''
          s2, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit('server status function replacement failed')
          p.write_text(s2)

          # 2) Persist independent core status on nodes.
          replace_once(
              'internal/database/model/model.go',
              '\tXrayVersion   string  `json:"xrayVersion" example:"25.10.31"`\n\tPanelVersion  string  `json:"panelVersion" gorm:"column:panel_version" example:"v3.x.x"`',
              '\tXrayVersion      string  `json:"xrayVersion" example:"25.10.31"`\n\tSingBoxVersion   string  `json:"singboxVersion" gorm:"column:singbox_version"`\n\tSingBoxInstalled bool    `json:"singboxInstalled" gorm:"column:singbox_installed;default:false"`\n\tCoreType         string  `json:"coreType" gorm:"column:core_type"`\n\tRunningCore      string  `json:"runningCore" gorm:"column:running_core"`\n\tPanelVersion     string  `json:"panelVersion" gorm:"column:panel_version" example:"v3.x.x"`'
          )
          replace_once(
              'internal/database/model/model.go',
              '\tXrayState string `json:"xrayState" gorm:"column:xray_state"`\n\tXrayError string `json:"xrayError" gorm:"column:xray_error"`',
              '\tXrayState    string `json:"xrayState" gorm:"column:xray_state"`\n\tXrayError    string `json:"xrayError" gorm:"column:xray_error"`\n\tSingBoxState string `json:"singboxState" gorm:"column:singbox_state"`\n\tSingBoxError string `json:"singboxError" gorm:"column:singbox_error"`'
          )
          replace_once(
              'internal/database/model/model.go',
              '\tXrayVersion   string `json:"xrayVersion"`\n\t// XrayState/XrayError forwarded so masters can surface xray failure on transitive sub-nodes too.\n\tXrayState string `json:"xrayState"`\n\tXrayError string `json:"xrayError,omitempty"`',
              '\tXrayVersion      string `json:"xrayVersion"`\n\tSingBoxVersion   string `json:"singboxVersion"`\n\tSingBoxInstalled bool   `json:"singboxInstalled"`\n\tCoreType         string `json:"coreType"`\n\tRunningCore      string `json:"runningCore"`\n\t// Core states/errors are forwarded so masters can surface failures on transitive sub-nodes too.\n\tXrayState    string `json:"xrayState"`\n\tXrayError    string `json:"xrayError,omitempty"`\n\tSingBoxState string `json:"singboxState"`\n\tSingBoxError string `json:"singboxError,omitempty"`'
          )

          # 3) Heartbeat parser and persisted snapshot.
          replace_once(
              'internal/web/service/node.go',
              '\tXrayVersion   string\n\tPanelVersion  string',
              '\tXrayVersion      string\n\tSingBoxVersion   string\n\tSingBoxInstalled bool\n\tSingBoxKnown     bool\n\tCoreType         string\n\tRunningCore      string\n\tPanelVersion     string'
          )
          replace_once(
              'internal/web/service/node.go',
              '\tXrayState string\n\tXrayError string\n}',
              '\tXrayState    string\n\tXrayError    string\n\tSingBoxState string\n\tSingBoxError string\n}'
          )
          replace_once(
              'internal/web/service/node.go',
              '\t\t"xray_version":   p.XrayVersion,\n\t\t"panel_version":  p.PanelVersion,',
              '\t\t"panel_version": p.PanelVersion,\n\t\t"core_type":     p.CoreType,\n\t\t"running_core":  p.RunningCore,'
          )
          replace_once(
              'internal/web/service/node.go',
              '\t\t"xray_state":     p.XrayState,\n\t\t"xray_error":     p.XrayError,\n\t}',
              '\t\t"xray_state":     p.XrayState,\n\t\t"xray_error":     p.XrayError,\n\t}\n\t// Older node builds overload xray with the selected core. Never erase a\n\t// previously known Xray version when probing such a sing-box node.\n\tif p.XrayVersion != "" {\n\t\tupdates["xray_version"] = p.XrayVersion\n\t}\n\tif p.SingBoxKnown {\n\t\tupdates["singbox_version"] = p.SingBoxVersion\n\t\tupdates["singbox_installed"] = p.SingBoxInstalled\n\t\tupdates["singbox_state"] = p.SingBoxState\n\t\tupdates["singbox_error"] = p.SingBoxError\n\t}'
          )

          replace_once(
              'internal/web/service/node.go',
              '''\t\t\tXray struct {
\t\t\t\tVersion  string `json:"version"`
\t\t\t\tState    string `json:"state"`
\t\t\t\tErrorMsg string `json:"errorMsg"`
\t\t\t} `json:"xray"`
\t\t\tPanelVersion string `json:"panelVersion"`''',
              '''\t\t\tXray struct {
\t\t\t\tVersion  string `json:"version"`
\t\t\t\tState    string `json:"state"`
\t\t\t\tErrorMsg string `json:"errorMsg"`
\t\t\t} `json:"xray"`
\t\t\tSingBox *struct {
\t\t\t\tInstalled bool   `json:"installed"`
\t\t\t\tVersion   string `json:"version"`
\t\t\t\tState     string `json:"state"`
\t\t\t\tErrorMsg  string `json:"errorMsg"`
\t\t\t} `json:"singbox"`
\t\t\tCore struct {
\t\t\t\tType     string `json:"type"`
\t\t\t\tRunning  string `json:"running"`
\t\t\t\tState    string `json:"state"`
\t\t\t\tVersion  string `json:"version"`
\t\t\t\tErrorMsg string `json:"errorMsg"`
\t\t\t} `json:"core"`
\t\t\tPanelVersion string `json:"panelVersion"`'''
          )

          replace_once(
              'internal/web/service/node.go',
              '''\tpatch.XrayVersion = o.Xray.Version
\tpatch.XrayState = o.Xray.State
\tpatch.XrayError = o.Xray.ErrorMsg
\tpatch.PanelVersion = o.PanelVersion''',
              '''\tpatch.CoreType = o.Core.Type
\tpatch.RunningCore = o.Core.Running
\tif o.SingBox != nil {
\t\tpatch.SingBoxKnown = true
\t\tpatch.SingBoxInstalled = o.SingBox.Installed
\t\tpatch.SingBoxVersion = o.SingBox.Version
\t\tpatch.SingBoxState = o.SingBox.State
\t\tpatch.SingBoxError = o.SingBox.ErrorMsg
\t\tpatch.XrayVersion = o.Xray.Version
\t} else if o.Core.Type == CoreTypeSingBox {
\t\t// Compatibility with the first node-singbox-status implementation:
\t\t// it mirrored the selected sing-box into the legacy xray object.
\t\tpatch.SingBoxKnown = true
\t\tpatch.SingBoxVersion = o.Core.Version
\t\tif patch.SingBoxVersion == "" {
\t\t\tpatch.SingBoxVersion = o.Xray.Version
\t\t}
\t\tpatch.SingBoxInstalled = patch.SingBoxVersion != ""
\t\tpatch.SingBoxState = o.Core.State
\t\tpatch.SingBoxError = o.Core.ErrorMsg
\t} else {
\t\tpatch.XrayVersion = o.Xray.Version
\t}
\tpatch.XrayState = o.Xray.State
\tpatch.XrayError = o.Xray.ErrorMsg
\tif patch.RunningCore == "" && o.Core.State == string(Running) && patch.CoreType != "" {
\t\tpatch.RunningCore = patch.CoreType
\t}
\tif patch.CoreType == "" && o.Xray.State == string(Running) {
\t\tpatch.CoreType = CoreTypeXray
\t\tpatch.RunningCore = CoreTypeXray
\t}
\tpatch.PanelVersion = o.PanelVersion'''
          )

          replace_once(
              'internal/web/service/node.go',
              '\tXrayVersion  string  `json:"xrayVersion" example:"25.10.31"`\n\tPanelVersion string  `json:"panelVersion" example:"v3.x.x"`',
              '\tXrayVersion      string  `json:"xrayVersion" example:"25.10.31"`\n\tSingBoxVersion   string  `json:"singboxVersion"`\n\tSingBoxInstalled bool    `json:"singboxInstalled"`\n\tCoreType         string  `json:"coreType"`\n\tRunningCore      string  `json:"runningCore"`\n\tPanelVersion     string  `json:"panelVersion" example:"v3.x.x"`'
          )
          replace_once(
              'internal/web/service/node.go',
              '\tXrayState string `json:"xrayState"`\n\tXrayError string `json:"xrayError"`',
              '\tXrayState    string `json:"xrayState"`\n\tXrayError    string `json:"xrayError"`\n\tSingBoxState string `json:"singboxState"`\n\tSingBoxError string `json:"singboxError"`'
          )
          replace_once(
              'internal/web/service/node.go',
              '''\t\tLatencyMs:    p.LatencyMs,
\t\tXrayVersion:  p.XrayVersion,
\t\tPanelVersion: p.PanelVersion,''',
              '''\t\tLatencyMs:        p.LatencyMs,
\t\tXrayVersion:      p.XrayVersion,
\t\tSingBoxVersion:   p.SingBoxVersion,
\t\tSingBoxInstalled: p.SingBoxInstalled,
\t\tCoreType:         p.CoreType,
\t\tRunningCore:      p.RunningCore,
\t\tPanelVersion:     p.PanelVersion,'''
          )
          replace_once(
              'internal/web/service/node.go',
              '''\t\tXrayState:    p.XrayState,
\t\tXrayError:    p.XrayError,''',
              '''\t\tXrayState:    p.XrayState,
\t\tXrayError:    p.XrayError,
\t\tSingBoxState: p.SingBoxState,
\t\tSingBoxError: p.SingBoxError,'''
          )

          # Forward the new fields in node-tree projections wherever the existing
          # Xray fields are copied. These are deliberately narrow replacements.
          for path in Path('internal/web/service').glob('*.go'):
              text = path.read_text()
              text2 = text
              text2 = re.sub(
                  r'(XrayVersion:\s*([A-Za-z0-9_.]+)\.XrayVersion,\n)(\s*)(XrayState:\s*\2\.XrayState,\n\s*XrayError:\s*\2\.XrayError,)',
                  r'\1\3SingBoxVersion: \2.SingBoxVersion,\n\3SingBoxInstalled: \2.SingBoxInstalled,\n\3CoreType: \2.CoreType,\n\3RunningCore: \2.RunningCore,\n\3\4\n\3SingBoxState: \2.SingBoxState,\n\3SingBoxError: \2.SingBoxError,',
                  text2,
              )
              if text2 != text:
                  path.write_text(text2)

          # 4) Frontend schema.
          replace_once(
              'frontend/src/schemas/node.ts',
              '    xrayVersion: z.string().optional(),\n    panelVersion: z.string().optional(),',
              '    xrayVersion: z.string().optional(),\n    singboxVersion: z.string().optional(),\n    singboxInstalled: z.boolean().optional(),\n    coreType: z.string().optional(),\n    runningCore: z.string().optional(),\n    panelVersion: z.string().optional(),'
          )
          replace_once(
              'frontend/src/schemas/node.ts',
              '    xrayState: z.string().optional(),\n    xrayError: z.string().optional(),',
              '    xrayState: z.string().optional(),\n    xrayError: z.string().optional(),\n    singboxState: z.string().optional(),\n    singboxError: z.string().optional(),'
          )
          replace_once(
              'frontend/src/schemas/node.ts',
              '    xrayVersion: z.string().optional(),\n    error: z.string().optional(),',
              '    xrayVersion: z.string().optional(),\n    singboxVersion: z.string().optional(),\n    singboxInstalled: z.boolean().optional(),\n    coreType: z.string().optional(),\n    runningCore: z.string().optional(),\n    error: z.string().optional(),'
          )
          # Probe schema has a second xray state pair.
          probe_marker = '    // Present on successful probe; used to surface "connected to panel, but xray failed on node".\n    xrayState: z.string().optional(),\n    xrayError: z.string().optional(),'
          replace_once(
              'frontend/src/schemas/node.ts',
              probe_marker,
              '    // Present on successful probe; identifies the selected and actually running core.\n    xrayState: z.string().optional(),\n    xrayError: z.string().optional(),\n    singboxState: z.string().optional(),\n    singboxError: z.string().optional(),'
          )

          # 5) Nodes UI: health follows the active/configured core, not Xray unconditionally.
          p = Path('frontend/src/pages/nodes/NodeList.tsx')
          s = p.read_text()
          health_pattern = re.compile(r'interface HealthProps \{.*?\nfunction formatPct', re.S)
          health_block = r'''interface HealthProps {
            status?: string;
            xrayState?: string;
            xrayError?: string;
            singboxState?: string;
            singboxError?: string;
            coreType?: string;
            runningCore?: string;
          }

          const CORE_ERROR_COLOR = '#722ED1';

          function coreHealth(record: HealthProps) {
            const configured = (record.coreType || 'xray').toLowerCase();
            const state = configured === 'singbox' ? record.singboxState : record.xrayState;
            const error = configured === 'singbox' ? record.singboxError : record.xrayError;
            return { configured, state: (state || '').toLowerCase().trim(), error: error || '' };
          }

          function hasCoreProblem(record: HealthProps): boolean {
            if (record.status !== 'online') return false;
            if (record.runningCore) return false;
            const { state } = coreHealth(record);
            return state === 'error' || state === 'stop';
          }

          function statusIssue(record: Pick<NodeRecord, 'status' | 'xrayState' | 'xrayError' | 'singboxState' | 'singboxError' | 'coreType' | 'runningCore' | 'lastError'>) {
            const health = coreHealth(record);
            const tip = record.lastError || (hasCoreProblem(record) ? health.error : '') || '';
            const iconColor =
              !record.lastError && hasCoreProblem(record)
                ? CORE_ERROR_COLOR
                : 'var(--ant-color-warning)';
            return { tip, iconColor };
          }

          function StatusDot(props: HealthProps) {
            if (props.status === 'online') {
              return hasCoreProblem(props) ? <span className="xray-error-dot" /> : <span className="online-dot" />;
            }
            return <Badge status={badgeStatus(props.status)} />;
          }

          function StatusLabel(props: HealthProps) {
            const { t } = useTranslation();
            if (props.status === 'online') {
              const health = coreHealth(props);
              if (hasCoreProblem(props)) {
                return (
                  <span style={{ color: CORE_ERROR_COLOR }}>
                    {t('pages.nodes.statusValues.online')} ({health.configured}: {health.state || 'stopped'})
                  </span>
                );
              }
              return (
                <span style={{ color: 'var(--ant-color-success)' }}>
                  {t('pages.nodes.statusValues.online')}{props.runningCore ? ` (${props.runningCore})` : ''}
                </span>
              );
            }
            return <span>{t(`pages.nodes.statusValues.${props.status || 'unknown'}`)}</span>;
          }

          function formatPct'''
          s2, n = health_pattern.subn(health_block, s, count=1)
          if n != 1:
              raise SystemExit('NodeList health block replacement failed')
          s = s2
          s = s.replace(
              '<StatusDot status={record.status} xrayState={record.xrayState} />',
              '<StatusDot {...record} />',
              1,
          ).replace(
              '<StatusLabel status={record.status} xrayState={record.xrayState} />',
              '<StatusLabel {...record} />',
              1,
          )
          marker = '''      {
                title: t('pages.nodes.xrayVersion'),
                dataIndex: 'xrayVersion',
                align: 'center',
                render: (_value, record) => record.xrayVersion || '-',
              },'''
          replacement = '''      {
                title: 'Core',
                dataIndex: 'runningCore',
                align: 'center',
                render: (_value, record) => (
                  <Tooltip title={`Configured: ${record.coreType || '-'}`}>
                    <Tag color={record.runningCore ? 'green' : 'default'} style={{ margin: 0 }}>
                      {record.runningCore || 'stopped'}
                    </Tag>
                  </Tooltip>
                ),
              },
              {
                title: t('pages.nodes.xrayVersion'),
                dataIndex: 'xrayVersion',
                align: 'center',
                render: (_value, record) => record.xrayVersion || '-',
              },
              {
                title: 'sing-box',
                dataIndex: 'singboxVersion',
                align: 'center',
                render: (_value, record) =>
                  record.singboxInstalled === false
                    ? 'not installed'
                    : record.singboxVersion || '-',
              },'''
          if marker not in s:
              raise SystemExit('NodeList version column marker missing')
          s = s.replace(marker, replacement, 1)
          p.write_text(s)

          # Remove this temporary workflow from the final commit.
          Path('.github/workflows/temp-node-singbox-apply.yml').unlink()
          PY

          gofmt -w internal/web/controller/server.go internal/web/service/node.go internal/database/model/model.go

      - name: Backend tests
        run: go test ./internal/web/controller ./internal/web/service ./internal/web/runtime ./internal/database/model

      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm run lint

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat(nodes): expose sing-box version and running core"
          git push origin HEAD:temp/node-singbox-status
