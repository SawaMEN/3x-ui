name: Stage 9 API security and multi-node audit
on:
  push:
    branches: [update]
    paths:
      - 'internal/web/**'
      - 'internal/util/netsafe/**'
      - 'internal/util/netproxy/**'
      - 'tools/ci/require-go-tests.py'
      - '.github/workflows/stage9-security-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage9-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: API authorization, token scopes and header spoofing
        run: |
          set -o pipefail
          mkdir -p internal/web/dist && touch internal/web/dist/.gitkeep
          go test -race -json ./internal/web/controller -run '^(TestStage9APIAuthScopeMatrix|TestStage9UnverifiedProxyCertificateHeadersCannotAuthorizeAPI|TestCheckAPIAuth_.*|TestNodeSyncScopeAllowlistMatchesRemoteInventory|TestNodeSyncScopeUsesFullPathPatterns)$' -count=1 | tee stage9-api.jsonl
          python3 tools/ci/require-go-tests.py stage9-api.jsonl TestStage9APIAuthScopeMatrix TestStage9UnverifiedProxyCertificateHeadersCannotAuthorizeAPI TestNodeSyncScopeAllowlistMatchesRemoteInventory
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stage9-api-evidence
          path: stage9-api.jsonl

  node-mtls:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Real TLS handshake and client cert trust
        run: |
          set -o pipefail
          mkdir -p internal/web/dist && touch internal/web/dist/.gitkeep
          go test -race -json ./internal/web -run '^(TestApplyNodeMtls|TestPanelTLSAcceptsClientWithoutClientCert)$' -count=1 | tee stage9-tls-listener.jsonl
          python3 tools/ci/require-go-tests.py stage9-tls-listener.jsonl TestApplyNodeMtls TestPanelTLSAcceptsClientWithoutClientCert
      - name: mTLS credential rotation and fail closed
        run: |
          set -o pipefail
          go test -race -json ./internal/web/runtime -run '^(TestStage9RemoteDoMTLSRequiresHTTPS|TestStage9NodeTrustModeRejectsInvalidOrCleartextMTLS|TestHTTPClientForNodeMTLSRebuildsTLSConfigAfterCredentialInvalidation|TestHTTPClientForNodeProxyMTLSRebuildKeepsProxyAndNewCredential|TestTLSConfigForNode_MTLS_.*)$' -count=1 | tee stage9-mtls-client.jsonl
          python3 tools/ci/require-go-tests.py stage9-mtls-client.jsonl TestStage9RemoteDoMTLSRequiresHTTPS TestStage9NodeTrustModeRejectsInvalidOrCleartextMTLS TestHTTPClientForNodeMTLSRebuildsTLSConfigAfterCredentialInvalidation
          go test -race -json ./internal/web/service -run '^(TestNormalizeKeepsMtls|TestNodeMtlsCaCert|TestSetNodeMtlsTrustCA|TestReloadMasterMtlsClientDoesNotMintMissingCredential)$' -count=1 | tee stage9-mtls-service.jsonl
          python3 tools/ci/require-go-tests.py stage9-mtls-service.jsonl TestNormalizeKeepsMtls TestNodeMtlsCaCert
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stage9-mtls-evidence
          path: stage9-*.jsonl

  egress-ssrf:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: SSRF guard and proxy transport behavior
        run: |
          set -o pipefail
          mkdir -p internal/web/dist && touch internal/web/dist/.gitkeep
          go test -race -json ./internal/util/netsafe -count=1 | tee stage9-netsafe.jsonl
          go test -race -json ./internal/web/runtime -run '^(TestStage9NodeSOCKSProxyDoesNotBypassPrivateDestinationGuard|TestStage9NodeEgressHTTPProxyRequiresExplicitPrivateOptIn|TestStage9ProxyClientIdentityTracksPrivateOptIn|TestStage9NodeRequestsNeverFollowRedirects)$' -count=1 | tee stage9-ssrf.jsonl
          python3 tools/ci/require-go-tests.py stage9-ssrf.jsonl TestStage9NodeSOCKSProxyDoesNotBypassPrivateDestinationGuard TestStage9NodeEgressHTTPProxyRequiresExplicitPrivateOptIn TestStage9ProxyClientIdentityTracksPrivateOptIn TestStage9NodeRequestsNeverFollowRedirects
          go test -race -json ./internal/web/service -run '^(TestSubscriptionFetchClientBlocksPrivateDial|TestNodeCertProbeDoesNotSendHTTPToUntrustedPeer)$' -count=1 | tee stage9-ssrf-service.jsonl
          python3 tools/ci/require-go-tests.py stage9-ssrf-service.jsonl TestSubscriptionFetchClientBlocksPrivateDial TestNodeCertProbeDoesNotSendHTTPToUntrustedPeer
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stage9-ssrf-evidence
          path: stage9-*.jsonl

  multi-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Node identity, cache and re-entrant resolver isolation
        run: |
          set -o pipefail
          mkdir -p internal/web/dist && touch internal/web/dist/.gitkeep
          go test -race -json ./internal/web/runtime -run '^(TestStage9RemoteCacheAndIdentityIsolatedPerNode|TestManagerEgressResolverMayReenterManager|TestManagerEgressResolverConcurrentReplacement)$' -count=1 | tee stage9-multinode.jsonl
          python3 tools/ci/require-go-tests.py stage9-multinode.jsonl TestStage9RemoteCacheAndIdentityIsolatedPerNode TestManagerEgressResolverMayReenterManager TestManagerEgressResolverConcurrentReplacement
          go test -race -json ./internal/web/service -run '^(TestNodeCannotClaimClientOfAnotherInbound|TestNodeCredentialsNeverMarshal|TestNodeViewExposesOnlyCredentialPresence|TestNodeToken_EncryptedAtRest_PlaintextInMemory|TestSetRemoteTraffic_DropsForeignActiveInboundGuid|TestEffectiveNodeKey_FallsBackOnCollision|TestRecountByGuid_SplitsClonedNodesWithSharedGuid)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stage9-multinode-evidence
          path: stage9-*.jsonl

  failures-and-vet:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Race regressions and static checks
        run: |
          set -o pipefail
          mkdir -p internal/web/dist && touch internal/web/dist/.gitkeep
          go test -race -json ./internal/web/runtime -run '^(TestStage9.*|TestManagerEgressResolverConcurrentReplacement|TestCredentialRotatingTransport.*)$' -count=3 | tee stage9-race.jsonl
          python3 tools/ci/require-go-tests.py stage9-race.jsonl TestStage9RemoteCacheAndIdentityIsolatedPerNode TestStage9NodeSOCKSProxyDoesNotBypassPrivateDestinationGuard TestStage9NodeTrustModeRejectsInvalidOrCleartextMTLS
          go vet ./internal/web/runtime ./internal/web/controller ./internal/web/service ./internal/util/netsafe
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stage9-race-evidence
          path: stage9-race.jsonl
 -count=1 | tee stage9-node-service.jsonl
          python3 tools/ci/require-go-tests.py stage9-node-service.jsonl TestNodeCannotClaimClientOfAnotherInbound TestNodeCredentialsNeverMarshal TestNodeViewExposesOnlyCredentialPresence TestSetRemoteTraffic_DropsForeignActiveInboundGuid TestEffectiveNodeKey_FallsBackOnCollision TestRecountByGuid_SplitsClonedNodesWithSharedGuid
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stage9-multinode-evidence
          path: stage9-*.jsonl

  failures-and-vet:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Race regressions and static checks
        run: |
          set -o pipefail
          mkdir -p internal/web/dist && touch internal/web/dist/.gitkeep
          go test -race -json ./internal/web/runtime -run '^(TestStage9.*|TestManagerEgressResolverConcurrentReplacement|TestCredentialRotatingTransport.*)$' -count=3 | tee stage9-race.jsonl
          python3 tools/ci/require-go-tests.py stage9-race.jsonl TestStage9RemoteCacheAndIdentityIsolatedPerNode TestStage9NodeSOCKSProxyDoesNotBypassPrivateDestinationGuard TestStage9NodeTrustModeRejectsInvalidOrCleartextMTLS
          go vet ./internal/web/runtime ./internal/web/controller ./internal/web/service ./internal/util/netsafe
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stage9-race-evidence
          path: stage9-race.jsonl
