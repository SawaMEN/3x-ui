name: Regenerate CI fix artifacts

on:
  push:
    branches:
      - fix/ci-compilation-tests-20261001

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Regenerate schemas, examples and OpenAPI
        run: npm run gen
        working-directory: frontend
      - name: Commit generated artifacts and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/generated frontend/public/openapi.json
          git rm .github/workflows/regenerate-ci-fix.yml
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 1
          fi
          git commit -m "chore(frontend): regenerate API artifacts"
          git push origin HEAD:${{ github.ref_name }}
