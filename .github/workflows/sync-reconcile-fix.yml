name: Reconcile upstream sync

on:
  push:
    branches:
      - sync-upstream-2026-10-03
    paths:
      - .github/workflows/sync-reconcile-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Reconcile and commit
        run: |
          git remote add upstream https://github.com/MHSanaei/3x-ui.git || true
          git fetch --depth=1 upstream main
          git fetch origin main
          python3 tools/reconcile_upstream_sync.py
          git show origin/main:.github/workflows/smoke.yml > .github/workflows/smoke.yml
          rm -f .github/workflows/sync-reconcile-fix.yml tools/reconcile_upstream_sync.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(sync): reconcile upstream TUIC and merge fallout"
          git push origin HEAD:sync-upstream-2026-10-03
