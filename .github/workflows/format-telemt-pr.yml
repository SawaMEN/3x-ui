name: Format Telemt integration
on:
  push:
    branches: [feat/telemt-native-optional-inbounds]
    paths:
      - "frontend/src/pages/inbounds/InboundsPage.tsx"
      - "frontend/src/pages/index/TelemtConnectionsCard.tsx"
      - "frontend/src/pages/telemt/TelemtPage.tsx"
      - ".github/workflows/format-telemt-pr.yml"
permissions:
  contents: write
jobs:
  format:
    if: "!startsWith(github.event.head_commit.message, 'chore(format):')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply project formatter
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx oxfmt src/pages/inbounds/InboundsPage.tsx src/pages/index/TelemtConnectionsCard.tsx src/pages/telemt/TelemtPage.tsx
      - name: Commit formatted files to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/inbounds/InboundsPage.tsx frontend/src/pages/index/TelemtConnectionsCard.tsx frontend/src/pages/telemt/TelemtPage.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(format): apply oxfmt on Telemt integration"
          git push origin HEAD:feat/telemt-native-optional-inbounds
