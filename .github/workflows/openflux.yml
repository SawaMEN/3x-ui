name: OpenFlux integration

on:
  push:
    branches: [main]
    paths:
      - "internal/externalvpn/**"
      - "internal/web/controller/server_openflux*"
      - "internal/web/runtime/openflux*"
      - "frontend/src/**openflux*"
      - "frontend/src/**/OpenFlux*"
      - "frontend/src/components/openflux/**"
      - "frontend/src/api/http-init.ts"
      - "frontend/src/test/http-init.test.tsx"
      - "frontend/src/pages/inbounds/form/protocols/additional-vpn.tsx"
      - "frontend/src/schemas/protocols/inbound/additional-vpn.ts"
      - "internal/web/translation/en-US.json"
      - "internal/web/translation/ru-RU.json"
      - "docs/openflux-*"
      - ".github/workflows/openflux.yml"
  pull_request:
    paths:
      - "internal/externalvpn/**"
      - "internal/web/controller/server_openflux*"
      - "internal/web/runtime/openflux*"
      - "frontend/src/**openflux*"
      - "frontend/src/**/OpenFlux*"
      - "frontend/src/components/openflux/**"
      - "frontend/src/api/http-init.ts"
      - "frontend/src/test/http-init.test.tsx"
      - "frontend/src/pages/settings/SystemUpdatePanel*"
      - "frontend/src/pages/inbounds/form/protocols/additional-vpn.tsx"
      - "frontend/src/schemas/protocols/inbound/additional-vpn.ts"
      - ".github/workflows/openflux.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openflux-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Download pinned official OpenFlux
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/openflux" https://github.com/p1neappleXpress/OpenFlux/releases/download/v0.17.1/openflux-linux-amd64
          echo "c0d00461e8cc59e48429b239fd8044b1c1aaa3769968a7c9160c488f4bd63f3b  $RUNNER_TEMP/openflux" | sha256sum --check
          chmod 755 "$RUNNER_TEMP/openflux"
      - name: Check Go behavior and real encrypted TCP payload
        env:
          STAGE8_OPENFLUX_BINARY: ${{ runner.temp }}/openflux
        run: |
          go test ./internal/externalvpn -run 'TestOpenFlux|TestManagedVPNOpenFluxContract|TestStage8OpenFluxNativePayload' -count=1 -v -timeout=5m
          mkdir -p internal/web/dist
          touch internal/web/dist/index.html
          go test ./internal/web/controller ./internal/web/runtime ./internal/util/link -run 'TestOpenFlux|TestNodeSyncScopeAllow' -count=1 -timeout=5m
      - name: Report canonical formatting
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          files = [
            "internal/externalvpn/additional_review_test.go", "internal/externalvpn/instance.go", "internal/externalvpn/additional.go", "internal/externalvpn/additional_process.go",
            "internal/externalvpn/decode.go", "internal/externalvpn/openflux_install.go",
            "internal/externalvpn/openflux_automation_test.go", "internal/externalvpn/openflux_component_test.go",
            "internal/externalvpn/openflux_diagnostics.go", "internal/externalvpn/openflux_diagnostics_test.go", "internal/externalvpn/update.go",
            "internal/externalvpn/outbound.go", "internal/web/controller/api.go",
            "internal/web/controller/api_auth_test.go", "internal/web/controller/server_externalvpn.go",
            "internal/web/controller/server_openflux.go", "internal/web/controller/server_openflux_test.go", "internal/web/controller/server_openflux_diagnostic_jobs.go",
            "internal/web/runtime/openflux_install.go", "internal/web/service/component_remove.go",
          ]
          for path in files:
              result = subprocess.run(["gofmt", path], check=True, text=True, capture_output=True).stdout
              if result != pathlib.Path(path).read_text():
                  for start in range(0, len(result), 4000):
                      print("OPENFLUX_FORMAT_CHUNK=" + json.dumps({"path": path, "offset": start, "content": result[start:start+4000]}, ensure_ascii=True))
          PY



  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Report canonical frontend formatting
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          files = ["frontend/src/test/outbound-form-modal.test.tsx","frontend/src/test/singbox-outbound-modal.test.tsx","frontend/src/test/native-protocol-option-fields.test.tsx","frontend/src/api/useOpenFluxInstalled.ts","frontend/src/test/openflux-availability.test.tsx","frontend/src/test/inbound-form-modal.test.tsx","frontend/src/pages/singbox/SingBoxOutboundModal.tsx","frontend/src/pages/xray/outbounds/OutboundFormModal.tsx","frontend/src/lib/openflux.ts","frontend/src/schemas/protocols/inbound/additional-vpn.ts","frontend/src/api/openflux-install.ts","frontend/src/pages/inbounds/form/InboundFormModal.tsx","frontend/src/pages/inbounds/form/protocols/additional-vpn.tsx","frontend/src/pages/xray/outbounds/OpenFluxOutboundEditor.tsx","frontend/src/pages/xray/outbounds/AdditionalOutboundEditor.tsx","frontend/src/pages/settings/SystemUpdatePanel.tsx","frontend/src/test/openflux-settings.test.ts","frontend/src/test/openflux-install.test.ts","frontend/src/test/openflux-fields.test.tsx", "frontend/src/test/system-update-components.test.tsx", "frontend/src/components/openflux/OpenFluxChannels.tsx", "frontend/src/pages/inbounds/form/protocols/OpenFluxFields.tsx"]
          formatter = pathlib.Path("frontend/node_modules/.bin/oxfmt")
          if formatter.exists():
              original = {path: pathlib.Path(path).read_text() for path in files}
              subprocess.run([str(formatter), *files], check=True)
              for path in files:
                  result = pathlib.Path(path).read_text()
                  if result != original[path]:
                      for start in range(0, len(result), 4000):
                          print("OPENFLUX_TS_CHUNK=" + json.dumps({"path": path, "offset": start, "content": result[start:start+4000]}, ensure_ascii=True))
          PY

      - name: Check frontend types, lint and OpenFlux behavior
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
          npx vitest run --project unit src/test/openflux-settings.test.ts src/test/openflux-install.test.ts
          npx vitest run --project components src/test/http-init.test.tsx
          npx vitest run --project components src/test/openflux-fields.test.tsx src/test/system-update-components.test.tsx src/test/openflux-availability.test.tsx src/test/openflux-qr.test.tsx src/test/singbox-outbound-modal.test.tsx src/test/native-protocol-option-fields.test.tsx
          npx vitest run --project components src/test/inbound-form-modal.test.tsx -t 'shows optional tunnel protocols'
          npx vitest run --project components src/test/outbound-form-modal.test.tsx -t 'offers OpenFlux'
