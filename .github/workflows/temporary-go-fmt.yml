name: Temporary Go source formatter

on:
  push:
    branches:
      - fix/main-ci-followup-20261028

permissions:
  contents: write

jobs:
  format:
    if: "!startsWith(github.event.head_commit.message, 'style: automatic Go formatting')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          install-only: true
      - name: Apply repository Go formatting rules
        run: |
          golangci-lint fmt
          git diff --stat
      - name: Push formatted sources to working branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: automatic Go formatting"
          git push origin HEAD:fix/main-ci-followup-20261028
