name: Temporary Telemt UI formatter
on:
  push:
    branches: [refactor/mtproto-native-web-lifecycle]
    paths:
      - ".github/workflows/telemt-ui-format.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Format Telemt settings
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx oxfmt src/pages/settings/SystemUpdateModal.tsx
      - name: Save formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/settings/SystemUpdateModal.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(telemt): format update controls"
          git push origin HEAD:refactor/mtproto-native-web-lifecycle
