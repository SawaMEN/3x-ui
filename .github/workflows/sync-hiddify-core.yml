name: Synchronize latest Sing-box kernel

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: xui-kernel-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.9"
      - name: Resolve latest owned-fork revisions
        id: target
        run: |
          set -euo pipefail
          python3 tools/sync-hiddify-latest.py --write
          git diff --check
          if git diff --quiet -- docs/hiddify-core-target.json internal/hiddify/translate.go; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Audit and build candidate kernel before publication
        if: steps.target.outputs.changed == 'true'
        env:
          SINGBOX_CRONET_LINKAGE: purego
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          python3 tools/audit-hiddify-migration.py
          bash tools/build-hiddify-core.sh "$RUNNER_TEMP/sing-box-candidate"
      - name: Commit validated revision and trigger panel release
        if: steps.target.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/hiddify-core-target.json internal/hiddify/translate.go
          git commit -m "chore(core): track latest validated Hiddify and Sing-box revisions"
          git push origin HEAD:main
          # GITHUB_TOKEN pushes do not run on:push workflows; dispatch explicitly.
          gh workflow run release.yml --ref main
