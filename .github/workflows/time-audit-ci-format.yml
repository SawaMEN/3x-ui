name: Time audit - one-shot CI format

on:
  push:
    branches: [time]
    paths:
      - '.github/workflows/time-audit-ci-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Format Go diagnostics and service
        run: |
          go run mvdan.cc/gofumpt@v0.9.2 -w \
            internal/web/service/server.go \
            internal/web/service/server_diagnostic_logs.go \
            internal/web/service/server_diagnostic_logs_test.go
      - name: Format frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run format
      - name: Validate diff and publish formatting
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/web/service/server.go internal/web/service/server_diagnostic_logs.go internal/web/service/server_diagnostic_logs_test.go frontend/src frontend/tools
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(time): normalize Go and frontend CI formatting"
          git push origin HEAD:time
