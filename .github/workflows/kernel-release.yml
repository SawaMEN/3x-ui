name: Release modified Sing-box
on:
  push:
    branches: [update]
    paths: [.github/workflows/kernel-release.yml]
permissions:
  contents: read
concurrency:
  group: sing-box-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-location:
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Kernel releases are published in SawaMEN/hiddify-core.'
