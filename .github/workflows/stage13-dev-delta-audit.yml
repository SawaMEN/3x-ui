name: Stage 13 immutable DEV-main compatibility audit

on:
  push:
    branches: [update]
    paths:
      - .github/workflows/stage13-dev-delta-audit.yml
      - tools/ci/stage13_commit_inventory.py
      - tools/ci/test_stage13_security_dependencies.py
      - tools/audit-hiddify-migration.py
      - docs/audits/**
      - docs/hiddify-core-target.json
      - internal/**
      - frontend/**
      - core-migration.sh
      - install.sh
      - update.sh
      - tools/build-hiddify-core.sh
  pull_request:
    paths:
      - .github/workflows/stage13-dev-delta-audit.yml
      - tools/ci/stage13_commit_inventory.py
      - tools/ci/test_stage13_security_dependencies.py
      - tools/audit-hiddify-migration.py
      - docs/audits/**
      - docs/hiddify-core-target.json
      - internal/**
      - frontend/**
      - core-migration.sh
      - install.sh
      - update.sh
      - tools/build-hiddify-core.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage13-dev-delta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  immutable-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check all 131 historic commits and 283 subsequent commits against pinned SHAs
        run: python3 tools/ci/stage13_commit_inventory.py --output stage13-evidence
      - name: Preserve complete commit-path candidate-check inventory
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stage13-immutable-history
          path: stage13-evidence/

  kernel-security-pins:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Python inventory and lockfile unit checks
        run: |
          python3 tools/audit-hiddify-migration.py
          python3 -m unittest discover -s tools/ci -p 'test_stage13_security_dependencies.py' -v
          bash -n tools/build-hiddify-core.sh core-migration.sh install.sh update.sh

  historic-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Provide Go embed assets
        run: mkdir -p internal/web/dist && touch internal/web/dist/.gitkeep
      - name: Run targeted historical logger, tail, core recovery, TLS and external transport tests
        run: |
          go test -race -short -vet=off -timeout=15m -count=2 \
            -run '^(TestGetLogs|TestInitLogger|TestReadTail|TestRecentOutputBuffer|TestCoreRecoveryBackoff|TestTLSCipherCompatibility|TestVetroffManagedOutbound|TestVetroffFakeSocksSidecar)' \
            ./internal/logger ./internal/util/tail ./internal/web/job ./internal/singbox ./internal/externalvpn

  historic-service-websocket:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Provide Go embed assets
        run: mkdir -p internal/web/dist && touch internal/web/dist/.gitkeep
      - name: Verify diagnostic parse, native share, WebSocket and source log semantics under race
        run: |
          go test -race -short -vet=off -count=2 -timeout=15m \
            -run '^(TestDiagnostic|TestGetFileLogs|TestHub|TestStage12)' \
            ./internal/web/service ./internal/web/websocket

  historical-frontend-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install immutable frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck and test historic Quick Routing, inbound mapping, WebSocket and chunk recovery
        working-directory: frontend
        run: |
          npm run typecheck
          npm test -- src/test/quick-routing.test.ts src/test/routing-inbound-bindings.test.ts src/test/native-inbound-bindings.test.ts src/test/websocket-handler-freshness.test.tsx src/test/chunk-load-recovery.test.ts src/test/legacy-cipher-options.test.ts
      - name: Ensure generated TypeScript and OpenAPI exactly match the backend
        working-directory: frontend
        run: npm run gen
      - name: Reject stale generated frontend and docs contracts
        run: git diff --exit-code -- frontend/src/generated frontend/public/openapi.json docs/public/openapi.json
