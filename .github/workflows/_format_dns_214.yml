name: Temporary DNS formatter for PR 214

on:
  push:
    branches:
      - feature/dns-olcrtc-arch-20261019

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply project formatter
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx oxfmt src/pages/singbox/DnsWorkspace.tsx
      - name: Commit formatting
        run: |
          if ! git diff --quiet -- frontend/src/pages/singbox/DnsWorkspace.tsx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/src/pages/singbox/DnsWorkspace.tsx
            git commit -m "style(dns): format service availability controls"
            git push origin HEAD:feature/dns-olcrtc-arch-20261019
          fi
