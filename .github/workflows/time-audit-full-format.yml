name: Time audit - identify and normalize gofumpt errors

on:
  push:
    branches: [time]
    paths:
      - '.github/workflows/time-audit-full-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: List and format Go files requiring gofumpt
        run: |
          go run mvdan.cc/gofumpt@v0.9.2 -l . | tee /tmp/audit-unformatted.txt
          count=$(wc -l < /tmp/audit-unformatted.txt)
          echo "Unformatted Go files: $count"
          if [ "$count" -gt 50 ]; then
            echo "Refusing to reformat over 50 Go files without review"
            exit 1
          fi
          if [ "$count" -gt 0 ]; then
            while IFS= read -r file; do
              go run mvdan.cc/gofumpt@v0.9.2 -w "$file"
            done < /tmp/audit-unformatted.txt
          fi
          git diff --check
      - name: Commit formatting to time
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u '*.go'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(time): format all remaining gofumpt violations"
          git push origin HEAD:time
