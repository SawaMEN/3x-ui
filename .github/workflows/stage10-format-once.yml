name: One-shot stage 10 frontend formatter
on:
  push:
    branches: [update]
    paths:
      - '.github/workflows/stage10-format-once.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message == 'chore(stage10): run one-shot frontend formatting'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned formatter and apply to the eight reported files
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx oxfmt \
            src/pages/api-docs/endpoints.ts \
            src/pages/inbounds/form/protocols/MtprotoWebStatus.tsx \
            src/pages/inbounds/form/protocols/mtproto.tsx \
            src/pages/index/TelemtConnectionsCard.tsx \
            src/pages/login/LoginPage.css \
            src/pages/telemt/TelemtWebSiteFields.tsx \
            src/schemas/telemt-web.ts \
            tools/stage10-browser-smoke.mjs
          npm run format:check
      - name: Commit only verified formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/pages/api-docs/endpoints.ts \
            frontend/src/pages/inbounds/form/protocols/MtprotoWebStatus.tsx \
            frontend/src/pages/inbounds/form/protocols/mtproto.tsx \
            frontend/src/pages/index/TelemtConnectionsCard.tsx \
            frontend/src/pages/login/LoginPage.css \
            frontend/src/pages/telemt/TelemtWebSiteFields.tsx \
            frontend/src/schemas/telemt-web.ts \
            frontend/tools/stage10-browser-smoke.mjs
          if git diff --cached --quiet; then
            echo 'No formatting changes'; exit 0
          fi
          git commit -m 'style(stage10): format frontend components and viewport smoke'
          git pull --rebase origin update
          git push origin HEAD:update
