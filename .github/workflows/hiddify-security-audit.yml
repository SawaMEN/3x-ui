name: Pinned Hiddify core security audit

on:
  schedule:
    - cron: "41 3 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pinned-hiddify-security
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install musl toolchain for production-equivalent scan
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools lld binutils
          echo "CC=musl-gcc" >> "$GITHUB_ENV"
          echo "CGO_CFLAGS=-D_LARGEFILE64_SOURCE" >> "$GITHUB_ENV"
      - name: Build and rescan exact production kernel without binary cache
        env:
          GOOS: linux
          GOARCH: amd64
        run: HIDDIFY_VULNCHECK=1 SINGBOX_CRONET_LINKAGE=musl bash tools/build-hiddify-core.sh "$RUNNER_TEMP/core-security"
      - name: Verify statically linked production kernel
        run: |
          (cd "$RUNNER_TEMP/core-security" && sha256sum -c hiddify-core-linux-amd64.sha256)
          test -s "$RUNNER_TEMP/core-security/target.json"
