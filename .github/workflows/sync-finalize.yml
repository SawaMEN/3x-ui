name: Finalize upstream sync

on:
  push:
    branches:
      - sync-upstream-2026-10-03
    paths:
      - .github/workflows/sync-finalize.yml
      - tools/finalize_upstream_sync.py

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Apply final fixes
        run: |
          python3 tools/finalize_upstream_sync.py
          gofmt -w internal/web/service/xray.go internal/web/service/inbound_clients_tuic_test.go
          corepack enable
          cd docs
          pnpm install --frozen-lockfile
          pnpm exec oxfmt adblock.md architecture.md youtube-server-filter.md
          cd ..
      - name: Commit finalized sync
        run: |
          rm -f .github/workflows/sync-finalize.yml tools/finalize_upstream_sync.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(sync): restore TUIC imports and format docs"
          git push origin HEAD:sync-upstream-2026-10-03
