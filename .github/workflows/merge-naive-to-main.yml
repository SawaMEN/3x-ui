name: Squash naive safely into main

on:
  push:
    branches:
      - naive

permissions:
  contents: write

concurrency:
  group: squash-naive-into-main
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build final change on current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin naive
          BASE_SHA="$(git rev-parse HEAD)"
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          git checkout origin/naive -- internal/naiveproxy internal/web/controller/naiveproxy.go internal/web/service/telemt_webproxy_test.go
          git show origin/naive:.github/scripts/merge_naive_to_main.py > /tmp/merge_naive_to_main.py
          git show origin/naive:.github/scripts/merge_naive_followup.py > /tmp/merge_naive_followup.py
          python3 /tmp/merge_naive_to_main.py
          python3 /tmp/merge_naive_followup.py
          gofmt -w internal/naiveproxy/*.go internal/web/controller/api.go internal/web/controller/naiveproxy.go internal/util/systemupdate/manager_linux.go internal/sub/json_service_test.go internal/web/service/telemt_webproxy_test.go
          cd frontend
          npm ci --no-audit --no-fund
          npx oxfmt --write \
            src/pages/settings/SystemUpdateModal.tsx \
            src/pages/api-docs/endpoints.ts \
            src/lib/xray/inbound-defaults.ts \
            src/pages/inbounds/form/InboundFormModal.tsx \
            src/pages/inbounds/form/protocols/external-vpn.tsx
          cd ..
          git add -A

      - name: Test backend
        shell: bash
        run: |
          mkdir -p internal/web/dist
          touch internal/web/dist/.gitkeep
          go test -p 12 -vet=off -shuffle=on -count=1 ./...
          rm -f internal/web/dist/.gitkeep
          rmdir internal/web/dist 2>/dev/null || true

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm run lint
          npm run format:check
          npm run typecheck
          npm test
          npm run build:ci

      - name: Commit once and push main
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git commit -m "feat: integrate standalone NaiveProxy"
          git push origin HEAD:main
