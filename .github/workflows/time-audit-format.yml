name: Time audit - one-shot Go formatting

on:
  push:
    branches: [time]
    paths:
      - '.github/workflows/time-audit-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Format diagnostic source and tests
        run: |
          go run mvdan.cc/gofumpt@v0.9.2 -w \
            internal/web/service/server_diagnostic_logs.go \
            internal/web/service/server_diagnostic_logs_test.go
          git diff --check
      - name: Commit formatting changes to time
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/web/service/server_diagnostic_logs.go internal/web/service/server_diagnostic_logs_test.go
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(time): format audit Go changes"
          git push origin HEAD:time
