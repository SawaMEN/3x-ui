name: Protocol and TLS audit
on:
  push:
    branches: [update]
    paths: ['deploy/hiddify/**', 'docs/hiddify-core-target.json', 'tools/build-hiddify-core.sh', 'internal/hiddify/**', 'internal/sub/**', '.github/workflows/protocol-audit.yml', 'internal/singbox/**', 'internal/web/service/**', 'internal/web/runtime/**', '.github/workflows/runtime-audit.yml', 'tools/ci/download-audit-cores.sh', 'tools/ci/protocol-matrix.py', 'frontend/src/lib/xray/**', 'frontend/src/schemas/protocols/**', 'frontend/src/test/**', 'go.mod', 'go.sum']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: protocol-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  protocols:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare assets and dependencies
        run: mkdir -p internal/web/dist && touch internal/web/dist/.gitkeep && bash tools/ci/download-go-modules.sh
      - name: Download pinned and checksum-verified native engines
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/ci/download-audit-cores.sh ${{ matrix.arch }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend transport-switch contracts
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test -- src/test/finalmask.test.ts src/test/stage5-transport-switch.test.ts src/test/stream-wire-normalize.test.ts src/test/stream.test.ts src/test/protocol-capabilities.test.ts
      - name: TLS normalization and core compatibility regressions
        env:
          STAGE5_CAPABILITY_OUTPUT: ${{ github.workspace }}/capability-inbounds.json
        run: |
          set -o pipefail
          go test -race -p 2 -json ./internal/singbox ./internal/hiddify -count=1 | tee translation.jsonl
          python3 tools/ci/require-go-tests.py translation.jsonl TestConfigMarshalNativeTLSCompatibility TestConfigMarshalRejectsInvalidNativeTLSCipherSuites TestConfigMarshalAcceptsNativeCipherDefaultsAndScalar TestStage5TLSNormalizationPreservesSharedSubtrees TestStage5TranslatorOmitsExplicitlyDisabledClients TestStage5DisabledProxyClientsCannotBecomeAnonymous TestStage5ReverseMappingSkipsDisabledUsers TestStage5ProxyTranslationPreservesClientBackingArray
          go test -race -p 2 -json ./internal/web/service -run '^(TestStage5|TestSyncClientCoreCompatibility|TestUpdateInbound_(RejectsUnknownProtocolOnNode|NodeMtprotoShareAddrIsEditable))' -count=1 | tee compatibility.jsonl
          python3 tools/ci/require-go-tests.py compatibility.jsonl TestStage5LocalProtocolCompatibility TestStage5IncompatibleProtocolNeverPersists TestStage5ProtocolUsesStoredNodeCore TestStage5UnknownProtocolRejected TestStage5XDNSFormatNeverSilentlyChanges TestUpdateInbound_RejectsUnknownProtocolOnNode TestUpdateInbound_NodeMtprotoShareAddrIsEditable
      - name: Shuffled Telegram fixture isolation
        run: |
          set -o pipefail
          go test -race -p 2 -json -shuffle=on ./internal/web/service/tgbot -count=3 | tee telegram-shuffle.jsonl
          python3 tools/ci/require-go-tests.py telegram-shuffle.jsonl TestScreenArtReprobeWindow
      - name: Owner native schema contracts
        if: ${{ !cancelled() }}
        env:
          HIDDIFY_CONFIG_CHECK_BINARY: ${{ env.XUI_STAGE4_CORE_DIR }}/owner/x-ui/bin/hiddify-core-linux-${{ matrix.arch }}
          SINGBOX_TEST_BINARY: ${{ env.XUI_STAGE4_CORE_DIR }}/owner/x-ui/bin/hiddify-core-linux-${{ matrix.arch }}
        run: |
          set -o pipefail
          go test -race -p 2 -json ./internal/hiddify -run '^(TestStage5XDriveXrayValidator|TestPinnedBinaryChecksGeneratedConfigurations|TestPinnedProtocolTransportMatrix)$' -count=1 | tee owner-schema.jsonl
          python3 tools/ci/require-go-tests.py owner-schema.jsonl TestStage5XDriveXrayValidator TestPinnedBinaryChecksGeneratedConfigurations TestPinnedProtocolTransportMatrix
          go test -race -p 2 -json ./internal/singbox -run '^(TestNativeOutboundBinaryMatrix|TestMASQUEBinaryConfig|TestWARPMASQUEBinaryConfig)$' -count=1 | tee native-schema.jsonl
          python3 tools/ci/require-go-tests.py native-schema.jsonl TestNativeOutboundBinaryMatrix TestMASQUEBinaryConfig TestWARPMASQUEBinaryConfig
      - name: Owner real traffic and XHTTP modes
        if: ${{ !cancelled() }}
        env:
          HIDDIFY_RUNTIME_BINARY: ${{ env.XUI_STAGE4_CORE_DIR }}/owner/x-ui/bin/hiddify-core-linux-${{ matrix.arch }}
        run: |
          set -o pipefail
          go test -race -p 2 -json ./internal/hiddify -run '^(TestStage5ExtendedProtocolTraffic|TestStage5ExplicitLegacyCipherTraffic|TestStage5ProtocolTraffic|TestPinnedBinaryRawRuntimeAndStatistics|TestXHTTPRuntimeTransfer)$' -count=1 | tee owner-transfer.jsonl
          python3 tools/ci/require-go-tests.py owner-transfer.jsonl TestStage5ExtendedProtocolTraffic TestStage5ExplicitLegacyCipherTraffic TestStage5ProtocolTraffic TestPinnedBinaryRawRuntimeAndStatistics TestXHTTPRuntimeTransfer
      - name: Upstream native protocol TCP IPv4 IPv6 DNS and credential checks
        if: ${{ !cancelled() }}
        env:
          STAGE5_RUNTIME_BINARY: ${{ env.XUI_STAGE4_CORE_DIR }}/upstream/sing-box
          STAGE5_NATIVE_PROFILE: upstream
        run: |
          set -o pipefail
          go test -race -p 2 -json ./internal/hiddify -run '^TestStage5ProtocolTraffic$' -count=1 | tee upstream-transfer.jsonl
          python3 tools/ci/require-go-tests.py upstream-transfer.jsonl TestStage5ProtocolTraffic
      - name: Generated database protocol configurations and native AWG TCP UDP traffic
        if: ${{ !cancelled() }}
        env:
          HIDDIFY_CONFIG_CHECK_BINARY: ${{ env.XUI_STAGE4_CORE_DIR }}/owner/x-ui/bin/hiddify-core-linux-${{ matrix.arch }}
        run: |
          set -o pipefail
          go test -race -p 2 -json ./internal/web/service -run '^(TestHiddifyFullDatabaseProtocolConfigurations|TestNativeAWGConnections|TestNativeWireGuardConnections)$' -count=1 | tee database-protocols.jsonl
          python3 tools/ci/require-go-tests.py database-protocols.jsonl TestHiddifyFullDatabaseProtocolConfigurations TestNativeAWGConnections TestNativeWireGuardConnections
      - name: Xray classic transport TCP UDP and XDrive traffic
        if: ${{ !cancelled() }}
        env:
          STAGE5_RUNTIME_BINARY: ${{ env.XUI_STAGE4_CORE_DIR }}/xray/xray
          STAGE5_ENCRYPTION_BINARY: ${{ env.XUI_STAGE4_CORE_DIR }}/owner/x-ui/bin/hiddify-core-linux-${{ matrix.arch }}
          STAGE5_NATIVE_PROFILE: xray
        run: |
          set -o pipefail
          go test -race -p 2 -json ./internal/hiddify -run '^TestStage5ProtocolTraffic$' -count=1 | tee xray-classic-transfer.jsonl
          python3 tools/ci/require-go-tests.py xray-classic-transfer.jsonl TestStage5ProtocolTraffic
      - name: Xray real XHTTP TLS and Reality transfers
        if: ${{ !cancelled() }}
        env:
          XRAY_RUNTIME_BINARY: ${{ env.XUI_STAGE4_CORE_DIR }}/xray/xray
        run: |
          set -o pipefail
          go test -race -p 2 -json ./internal/hiddify -run '^TestXHTTPRuntimeTransfer$' -count=1 | tee xray-transfer.jsonl
          python3 tools/ci/require-go-tests.py xray-transfer.jsonl TestXHTTPRuntimeTransfer
      - name: AnyTLS and ShadowTLS subscription connections
        if: ${{ !cancelled() }}
        env:
          HIDDIFY_TEST_BINARY: ${{ env.XUI_STAGE4_CORE_DIR }}/owner/x-ui/bin/hiddify-core-linux-${{ matrix.arch }}
        run: |
          set -o pipefail
          go test -race -p 2 -json ./internal/sub -run '^TestAnyTLSShadowTLSSubscriptionConnections$' -count=1 | tee subscription-transfer.jsonl
          python3 tools/ci/require-go-tests.py subscription-transfer.jsonl TestAnyTLSShadowTLSSubscriptionConnections
      - name: MASQUE HTTP 1 2 3 real TCP and UDP transfers
        if: ${{ !cancelled() }}
        env:
          SINGBOX_TEST_BINARY: ${{ env.XUI_STAGE4_CORE_DIR }}/owner/x-ui/bin/hiddify-core-linux-${{ matrix.arch }}
        run: |
          set -o pipefail
          go test -race -p 2 -json ./internal/singbox -run '^TestMASQUEConnections$' -count=3 | tee masque-transfer.jsonl
          python3 tools/ci/require-go-tests.py masque-transfer.jsonl TestMASQUEConnections
      - name: Fragmented Trojan control and upstream defect classification
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          go test -race -p 2 -json ./internal/hiddify -run '^TestStage5FragmentedTrojanContract$' -count=1 | tee fragmentation-contract.jsonl
          python3 tools/ci/require-go-tests.py fragmentation-contract.jsonl TestStage5FragmentedTrojanContract
      - name: TLS normalization allocation benchmark
        if: ${{ !cancelled() }}
        run: go test ./internal/singbox -run '^$' -bench '^BenchmarkStage5TLSNormalization$' -benchmem -count=3 | tee tls-benchmark.txt
      - name: Build observed protocol matrix
        if: ${{ !cancelled() }}
        run: python3 tools/ci/protocol-matrix.py --output protocol-matrix.csv
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: protocol-audit-evidence-${{ matrix.arch }}
          path: |
            *.jsonl
            protocol-matrix.csv
            protocol-inventory.json
            capability-inbounds.json
            native-binaries.sha256
            tls-benchmark.txt
