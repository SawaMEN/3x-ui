name: DNSTT integration formatter snapshot v2
on:
  push:
    branches: [dns]
    paths:
      - '.github/workflows/dnstt-format-verification.yml'
permissions:
  contents: read
jobs:
  verify-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Canonical Go formatting
        run: |
          gofmt -w internal/dnstt/manager.go internal/dnstt/manager_test.go internal/dnstt/lifecycle_systemd_test.go internal/web/controller/dnstt.go internal/web/controller/api.go
          python3 - <<'PY'
          from pathlib import Path
          import base64
          for path in ['internal/dnstt/manager.go','internal/dnstt/manager_test.go','internal/web/controller/dnstt.go','internal/web/controller/api.go']:
              print('GOFMT_FILE:'+path+':'+base64.b64encode(Path(path).read_bytes()).decode())
          PY
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Canonical React formatting
        working-directory: frontend
        run: |
          npx oxfmt src/pages/singbox/DNSTTSettings.tsx src/test/dnstt-settings.test.tsx src/pages/singbox/SingBoxPage.tsx src/pages/settings/SystemUpdateModal.tsx
          node -e 'const fs=require("fs");for(const p of process.argv.slice(1)) console.log("OXFMT_FILE:"+p+":"+fs.readFileSync(p).toString("base64"))' src/pages/singbox/DNSTTSettings.tsx src/test/dnstt-settings.test.tsx src/pages/singbox/SingBoxPage.tsx src/pages/settings/SystemUpdateModal.tsx
      - name: DNSTT interface regression tests
        working-directory: frontend
        run: npx vitest run src/test/dnstt-settings.test.tsx src/test/system-update-components.test.tsx
      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck
