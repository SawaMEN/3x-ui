name: Temporary OxiDNS formatter
on:
  push:
    branches: [fix/oxidns-installation-settings-separation]
    paths: ['.github/workflows/oxidns-temp-format.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/oxidns-installation-settings-separation
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Format changed files and commit
        shell: bash
        run: |
          set -euo pipefail
          # Rerun after fixing effect lint rule
          cd frontend
          npx oxfmt src/pages/singbox/OxiDNSSettings.tsx src/pages/settings/SystemUpdateModal.tsx src/pages/settings/OlcRTCSettingsTab.tsx src/pages/settings/SettingsPage.tsx src/layouts/AppSidebar.tsx src/test/oxidns-settings.test.tsx src/test/system-update-components.test.tsx
          cd ..
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add frontend/src
            git commit -m "chore(format): canonical format for OxiDNS and package screens"
            git push origin HEAD:fix/oxidns-installation-settings-separation
          fi
