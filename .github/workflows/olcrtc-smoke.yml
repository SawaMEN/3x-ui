name: OlcRTC Linux smoke

on:
  pull_request:
    paths:
      - "internal/olcrtc/**"
      - "internal/web/controller/olcrtc.go"
      - "frontend/src/pages/olcrtc/**"
      - ".github/workflows/olcrtc-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  olcrtc-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Go unit tests for the integration
        run: go test -count=1 ./internal/olcrtc
      - name: Test the patched manager, real Linux network namespace and quotas
        run: |
          git init -q /tmp/olcrtc-reviewed-manager
          git -C /tmp/olcrtc-reviewed-manager remote add origin https://github.com/BigDaddy3334/olcrtc-manager-panel.git
          git -C /tmp/olcrtc-reviewed-manager fetch --depth 1 origin df626030d21d00286304bc8ef1e990e28c247a55
          git -C /tmp/olcrtc-reviewed-manager checkout --detach FETCH_HEAD
          git -C /tmp/olcrtc-reviewed-manager apply "$GITHUB_WORKSPACE/internal/olcrtc/patches/manager.patch"
          cp internal/olcrtc/patches/panel_safety.go.txt /tmp/olcrtc-reviewed-manager/cmd/olcrtc-manager/panel_safety.go
          cp internal/olcrtc/patches/panel_safety_test.go.txt /tmp/olcrtc-reviewed-manager/cmd/olcrtc-manager/panel_safety_test.go
          cd /tmp/olcrtc-reviewed-manager
          sudo env PATH="$PATH" OLCRTC_KERNEL_TEST=1 go test -race -count=1 ./cmd/olcrtc-manager
      - name: Install OlcRTC through the production integration on an isolated CI VM
        env:
          INSTALLER_URL: https://raw.githubusercontent.com/BigDaddy3334/olcrtc-manager-panel/df626030d21d00286304bc8ef1e990e28c247a55/scripts/install.sh
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location "$INSTALLER_URL" -o /tmp/olcrtc-smoke-installer.sh
          bash -n /tmp/olcrtc-smoke-installer.sh
          sudo env -u HOME -u GOPATH -u GOCACHE -u GOMODCACHE PATH="$PATH" \
            GOPATH=/tmp/olcrtc-smoke-go GOCACHE=/tmp/olcrtc-smoke-cache \
            OLCRTC_RUN_INSTALL_SMOKE=1 go test -count=1 ./internal/olcrtc -run '^TestManagedInstallationSmoke$' -timeout 28m
      - name: Validate the pinned upstream installer source
        env:
          OLCRTC_PINNED_INSTALLER_PATH: /tmp/olcrtc-smoke-installer.sh
        run: go test -count=1 ./internal/olcrtc -run '^TestPinned(UpstreamArchInstaller|InstallerInitializersWithoutHostnameI)$'
      - name: Verify service, loopback binding, credentials and local API
        run: |
          set -euo pipefail
          sudo systemctl --no-pager --full status olcrtc-manager
          test -x /usr/local/bin/olcrtc
          test -x /usr/local/bin/olcrtc-manager
          sudo test -s /etc/olcrtc-manager/panel.env
          sudo test -s /etc/olcrtc-manager/config.json
          PORT="$(sudo python3 -c 'import json; print(json.load(open("/etc/olcrtc-manager/config.json"))["port"])')"
          # The service must be local-only; accepting connections on all interfaces
          # would accidentally expose its independent admin UI.
          sudo systemctl cat olcrtc-manager | grep -F 'OLCRTC_MANAGER_ADDR=127.0.0.1'
          sudo grep -q '^OLCRTC_MANAGER_USER=' /etc/olcrtc-manager/panel.env
          sudo grep -q '^OLCRTC_MANAGER_PASS=' /etc/olcrtc-manager/panel.env
          sudo bash -c '
            set -euo pipefail
            set -a
            source /etc/olcrtc-manager/panel.env
            set +a
            for attempt in $(seq 1 15); do
              if curl --fail --silent --max-time 2 \
                --user "${OLCRTC_MANAGER_USER}:${OLCRTC_MANAGER_PASS}" \
                "http://127.0.0.1:${1}/api/settings" > /tmp/olcrtc-api-settings.json; then
                exit 0
              fi
              sleep 2
            done
            exit 1
          ' bash "$PORT"
          sudo python3 - <<'PY'
          import json
          with open('/tmp/olcrtc-api-settings.json') as f:
              response = json.load(f)
          assert response["port"] > 0
          assert response["admin_user"]
          print("Authenticated local OlcRTC API responds correctly")
          PY
      - name: Troubleshooting on failure
        if: failure()
        run: |
          sudo systemctl --no-pager --full status olcrtc-manager || true
          sudo journalctl -u olcrtc-manager -n 100 --no-pager || true
          # Never print panel.env or installer stdout: they contain admin credentials.

  olcrtc-arch-installer:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Update Arch packages and install test prerequisites
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed go bash curl ca-certificates git tar xz iproute2 iptables openssl
      - name: Validate Go integration on real Arch Linux
        run: |
          go version
          go test -count=1 ./internal/olcrtc
      - name: Patch the pinned production installer and validate Bash syntax
        env:
          OLCRTC_PINNED_INSTALLER_PATH: /tmp/olcrtc-pinned-installer.sh
        run: |
          curl --fail --show-error --silent --location \
            https://raw.githubusercontent.com/BigDaddy3334/olcrtc-manager-panel/df626030d21d00286304bc8ef1e990e28c247a55/scripts/install.sh \
            -o "$OLCRTC_PINNED_INSTALLER_PATH"
          go test -count=1 ./internal/olcrtc -run '^Test(PinnedUpstreamArchInstaller|PinnedInstallerInitializersWithoutHostnameI|ArchRuntimeDetectsPacman)$' -v
