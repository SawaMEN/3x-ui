name: Fix frontend audit

on:
  push:
    branches:
      - fix/ci-compilation-tests-20261001
    paths:
      - .github/workflows/audit-ci-fix.yml

permissions:
  contents: write

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Apply audit fixes
        working-directory: frontend
        run: npm audit fix --package-lock-only
      - name: Verify production audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Commit audit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git diff --cached --quiet && exit 1
          git commit -m "fix(frontend): update audited transitive dependencies"
          git push origin HEAD:${{ github.ref_name }}
