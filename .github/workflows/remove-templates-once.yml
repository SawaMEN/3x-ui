name: Remove templates feature once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  remove:
    if: github.head_ref == 'remove-templates-feature'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: remove-templates-feature
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Remove templates feature
        run: python3 scripts/remove_templates_once.py

      - name: Remove one-off helpers
        run: rm -f .github/workflows/remove-templates-once.yml scripts/remove_templates_once.py

      - name: Regenerate frontend schemas and OpenAPI
        working-directory: frontend
        run: |
          npm ci
          npm run gen

      - name: Verify removed surface is gone
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E '/panel/api/templates|pages\.templates|menu\.templates|NewTemplateController|LocalTemplate|pages/templates|id: .templates.' \
            frontend/src frontend/public internal docs/content docs/public/openapi.json --exclude-dir=node_modules; then
            echo "Templates feature references remain" >&2
            exit 1
          fi

      - name: Validate
        shell: bash
        run: |
          mkdir -p internal/web/dist && touch internal/web/dist/.gitkeep
          go test -vet=off ./internal/web/controller ./internal/web/service ./internal/database
          cd frontend
          npm run typecheck
          npm test

      - name: Commit removal
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes to commit" >&2; exit 1; }
          git commit -m "refactor: remove templates feature"
          git push origin HEAD:remove-templates-feature
