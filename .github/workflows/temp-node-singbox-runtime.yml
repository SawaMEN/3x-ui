name: temp-node-singbox-runtime

on:
  push:
    branches:
      - temp/node-singbox-status

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temp/node-singbox-status
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Add sing-box pending restart lifecycle
        shell: bash
        run: |
          cat > internal/web/service/singbox_restart.go <<'EOF'
          package service

          import (
              "context"
              "sync/atomic"

              "github.com/SawaMEN/3x-ui/v3/internal/logger"
          )

          var isNeedSingBoxRestart atomic.Bool

          // SetToNeedRestart marks the selected sing-box runtime config as stale.
          // Inbound/client controllers use the same deferred-restart model as Xray
          // so a burst of node-sync mutations is collapsed into one core reload.
          func (s *SingBoxService) SetToNeedRestart() {
              isNeedSingBoxRestart.Store(true)
          }

          // IsNeedRestartAndSetFalse consumes the pending sing-box restart flag.
          func (s *SingBoxService) IsNeedRestartAndSetFalse() bool {
              return isNeedSingBoxRestart.CompareAndSwap(true, false)
          }

          // ApplyPendingRestart reloads sing-box only while it is the selected,
          // currently running core. If sing-box is absent/stopped there is no
          // process to reload; a later explicit start writes the current config.
          func (s *SingBoxService) ApplyPendingRestart(ctx context.Context) {
              if !s.IsNeedRestartAndSetFalse() {
                  return
              }
              coreType, err := (&SettingService{}).GetCoreType()
              if err != nil {
                  logger.Error("get selected core for pending sing-box restart failed:", err)
                  s.SetToNeedRestart()
                  return
              }
              if coreType != CoreTypeSingBox || !s.IsRunning() {
                  return
              }
              if err := s.Restart(ctx); err != nil {
                  logger.Error("restart sing-box failed:", err)
                  s.SetToNeedRestart()
              }
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p = Path('internal/web/web.go')
          s = p.read_text()
          old = '''\t_, _ = s.cron.AddFunc(cadenceXrayRestart, func() {\n\t\ts.xrayService.ApplyPendingRestart()\n\t})'''
          new = '''\t_, _ = s.cron.AddFunc(cadenceXrayRestart, func() {\n\t\ts.xrayService.ApplyPendingRestart()\n\t\t(&service.SingBoxService{}).ApplyPendingRestart(s.ctx)\n\t})'''
          if old not in s:
              raise SystemExit('pending-restart scheduler block not found')
          p.write_text(s.replace(old, new, 1))
          PY

          gofmt -w internal/web/service/singbox_restart.go internal/web/web.go
          git add internal/web/service/singbox_restart.go internal/web/web.go
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "feat(singbox): add deferred core reload"

      - name: Make inbound and client mutations core-aware
        shell: bash
        run: |
          cat > internal/web/controller/core_restart.go <<'EOF'
          package controller

          import "github.com/SawaMEN/3x-ui/v3/internal/web/service"

          // markSelectedCoreNeedRestart routes a config-change notification to the
          // core that this panel currently runs. This is especially important on a
          // node: master sync writes local inbounds/clients, so marking Xray while
          // the node actually runs sing-box leaves the live sing-box config stale.
          func markSelectedCoreNeedRestart(settings *service.SettingService, xrayService *service.XrayService, singBoxService *service.SingBoxService) {
              coreType, err := settings.GetCoreType()
              if err == nil && coreType == service.CoreTypeSingBox {
                  singBoxService.SetToNeedRestart()
                  return
              }
              xrayService.SetToNeedRestart()
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          p = Path('internal/web/controller/inbound.go')
          s = p.read_text()
          old = '''type InboundController struct {\n\tinboundService  service.InboundService\n\tclientService   service.ClientService\n\txrayService     service.XrayService\n\tfallbackService service.FallbackService\n}'''
          new = '''type InboundController struct {\n\tinboundService  service.InboundService\n\tclientService   service.ClientService\n\txrayService     service.XrayService\n\tsingBoxService  service.SingBoxService\n\tsettingService  service.SettingService\n\tfallbackService service.FallbackService\n}'''
          if old not in s:
              raise SystemExit('InboundController struct block not found')
          s = s.replace(old, new, 1)
          s = s.replace('a.xrayService.SetToNeedRestart()', 'markSelectedCoreNeedRestart(&a.settingService, &a.xrayService, &a.singBoxService)')
          p.write_text(s)

          p = Path('internal/web/controller/client.go')
          s = p.read_text()
          old = '''type ClientController struct {\n\tclientService  service.ClientService\n\tinboundService service.InboundService\n\txrayService    service.XrayService\n\tsettingService service.SettingService\n\thappGenerator  service.HappLinkGenerator\n}'''
          new = '''type ClientController struct {\n\tclientService  service.ClientService\n\tinboundService service.InboundService\n\txrayService    service.XrayService\n\tsingBoxService service.SingBoxService\n\tsettingService service.SettingService\n\thappGenerator  service.HappLinkGenerator\n}'''
          if old not in s:
              raise SystemExit('ClientController struct block not found')
          s = s.replace(old, new, 1)
          s = s.replace('a.xrayService.SetToNeedRestart()', 'markSelectedCoreNeedRestart(&a.settingService, &a.xrayService, &a.singBoxService)')
          p.write_text(s)
          PY

          gofmt -w internal/web/controller/core_restart.go internal/web/controller/inbound.go internal/web/controller/client.go
          git add internal/web/controller/core_restart.go internal/web/controller/inbound.go internal/web/controller/client.go
          git diff --cached --check
          git commit -m "fix(nodes): reload selected core after sync mutations"

      - name: Backend tests
        shell: bash
        run: |
          GODEBUG=http2client=0 go test ./internal/web/controller ./internal/web/service ./internal/web/runtime ./internal/web

      - name: Remove temporary workflow and push
        shell: bash
        run: |
          rm -f .github/workflows/temp-node-singbox-runtime.yml
          git add -A
          git commit -m "chore: remove temporary node sing-box workflow"
          git push origin HEAD:temp/node-singbox-status
