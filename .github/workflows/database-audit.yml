name: Database compatibility audit
on:
  push:
    branches: [update]
    paths: ['internal/database/**', 'internal/web/service/**', '.github/workflows/database-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: database-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xui_audit
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d xui_audit" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      XUI_TEST_PG_DSN: host=127.0.0.1 port=5432 user=postgres password=postgres dbname=xui_audit sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install matching native PostgreSQL backup tools
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client-16 && echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - name: Prepare embedded assets and dependencies
        run: mkdir -p internal/web/dist && touch internal/web/dist/.gitkeep && bash tools/ci/download-go-modules.sh
      - name: SQLite upgrades, snapshots and failures plus actual PostgreSQL roundtrip
        run: |
          set -o pipefail
          go test -race -p 2 -json ./internal/database ./internal/database/model -count=1 | tee database.jsonl
          python3 tools/ci/require-go-tests.py database.jsonl TestStage3LegacyUpgrade TestStage3PostgresRoundTrip TestStage3PostgresMigrationPreservesExternalTables TestStage3PostgresCommitAndDisconnect TestStage3PostgresNativeBackup TestStage3ValidateRejectsIncompleteFiles TestStage3DumpReplacesInsecureDestination TestStage3DumpPreservesStorageClasses TestStage3RestoreRejectsUncommittedDump TestStage3ExportFailurePreservesDestination TestStage3CopyRollback TestStage3SQLiteWriteFailures TestStage3DumpConcurrentSnapshot TestMigrateData_CompositeKeyTableLargerThanBatch TestMigrateData_PreservesFalseDefaultedColumns TestMigrateData_FailedCopyLeavesDestinationUntouched
      - name: Replay legacy PostgreSQL-only schema tests without skips
        env:
          XUI_DB_TYPE: postgres
          XUI_DB_DSN: ${{ env.XUI_TEST_PG_DSN }}
        run: |
          set -o pipefail
          go test -race -p 2 -json ./internal/database -run '^(TestMigrate_LegacyBooleanVerifyPeerCertByNameIsBlanked_Postgres|TestMigrate_Postgres|TestHostAutoMigrateCreatesColumns_Postgres)$' -count=1 | tee schema-pg.jsonl
          python3 tools/ci/require-go-tests.py schema-pg.jsonl TestMigrate_LegacyBooleanVerifyPeerCertByNameIsBlanked_Postgres TestMigrate_Postgres TestHostAutoMigrateCreatesColumns_Postgres
      - name: Durable runtime and PostgreSQL traffic/link integrity
        env:
          XUI_DB_TYPE: postgres
          XUI_DB_DSN: ${{ env.XUI_TEST_PG_DSN }}
        run: |
          set -o pipefail
          go test -race -p 2 -json ./internal/web/service -run 'PostgresCommitFailure' -count=1 | tee runtime-commit.jsonl
          python3 tools/ci/require-go-tests.py runtime-commit.jsonl TestAddInbound_PostgresCommitFailureMakesNoRuntimeCall TestUpdateInbound_PostgresCommitFailureMakesNoRuntimeCall
      - name: SQL budgets, N+1 and single-connection node sync regressions
        run: |
          set -o pipefail
          go test -race -p 2 -json ./internal/web/service -run '^(TestAuditTrafficQueriesRespectSQLiteVariableBudget|TestClientStatsIdentitiesBatchesPreloadedInbounds|TestBackfillClientStatsChunkBoundaryAndEmpty|TestNodeSyncInboundRemovalStaysOnOneConnection|TestNodeSyncClientGoneStaysOnOneConnection|TestAddInboundClientConcurrentCrossInboundAddressSingleWinner)$' -count=1 | tee query-budgets.jsonl
          python3 tools/ci/require-go-tests.py query-budgets.jsonl TestAuditTrafficQueriesRespectSQLiteVariableBudget TestClientStatsIdentitiesBatchesPreloadedInbounds TestBackfillClientStatsChunkBoundaryAndEmpty TestNodeSyncInboundRemovalStaysOnOneConnection TestNodeSyncClientGoneStaysOnOneConnection TestAddInboundClientConcurrentCrossInboundAddressSingleWinner
      - name: PostgreSQL concurrent counters and node sync
        env:
          XUI_DB_TYPE: postgres
          XUI_DB_DSN: ${{ env.XUI_TEST_PG_DSN }}
        run: |
          set -o pipefail
          go test -race -p 2 -json ./internal/web/service -run '^(TestGlobalTrafficHeartbeatPostgres|TestClientIpSyncPostgres)$' -count=1 | tee concurrent-pg.jsonl
          python3 tools/ci/require-go-tests.py concurrent-pg.jsonl TestGlobalTrafficHeartbeatPostgres TestClientIpSyncPostgres
      - name: PostgreSQL batching beyond the parameter budget
        env:
          XUI_DB_TYPE: postgres
          XUI_DB_DSN: ${{ env.XUI_TEST_PG_DSN }}
        run: |
          set -o pipefail
          go test -p 2 -json ./internal/web/service -run '^(TestSyncInboundPostgresScale|TestAddDelClientPostgresScale|TestGroupAndListPostgresScale)$/^N=5000$' -count=1 | tee scale-pg.jsonl
          python3 tools/ci/require-go-tests.py scale-pg.jsonl TestSyncInboundPostgresScale/N=5000 TestAddDelClientPostgresScale/N=5000 TestGroupAndListPostgresScale/N=5000
      - name: Preserve machine-readable results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: database-audit-evidence
          path: '*.jsonl'
