name: Hysteria compatibility
on:
  push:
    branches: [main, update]
    paths:
      - "internal/singbox/**"
      - "deploy/hiddify/hiddify-core-target.json"
      - ".github/workflows/hysteria-compat.yml"
  pull_request:
    paths:
      - "internal/singbox/**"
      - "deploy/hiddify/hiddify-core-target.json"
      - ".github/workflows/hysteria-compat.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hysteria-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hysteria-tests:
    name: Panel Hysteria protocol and race regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Stub embedded frontend
        run: mkdir -p internal/web/dist && touch internal/web/dist/.gitkeep
      - name: Run Hysteria regressions
        run: go test -p 4 ./internal/singbox -run 'Hysteria' -shuffle=on -count=1 -v
      - name: Race check Hysteria
        run: go test -race -p 4 ./internal/singbox -run 'Hysteria' -count=1 -timeout=10m

  hysteria-native:
    name: Verify Hysteria1/2 in the pinned VetrOFF source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: SawaMEN/VetrOFF-Core
          ref: 04a17a6cdfaaa39eebd6b610a9d9d3abc1a4e8a4 # v0.0.1
          path: vetroff-core
          persist-credentials: false
      - name: Prepare original sources and apply VetrOFF patches
        run: bash vetroff-core/scripts/prepare.sh
      - uses: actions/setup-go@v7
        with:
          go-version-file: vetroff-core/.build/hiddify-core/hiddify-sing-box/go.mod
          cache-dependency-path: vetroff-core/.build/hiddify-core/hiddify-sing-box/go.sum
          cache: true
      - name: Compile and run native Hysteria protocol tests
        working-directory: vetroff-core/.build/hiddify-core/hiddify-sing-box
        run: |
          go test -tags with_quic -count=1 ./protocol/hysteria ./protocol/hysteria2
