name: Temporary audit fixup

on:
  push:
    branches:
      - audit/full-project-hardening-20260925

permissions:
  contents: write

jobs:
  fixup:
    runs-on: ubuntu-latest
    if: github.event.head_commit.message != 'audit-fixup'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/full-project-hardening-20260925
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Apply deterministic fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("frontend/src/pages/templates/TemplatesPage.tsx")
          text = path.read_text()
          text = text.replace("import { useNavigate } from 'react-router-dom';\n", "")
          text = text.replace("  const navigate = useNavigate();\n", "")
          old = "    navigate('/inbounds');\n  }, [detail, messageApi, navigate, t]);"
          new = "    window.location.assign('/inbounds');\n  }, [detail, messageApi, t]);"
          if text.count(old) != 1:
              raise SystemExit(f"{path}: unexpected navigation block")
          path.write_text(text.replace(old, new, 1))

          for name in [
              "frontend/src/test/node-list-rerender.test.tsx",
              "frontend/src/test/node-list-rowkey.test.tsx",
          ]:
              path = Path(name)
              text = path.read_text()
              if name.endswith("node-list-rerender.test.tsx"):
                  old = "      onReorder: noop,"
                  new = "      onReorder: async () => {},"
              else:
                  old = "        onReorder={noop}"
                  new = "        onReorder={async () => {}}"
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: unexpected reorder callback")
              path.write_text(text.replace(old, new, 1))
          PY
          cd frontend
          npm ci --no-audit --no-fund
          npx oxfmt --write \
            src/pages/templates/TemplatesPage.tsx \
            src/test/node-list-rerender.test.tsx \
            src/test/node-list-rowkey.test.tsx
      - name: Commit fixups
        run: |
          git config user.name "3x-ui audit bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "audit-fixup"
          git push origin HEAD:audit/full-project-hardening-20260925
