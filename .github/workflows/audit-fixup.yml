name: Temporary audit fixup

on:
  push:
    branches:
      - audit/full-project-hardening-20260925

permissions:
  contents: write

jobs:
  fixup:
    runs-on: ubuntu-latest
    if: github.event.head_commit.message != 'audit-fixup'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/full-project-hardening-20260925
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Apply deterministic fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("internal/web/service/inbound.go")
          text = path.read_text()
          old = 'Where("user_id = ?", userId).Order("id ASC").Find(&inbounds).Error'
          new = 'Where("user_id = ?", userId).Order("sort_order ASC, id ASC").Find(&inbounds).Error'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"{path}: expected one slim-order match, found {count}")
          path.write_text(text.replace(old, new, 1))
          PY
          cd frontend
          npm ci --no-audit --no-fund
          npx oxfmt --write \
            src/pages/settings/SettingsPage.tsx \
            src/pages/templates/TemplatesPage.tsx \
            src/pages/xray/routing/RoutingTab.tsx
      - name: Commit fixups
        run: |
          git config user.name "3x-ui audit bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "audit-fixup"
          git push origin HEAD:audit/full-project-hardening-20260925
