name: Temporary OxiDNS and Telemt merge verification
on:
  push:
    branches: [fix/oxidns-installation-settings-separation]
    paths: ['.github/workflows/oxidns-telemt-merge-check.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/oxidns-installation-settings-separation
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Format and verify combined frontend
        working-directory: frontend
        run: |
          npx oxfmt src/pages/settings/SystemUpdateModal.tsx
          npm run lint
          npm run format:check
          npm run typecheck
          npx vitest run src/test/system-update-components.test.tsx src/test/oxidns-settings.test.tsx src/test/native-protocol-option-fields.test.tsx
      - name: Commit canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add frontend/src/pages/settings/SystemUpdateModal.tsx
            HUSKY=0 git commit -m "chore(format): format merged OxiDNS and Telemt package UI"
            git push origin HEAD:fix/oxidns-installation-settings-separation
          fi
