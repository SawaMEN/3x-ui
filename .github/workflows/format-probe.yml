name: Temp Format Probe

on:
  push:
    branches: [update]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Format and print Mieru diff
        working-directory: frontend
        run: |
          npm run format
          git diff -- src/schemas/protocols/inbound/mieru.ts
          exit 1
