name: Sidecar egress regression
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'internal/sidecaregress/**'
      - 'internal/sudoku/**'
      - 'internal/web/service/inbound_sudoku*'
      - '.github/workflows/sidecar-egress.yml'
      - 'internal/mieru/**'
      - 'internal/externalvpn/**'
      - 'internal/web/service/singbox*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Download official Sudoku release for interoperability
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh api repos/SUDOKU-ASCII/sudoku/releases/latest --jq '.tag_name')
          test -n "$tag"
          mkdir -p "$RUNNER_TEMP/sudoku"
          curl -fL --retry 3 -o "$RUNNER_TEMP/sudoku.tar.gz" "https://github.com/SUDOKU-ASCII/sudoku/releases/download/$tag/sudoku-linux-amd64.tar.gz"
          tar -xzf "$RUNNER_TEMP/sudoku.tar.gz" -C "$RUNNER_TEMP/sudoku"
      - name: Download official TrustTunnel endpoint for interoperability
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/trust.tar.gz" https://github.com/TrustTunnel/TrustTunnel/releases/download/v1.1.0/trusttunnel-v1.1.0-linux-x86_64.tar.gz
          tar -xzf "$RUNNER_TEMP/trust.tar.gz" -C "$RUNNER_TEMP"
      - name: Test panel contracts and routing
        env:
          SUDOKU_TEST_BINARY: ${{ runner.temp }}/sudoku/sudoku
          TRUSTTUNNEL_TEST_BINARY: ${{ runner.temp }}/trusttunnel-v1.1.0-linux-x86_64/trusttunnel_endpoint
        run: |
          mkdir -p internal/web/dist
          touch internal/web/dist/.gitkeep
          go test ./internal/sudoku ./internal/mieru ./internal/externalvpn ./internal/hiddify ./internal/web/service -count=1 -timeout=600s
