name: Fix fork import paths and validate sync

on:
  push:
    branches:
      - sync-upstream-2026-10-03
    paths:
      - .github/workflows/fix-sync-imports.yml

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout sync branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: sync-upstream-2026-10-03

      - name: Fix imported module paths
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mapfile -t files < <(grep -RIl --include='*.go' 'github.com/mhsanaei/3x-ui/v3' . || true)
          printf 'Fixing %s Go file(s)\n' "${#files[@]}"
          for f in "${files[@]}"; do
            sed -i 's#github.com/mhsanaei/3x-ui/v3#github.com/SawaMEN/3x-ui/v3#g' "$f"
          done
          gofmt -w "${files[@]}" || true
          git add -- '*.go' || true
          if ! git diff --cached --quiet; then
            git commit -m "fix: use fork module path in upstream TUIC code"
          fi
          git rm .github/workflows/fix-sync-imports.yml
          git commit -m "chore: finish sync import repair"
          git push origin HEAD:sync-upstream-2026-10-03

      - name: Backend tests
        run: go test ./...

      - name: Frontend checks
        run: |
          cd frontend
          corepack enable
          npm ci
          npm run typecheck
          npm run build:ci
