name: Gateway recovery-state fix

on:
  push:
    branches:
      - fix/gateway-fail-closed

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gateway-fail-closed
          fetch-depth: 0
      - name: Patch recovery state and CLI wrapper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'anchor not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, count))

          replace(
              'internal/web/service/gateway_network.go',
              '''type GatewayNetworkStatus struct {\n\tListenerReady bool                 `json:"listenerReady"`\n\tConfigured    bool                 `json:"configured"`\n\tConfig        GatewayNetworkConfig `json:"config"`\n''',
              '''type GatewayNetworkStatus struct {\n\tListenerReady    bool                 `json:"listenerReady"`\n\tConfigured       bool                 `json:"configured"`\n\tRecoveryRequired bool                 `json:"recoveryRequired"`\n\tConfig           GatewayNetworkConfig `json:"config"`\n''',
          )
          replace(
              'internal/web/service/gateway_network.go',
              '''\t\t\tif orphaned {\n\t\t\t\treturn GatewayNetworkStatus{Configured: true, Error: "Gateway recovery state is missing while managed Linux networking remains; disable Gateway to clean the orphaned interception safely"}\n\t\t\t}\n''',
              '''\t\t\tif orphaned {\n\t\t\t\treturn GatewayNetworkStatus{RecoveryRequired: true}\n\t\t\t}\n''',
          )
          replace(
              'internal/web/service/gateway_network.go',
              '''\t\tcleanupErr := s.cleanupGatewayWithoutState(ctx, false)\n\t\treturn errors.Join(fmt.Errorf("Gateway recovery state is missing; managed interception was suspended but original sysctl baselines cannot be recovered from gateway.env"), cleanupErr)\n''',
              '''\t\treturn s.cleanupGatewayWithoutState(ctx, false)\n''',
          )
          replace(
              'internal/web/service/gateway_network.go',
              '''\t\tcleanupErr := s.cleanupGatewayWithoutState(ctx, true)\n\t\treturn errors.Join(fmt.Errorf("Gateway recovery state was missing; managed interception was removed, but the previous net.ipv4.ip_forward value cannot be recovered safely and was left unchanged"), cleanupErr)\n''',
              '''\t\treturn s.cleanupGatewayWithoutState(ctx, true)\n''',
          )

          replace(
              'internal/gateway/cli.go',
              '''\tbefore := network.Status(ctx)\n\tif before.Error != "" {\n\t\treturn fmt.Errorf("Gateway recovery state: %s", before.Error)\n\t}\n''',
              '''\tbefore := network.Status(ctx)\n\tif before.Error != "" {\n\t\treturn fmt.Errorf("Gateway recovery state: %s", before.Error)\n\t}\n\tif before.RecoveryRequired && action != "disable" {\n\t\treturn fmt.Errorf("Gateway network recovery is required; disable Gateway first to clean stale owned objects")\n\t}\n''',
          )

          replace(
              'internal/web/controller/gateway.go',
              '''\tpayload["enabled"] = status.State.Enabled || network.Configured\n''',
              '''\tpayload["enabled"] = status.State.Enabled || network.Configured || network.RecoveryRequired\n''',
          )
          replace(
              'internal/web/controller/gateway.go',
              '''\tpayload["canEnable"] = !status.Conflict && (!status.State.Enabled || status.State.Configured) && a.gatewayCoreRunning(coreType)\n''',
              '''\tpayload["canEnable"] = !network.RecoveryRequired && !status.Conflict && (!status.State.Enabled || status.State.Configured) && a.gatewayCoreRunning(coreType)\n''',
          )
          replace(
              'internal/web/controller/gateway.go',
              '''\tnetworkStatus := a.networkService.Status(c.Request.Context())\n\tnetworkConfig := req.Network\n''',
              '''\tnetworkStatus := a.networkService.Status(c.Request.Context())\n\tif networkStatus.RecoveryRequired {\n\t\tpayload, _ := a.statusPayload()\n\t\tjsonObj(c, payload, fmt.Errorf("Gateway network recovery is required; disable Gateway first to clean stale owned objects"))\n\t\treturn\n\t}\n\tnetworkConfig := req.Network\n''',
          )

          replace(
              'frontend/src/pages/settings/GatewayModeControl.tsx',
              '''type GatewayNetworkStatus = {\n  configured: boolean;\n  config: GatewayNetworkConfig;\n''',
              '''type GatewayNetworkStatus = {\n  configured: boolean;\n  recoveryRequired?: boolean;\n  config: GatewayNetworkConfig;\n''',
          )
          replace(
              'frontend/src/pages/settings/GatewayModeControl.tsx',
              '''  const recoveryOnly = enabled && !configured && !coreMismatch;\n''',
              '''  const networkRecovery = status?.network?.recoveryRequired === true;\n  const recoveryOnly = networkRecovery || (enabled && !configured && !coreMismatch);\n''',
          )

          replace(
              'x-ui-core.sh',
              '''        "gateway")\n            check_install 0 || exit 1\n\n            case "$2" in\n            enable)\n        "${xui_folder}/x-ui" gateway enable\n            ;;\n        disable)\n            "${xui_folder}/x-ui" gateway disable\n            ;;\n        status)\n            "${xui_folder}/x-ui" gateway status\n            ;;\n        *)\n            echo "Usage: x-ui gateway <enable|disable|status>"\n            ;;\n    esac\n    ;;\n''',
              '''        "gateway")\n            check_install 0 || exit 1\n\n            case "$2" in\n                enable)\n                    if [[ $# -gt 2 ]]; then\n                        "${xui_folder}/x-ui" gateway "${@:2}"\n                    else\n                        gateway_enable\n                    fi\n                    ;;\n                disable)\n                    "${xui_folder}/x-ui" gateway disable\n                    ;;\n                status)\n                    "${xui_folder}/x-ui" gateway status\n                    ;;\n                *)\n                    echo "Usage: x-ui gateway <enable|disable|status> [--lan-interface NAME --lan-ip IPv4 --lan-prefix PREFIX --wan-interface NAME]"\n                    ;;\n            esac\n            ;;\n''',
          )

          replace(
              'internal/web/service/gateway_network_lifecycle_test.go',
              '''\tstatus := s.Status(context.Background())\n\tif !status.Configured || !strings.Contains(status.Error, "recovery state is missing") {\n\t\tt.Fatalf("orphaned networking was hidden: %+v", status)\n\t}\n\tif err := s.Suspend(context.Background()); err == nil || !strings.Contains(err.Error(), "recovery state is missing") {\n\t\tt.Fatalf("missing-state suspension error=%v", err)\n\t}\n''',
              '''\tstatus := s.Status(context.Background())\n\tif status.Configured || !status.RecoveryRequired || status.Error != "" {\n\t\tt.Fatalf("orphaned networking was hidden or misclassified: %+v", status)\n\t}\n\tif err := s.Suspend(context.Background()); err != nil {\n\t\tt.Fatalf("missing-state suspension failed: %v", err)\n\t}\n''',
          )
          replace(
              'internal/web/service/gateway_network_lifecycle_test.go',
              '''\t// The disabled unit files/snapshot are intentionally still enough for\n\t// Status to advertise recovery until explicit cleanup is requested.\n\tif status := s.Status(context.Background()); !status.Configured || status.Error == "" {\n\t\tt.Fatalf("suspended orphan disappeared from status: %+v", status)\n\t}\n\tif err := s.Disable(context.Background()); err == nil || !strings.Contains(err.Error(), "net.ipv4.ip_forward") {\n\t\tt.Fatalf("missing-state disable error=%v", err)\n\t}\n''',
              '''\t// The disabled unit files/snapshot are intentionally still enough for\n\t// Status to advertise recovery until explicit cleanup is requested.\n\tif status := s.Status(context.Background()); !status.RecoveryRequired || status.Error != "" {\n\t\tt.Fatalf("suspended orphan disappeared from status: %+v", status)\n\t}\n\tif err := s.Disable(context.Background()); err != nil {\n\t\tt.Fatalf("missing-state disable failed: %v", err)\n\t}\n''',
          )
          replace(
              'internal/web/service/gateway_network_lifecycle_test.go',
              '''\tif status := s.Status(context.Background()); status.Configured || status.Error != "" {\n\t\tt.Fatalf("fully cleaned orphan still visible: %+v", status)\n\t}\n''',
              '''\tif status := s.Status(context.Background()); status.Configured || status.RecoveryRequired || status.Error != "" {\n\t\tt.Fatalf("fully cleaned orphan still visible: %+v", status)\n\t}\n''',
          )
          replace(
              'internal/web/service/gateway_network_lifecycle_test.go',
              '''\tstatus := s.Status(context.Background())\n\tif !status.Configured || status.Error == "" {\n\t\tt.Fatalf("rule-only orphan was hidden: %+v", status)\n\t}\n\tif err := s.Disable(context.Background()); err == nil {\n\t\tt.Fatal("rule-only cleanup hid the missing recovery state")\n\t}\n''',
              '''\tstatus := s.Status(context.Background())\n\tif status.Configured || !status.RecoveryRequired || status.Error != "" {\n\t\tt.Fatalf("rule-only orphan was hidden or misclassified: %+v", status)\n\t}\n\tif err := s.Disable(context.Background()); err != nil {\n\t\tt.Fatalf("rule-only cleanup failed: %v", err)\n\t}\n''',
          )
          PY

          gofmt -w internal/web/service/gateway_network.go internal/gateway/cli.go internal/web/controller/gateway.go internal/web/service/gateway_network_lifecycle_test.go
          bash -n x-ui-core.sh
          cd frontend
          npm ci --ignore-scripts
          npx oxfmt --write src/pages/settings/GatewayModeControl.tsx
          npx tsc --noEmit
          cd ..
          git diff --check
          go test ./internal/gateway ./internal/web/controller ./internal/web/service
      - name: Commit patch and remove helper
        shell: bash
        run: |
          git rm .github/workflows/gateway-recovery-state-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/web/service/gateway_network.go internal/gateway/cli.go internal/web/controller/gateway.go internal/web/service/gateway_network_lifecycle_test.go frontend/src/pages/settings/GatewayModeControl.tsx x-ui-core.sh
          git commit -m "fix(gateway): make orphan recovery reachable"
          git push origin HEAD:fix/gateway-fail-closed
