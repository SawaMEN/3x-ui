name: Stage upstream sync

on:
  push:
    branches:
      - sync/upstream-2026-10-03

permissions:
  contents: write

concurrency:
  group: sync-upstream-2026-10-03
  cancel-in-progress: false

jobs:
  merge:
    if: ${{ !contains(github.event.head_commit.message, '[upstream-sync-done]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: sync/upstream-2026-10-03
          fetch-depth: 0

      - name: Build synthetic upstream history and merge
        shell: bash
        run: |
          set -euo pipefail

          LOCAL_BASE=cb9fcf872dc58d7a6a17dc9663ec4506ffdf2063
          UPSTREAM_BASE=95f19b192f477b59cc368dcb7751bcf2e0180e5b
          TARGET_BRANCH=sync/upstream-2026-10-03

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/MHSanaei/3x-ui.git
          git fetch --no-tags upstream main
          UPSTREAM_HEAD="$(git rev-parse upstream/main)"

          LOCAL_TREE="$(git rev-parse "${LOCAL_BASE}^{tree}")"
          UPSTREAM_TREE="$(git rev-parse "${UPSTREAM_BASE}^{tree}")"
          if [ "$LOCAL_TREE" != "$UPSTREAM_TREE" ]; then
            echo "Logical base trees differ: $LOCAL_TREE != $UPSTREAM_TREE" >&2
            exit 2
          fi

          git switch --detach "$LOCAL_BASE"
          git diff --binary "$UPSTREAM_BASE" "$UPSTREAM_HEAD" | git apply --index --binary --whitespace=nowarn
          git commit -m "chore: synthetic upstream snapshot ${UPSTREAM_HEAD}"
          SYNTHETIC_HEAD="$(git rev-parse HEAD)"
          git branch -f _sync_synthetic "$SYNTHETIC_HEAD"

          git switch "$TARGET_BRANCH"

          set +e
          git merge --no-ff --no-commit "$SYNTHETIC_HEAD"
          MERGE_RC=$?
          set -e

          if [ "$MERGE_RC" -ne 0 ]; then
            git diff --name-only --diff-filter=U | sort -u > .upstream-sync-conflicts
            echo "Conflicts detected:"
            cat .upstream-sync-conflicts
          else
            : > .upstream-sync-conflicts
          fi

          {
            echo "upstream_repo=MHSanaei/3x-ui"
            echo "upstream_base=${UPSTREAM_BASE}"
            echo "upstream_head=${UPSTREAM_HEAD}"
            echo "local_base=${LOCAL_BASE}"
            echo "synthetic_head=${SYNTHETIC_HEAD}"
          } > .upstream-sync-meta

          # The Actions token cannot push workflow-file changes. Preserve their
          # complete upstream delta separately, then keep the branch's current
          # workflow tree unchanged. These workflow updates are applied later
          # with the repository connection after source conflicts are resolved.
          git diff --binary HEAD "$SYNTHETIC_HEAD" -- .github/workflows > .upstream-sync-workflows.patch || true
          git restore --source=HEAD --staged --worktree -- .github/workflows

          # Commit the staged three-way result. Text conflicts deliberately keep
          # standard conflict markers so they can be resolved with full context.
          git add -A
          git commit -m "chore: stage MHSanaei upstream sync [upstream-sync-done]"

          # Export a self-contained git bundle for offline conflict resolution.
          git branch -f _sync_staged HEAD
          git bundle create upstream-sync.bundle _sync_staged _sync_synthetic

      - name: Upload merge workspace
        uses: actions/upload-artifact@v4
        with:
          name: upstream-sync-workspace
          path: |
            upstream-sync.bundle
            .upstream-sync-conflicts
            .upstream-sync-meta
            .upstream-sync-workflows.patch
          if-no-files-found: error
          retention-days: 7

      - name: Push staged merge
        shell: bash
        run: git push origin HEAD:sync/upstream-2026-10-03
