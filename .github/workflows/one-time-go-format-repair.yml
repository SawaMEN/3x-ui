name: One-time Go formatting repair

on:
  push:
    branches: [main]
    paths:
      - tools/ci/run-formatter-once.txt

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install the exact formatter used in CI
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/golangci-lint.tar.gz"
          curl -fLsS --retry 3 --retry-all-errors --connect-timeout 15 --max-time 90 \
            https://github.com/golangci/golangci-lint/releases/download/v2.15.0/golangci-lint-2.15.0-linux-amd64.tar.gz \
            -o "$archive"
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/golangci-lint-2.15.0-linux-amd64" >> "$GITHUB_PATH"
      - name: Format, validate and commit Go files
        shell: bash
        run: |
          set -euo pipefail
          golangci-lint fmt
          git diff --check
          git status --short
          git add -u -- '*.go'
          if git diff --cached --quiet; then
            echo "No Go formatting changes required."
            exit 0
          fi
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(format): apply canonical Go formatting'
          git push origin HEAD:main
