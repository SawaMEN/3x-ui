name: Temporary OlcRTC code formatter
on:
  push:
    branches: [olcrtc]
    paths:
      - "frontend/src/**"
      - "internal/olcrtc/**"
      - "internal/web/controller/olcrtc.go"
      - ".github/workflows/olcrtc-format.yml"

permissions:
  contents: write

jobs:
  format:
    if: "!startsWith(github.event.head_commit.message, 'chore(olcrtc-format):')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply repository formatter
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run format
      - name: Format new Go files
        run: gofmt -w internal/olcrtc/manager.go internal/olcrtc/manager_test.go internal/web/controller/olcrtc.go
      - name: Commit formatting to olcrtc
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/api-docs/endpoints.ts frontend/src/pages/settings/OlcRTCClientsModal.tsx frontend/src/pages/settings/SystemUpdateModal.tsx internal/olcrtc/manager.go internal/olcrtc/manager_test.go internal/web/controller/olcrtc.go
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(olcrtc-format): apply project formatters"
          git push origin HEAD:olcrtc
