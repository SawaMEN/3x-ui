name: temp-node-singbox-pr

on:
  pull_request:
    branches:
      - temp/node-singbox-trigger-base
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'temp/node-singbox-status'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temp/node-singbox-status
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply implementation from temporary workflow
        shell: bash
        run: |
          ruby -ryaml -e 'w=YAML.load_file(".github/workflows/temp-node-singbox-apply.yml"); s=w.fetch("jobs").fetch("apply").fetch("steps").find{|x| x["name"]=="Apply implementation"}; File.write("/tmp/apply-node-singbox.sh", s.fetch("run"))'
          bash /tmp/apply-node-singbox.sh
      - name: Backend tests
        run: go test ./internal/web/controller ./internal/web/service ./internal/web/runtime ./internal/database/model
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm run lint
      - name: Commit implementation
        shell: bash
        run: |
          rm -f .github/workflows/temp-node-singbox-pr.yml .github/workflows/temp-node-singbox-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat(nodes): expose sing-box version and running core"
          git push origin HEAD:temp/node-singbox-status
