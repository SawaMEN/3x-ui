name: Gateway format helper

on:
  push:
    branches:
      - fix/gateway-mode-hardening

permissions:
  contents: write

jobs:
  format:
    if: "!startsWith(github.event.head_commit.message, 'chore(gateway): apply oxfmt')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Format Gateway control
        working-directory: frontend
        run: npx oxfmt src/pages/settings/GatewayModeControl.tsx
      - name: Commit formatted Gateway control
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/settings/GatewayModeControl.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(gateway): apply oxfmt"
          git push origin HEAD:fix/gateway-mode-hardening
