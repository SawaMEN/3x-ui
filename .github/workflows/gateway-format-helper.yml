name: Gateway format helper

on:
  push:
    branches:
      - fix/gateway-mode-hardening

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Format Gateway control and print result
        working-directory: frontend
        run: |
          npx oxfmt src/pages/settings/GatewayModeControl.tsx
          echo '===GATEWAY_FORMATTED_BEGIN==='
          base64 -w 0 src/pages/settings/GatewayModeControl.tsx
          echo
          echo '===GATEWAY_FORMATTED_END==='
