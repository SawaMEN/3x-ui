name: Temporary MEKO code format
on:
  push:
    branches: [refactor/mtproto-native-web-lifecycle]
    paths:
      - ".github/workflows/telemt-meko-format-temporary.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Go formatting
        run: |
          gofmt -w internal/mtproto/manager.go internal/mtproto/meko_script_test.go internal/web/service/telemt_meko.go
      - name: TypeScript formatting
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx oxfmt src/pages/inbounds/form/protocols/mtproto.tsx src/pages/inbounds/form/protocols/MtprotoMekoStatus.tsx src/schemas/protocols/inbound/mtproto.ts
      - name: Commit canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/mtproto/manager.go internal/mtproto/meko_script_test.go internal/web/service/telemt_meko.go frontend/src/pages/inbounds/form/protocols frontend/src/schemas/protocols/inbound/mtproto.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(mtproto): canonical Go and TypeScript formatting for MEKO"
          git push origin HEAD:refactor/mtproto-native-web-lifecycle
