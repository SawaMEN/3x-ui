name: OxiDNS integration check
on:
  push:
    branches:
      - dns
    paths:
      - 'internal/oxidns/**'
      - '.github/workflows/dns-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run unit tests
        run: go test -v ./internal/oxidns
      - name: Download pinned, verified OxiDNS release
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/svenshi/oxidns/releases/download/v1.6.1/oxidns-x86_64-unknown-linux-musl.tar.gz \
            -o "$RUNNER_TEMP/oxidns.tar.gz"
          echo "2ac8e103e03407a73c29da848f6ce2d524e751ce1da8a744aa9168fc1384e3b0  $RUNNER_TEMP/oxidns.tar.gz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/oxidns-official"
          tar -xzf "$RUNNER_TEMP/oxidns.tar.gz" -C "$RUNNER_TEMP/oxidns-official"
          "$RUNNER_TEMP/oxidns-official/oxidns" --version
      - name: Validate every generated DNS profile with real OxiDNS
        env:
          OXIDNS_CHECK_BINARY: ${{ runner.temp }}/oxidns-official/oxidns
        run: go test -v ./internal/oxidns -run '^TestGeneratedYAMLAgainstOfficialBinary$' -count=1
