name: Temporary Telemt install formatter
on:
  push:
    branches: [refactor/mtproto-native-web-lifecycle]
    paths:
      - ".github/workflows/telemt-installer-format.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Format Go sources
        run: gofmt -w internal/web/service/telemt.go internal/web/service/telemt_version_test.go
      - name: Format settings UI
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx oxfmt src/pages/settings/SystemUpdateModal.tsx
      - name: Save canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/web/service/telemt.go internal/web/service/telemt_version_test.go frontend/src/pages/settings/SystemUpdateModal.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(telemt): canonical formatting"
          git push origin HEAD:refactor/mtproto-native-web-lifecycle
