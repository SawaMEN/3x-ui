name: TrustTunnel independent QUIC component
on:
  push:
    branches: [main]
    paths:
      - 'tools/trusttunnel/**'
      - '.github/workflows/trusttunnel-component.yml'
      - 'internal/externalvpn/**'
      - 'internal/web/service/telemt_web_trusttunnel_migration.go'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish tested component release (main only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: trusttunnel-component-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Checkout pinned upstream source
        uses: actions/checkout@v7
        with:
          repository: TrustTunnel/TrustTunnel
          ref: 113cdc89559b9d2698e1477b3d0af89e95c0b7cf
          path: upstream-trusttunnel
          persist-credentials: false
      - name: Build native component in Ubuntu 22.04
        run: |
          set -euo pipefail
          mkdir -p artifacts
          docker run --rm -v "$PWD:/work" -w /work ubuntu:22.04 bash -euxo pipefail -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y ca-certificates curl git build-essential clang libclang-dev cmake pkg-config perl python3 libssl-dev
            git config --global --add safe.directory /work/upstream-trusttunnel
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.95
            . /root/.cargo/env
            bash tools/trusttunnel/build.sh upstream-trusttunnel artifacts
          '
          sudo chown -R "$(id -u):$(id -g)" artifacts upstream-trusttunnel
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Require real authenticated HTTP/2 and HTTP/3 in both modes
        env:
          TRUSTTUNNEL_REQUIRE_SPLIT: '1'
        run: |
          set -euo pipefail
          mkdir -p internal/web/dist
          touch internal/web/dist/.gitkeep
          export TRUSTTUNNEL_TEST_BINARY="$PWD/artifacts/trusttunnel-v1.3.1-xui.1-linux-${{ matrix.arch }}/trusttunnel_endpoint"
          go test ./internal/externalvpn -run '^TestTrustTunnel' -count=1 -v -timeout=5m
          go test ./internal/web/service -run '^TestTelemtTrustTunnel' -count=1 -v -timeout=5m
      - uses: actions/upload-artifact@v7
        with:
          name: trusttunnel-${{ matrix.arch }}
          path: |
            artifacts/*.tar.gz
            artifacts/*.sha256
          if-no-files-found: error
  publish:
    needs: build-test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: trusttunnel-*
          merge-multiple: true
          path: artifacts
      - name: Publish immutable tested component assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd artifacts
          for arch in x86_64 aarch64; do
            name="trusttunnel-v1.3.1-xui.1-linux-$arch.tar.gz"
            test -s "$name"
            test -s "$name.sha256"
            sha256sum -c "$name.sha256"
          done
          tag=trusttunnel-v1.3.1-xui.1
          # Never replace an existing published component tag or asset.
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; leaving published assets untouched"
            exit 0
          fi
          gh release create "$tag" *.tar.gz *.sha256 -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false --title "TrustTunnel 1.3.1-xui.1" --notes "Independent QUIC listener and internal HTTP/1 metrics; upstream 113cdc89559b9d2698e1477b3d0af89e95c0b7cf. Both native architectures passed required HTTP/2 and HTTP/3 tests. Modified Apache-2.0 upstream source; see tools/trusttunnel/build.sh."
