name: Gateway orphan-state patch

on:
  push:
    branches:
      - fix/gateway-fail-closed

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gateway-fail-closed
          fetch-depth: 0

      - name: Harden missing-state recovery
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('internal/web/service/gateway_network.go')
          text = p.read_text()

          old = '''\tstate, err := s.loadGatewayNetworkState()\n\tif err != nil {\n\t\tif _, statErr := os.Stat(s.networkPaths().state); statErr == nil {\n\t\t\treturn GatewayNetworkStatus{Configured: true, Error: err.Error()}\n\t\t}\n\t\treturn GatewayNetworkStatus{}\n\t}\n'''
          new = '''\tstate, err := s.loadGatewayNetworkState()\n\tif err != nil {\n\t\tif _, statErr := os.Stat(s.networkPaths().state); statErr == nil {\n\t\t\treturn GatewayNetworkStatus{Configured: true, Error: err.Error()}\n\t\t}\n\t\tif !os.IsNotExist(err) {\n\t\t\treturn GatewayNetworkStatus{Error: err.Error()}\n\t\t}\n\t\t// A deleted gateway.env must not make an active, panel-owned TPROXY\n\t\t// firewall look like a clean disabled Gateway. Surface the residue so\n\t\t// callers can explicitly clean it instead of restarting a core behind\n\t\t// an invisible interception rule.\n\t\tif s.checkSupport() == nil {\n\t\t\torphaned, inspectErr := s.gatewayOrphaned(ctx)\n\t\t\tif inspectErr != nil {\n\t\t\t\treturn GatewayNetworkStatus{Error: fmt.Sprintf("inspect orphaned Gateway networking: %v", inspectErr)}\n\t\t\t}\n\t\t\tif orphaned {\n\t\t\t\treturn GatewayNetworkStatus{Configured: true, Error: "Gateway recovery state is missing while managed Linux networking remains; disable Gateway to clean the orphaned interception safely"}\n\t\t\t}\n\t\t}\n\t\treturn GatewayNetworkStatus{}\n\t}\n'''
          if old not in text:
              raise SystemExit('status target not found')
          text = text.replace(old, new, 1)

          old = '''func (s *GatewayNetworkService) Suspend(ctx context.Context) error {\n\tstate, err := s.loadGatewayNetworkState()\n\tif os.IsNotExist(err) {\n\t\treturn nil\n\t}\n\tif err != nil {\n\t\treturn err\n\t}\n'''
          new = '''func (s *GatewayNetworkService) Suspend(ctx context.Context) error {\n\tstate, err := s.loadGatewayNetworkState()\n\tif os.IsNotExist(err) {\n\t\torphaned, inspectErr := s.gatewayOrphaned(ctx)\n\t\tif inspectErr != nil {\n\t\t\treturn fmt.Errorf("inspect Gateway networking without recovery state: %w", inspectErr)\n\t\t}\n\t\tif !orphaned {\n\t\t\treturn nil\n\t\t}\n\t\tcleanupErr := s.cleanupGatewayWithoutState(ctx, false)\n\t\treturn errors.Join(fmt.Errorf("Gateway recovery state is missing; managed interception was suspended but original sysctl baselines cannot be recovered from gateway.env"), cleanupErr)\n\t}\n\tif err != nil {\n\t\treturn err\n\t}\n'''
          if old not in text:
              raise SystemExit('suspend target not found')
          text = text.replace(old, new, 1)

          old = '''func (s *GatewayNetworkService) Disable(ctx context.Context) error {\n\tstate, err := s.loadGatewayNetworkState()\n\tif os.IsNotExist(err) {\n\t\treturn nil\n\t}\n\tif err != nil {\n\t\treturn fmt.Errorf("read Gateway recovery state: %w", err)\n\t}\n'''
          new = '''func (s *GatewayNetworkService) Disable(ctx context.Context) error {\n\tstate, err := s.loadGatewayNetworkState()\n\tif os.IsNotExist(err) {\n\t\torphaned, inspectErr := s.gatewayOrphaned(ctx)\n\t\tif inspectErr != nil {\n\t\t\treturn fmt.Errorf("inspect Gateway networking without recovery state: %w", inspectErr)\n\t\t}\n\t\tif !orphaned {\n\t\t\treturn nil\n\t\t}\n\t\tcleanupErr := s.cleanupGatewayWithoutState(ctx, true)\n\t\treturn errors.Join(fmt.Errorf("Gateway recovery state was missing; managed interception was removed, but the previous net.ipv4.ip_forward value cannot be recovered safely and was left unchanged"), cleanupErr)\n\t}\n\tif err != nil {\n\t\treturn fmt.Errorf("read Gateway recovery state: %w", err)\n\t}\n'''
          if old not in text:
              raise SystemExit('disable target not found')
          text = text.replace(old, new, 1)

          anchor = '''func (s *GatewayNetworkService) removeGatewayTables(ctx context.Context) error {\n'''
          helpers = '''func (s *GatewayNetworkService) gatewayOrphaned(ctx context.Context) (bool, error) {\n\tpaths := s.networkPaths()\n\tfor _, path := range []string{paths.rpFilter, paths.nft, paths.routingUnit, paths.firewallUnit, paths.restoreScript} {\n\t\tif _, err := os.Stat(path); err == nil {\n\t\t\treturn true, nil\n\t\t} else if !os.IsNotExist(err) {\n\t\t\treturn false, err\n\t\t}\n\t}\n\ttables, err := s.command(ctx, "nft", "list", "tables")\n\tif err != nil {\n\t\treturn false, err\n\t}\n\tif gatewayTablePresent(tables, "inet", "xui_gateway") || gatewayTablePresent(tables, "ip", "xui_gateway_nat") {\n\t\treturn true, nil\n\t}\n\trules, err := s.command(ctx, "ip", "-N", "-4", "rule", "show")\n\tif err != nil {\n\t\treturn false, err\n\t}\n\treturn len(gatewayOwnedRulePriorities(rules)) > 0, nil\n}\n\n// cleanupGatewayWithoutState removes only resources with an unambiguous 3x-ui\n// identity. It deliberately does not guess the previous ip_forward value.\nfunc (s *GatewayNetworkService) cleanupGatewayWithoutState(ctx context.Context, removeFiles bool) error {\n\tpaths := s.networkPaths()\n\tvar cleanupErr error\n\tfor _, unit := range []struct{ path, name string }{{paths.firewallUnit, "xui-gateway-firewall.service"}, {paths.routingUnit, "xui-gateway-routing.service"}} {\n\t\tif _, err := os.Stat(unit.path); err == nil {\n\t\t\tif err := s.commandOnly(ctx, "systemctl", "disable", "--now", unit.name); err != nil {\n\t\t\t\tcleanupErr = errors.Join(cleanupErr, fmt.Errorf("disable orphaned %s: %w", unit.name, err))\n\t\t\t}\n\t\t} else if !os.IsNotExist(err) {\n\t\t\tcleanupErr = errors.Join(cleanupErr, err)\n\t\t}\n\t}\n\tif err := s.removeGatewayTables(ctx); err != nil {\n\t\tcleanupErr = errors.Join(cleanupErr, fmt.Errorf("remove orphaned Gateway nftables: %w", err))\n\t}\n\trules, err := s.command(ctx, "ip", "-N", "-4", "rule", "show")\n\tif err != nil {\n\t\tcleanupErr = errors.Join(cleanupErr, err)\n\t} else {\n\t\tfor _, priority := range gatewayOwnedRulePriorities(rules) {\n\t\t\tif err := s.commandOnly(ctx, "ip", "-4", "rule", "del", "priority", priority, "from", "all", "fwmark", "0x40/0xc0", "table", "100"); err != nil {\n\t\t\t\tcleanupErr = errors.Join(cleanupErr, err)\n\t\t\t}\n\t\t}\n\t}\n\troutes, routeErr := s.command(ctx, "ip", "-4", "route", "show", "table", "100")\n\tif routeErr != nil && !strings.Contains(routes, "FIB table does not exist") {\n\t\tcleanupErr = errors.Join(cleanupErr, routeErr)\n\t} else if gatewayHasOwnedRoute(routes) {\n\t\tif err := s.commandOnly(ctx, "ip", "-4", "route", "del", "local", "default", "dev", "lo", "table", "100"); err != nil {\n\t\t\tcleanupErr = errors.Join(cleanupErr, err)\n\t\t}\n\t}\n\tif !removeFiles {\n\t\treturn cleanupErr\n\t}\n\t// rp_filter has its own self-describing snapshot and can therefore still\n\t// be restored safely even when gateway.env (which held ip_forward) is lost.\n\tif _, err := os.Stat(paths.rpFilter); err == nil {\n\t\tif err := s.restoreGatewayRPFilter(ctx); err != nil {\n\t\t\tcleanupErr = errors.Join(cleanupErr, fmt.Errorf("restore orphaned Gateway rp_filter snapshot: %w", err))\n\t\t} else if err := os.Remove(paths.rpFilter); err != nil && !os.IsNotExist(err) {\n\t\t\tcleanupErr = errors.Join(cleanupErr, err)\n\t\t}\n\t} else if !os.IsNotExist(err) {\n\t\tcleanupErr = errors.Join(cleanupErr, err)\n\t}\n\tfor _, path := range []string{paths.firewallUnit, paths.routingUnit, paths.restoreScript, paths.nft} {\n\t\tif err := os.Remove(path); err != nil && !os.IsNotExist(err) {\n\t\t\tcleanupErr = errors.Join(cleanupErr, err)\n\t\t}\n\t}\n\tif err := s.commandOnly(ctx, "systemctl", "daemon-reload"); err != nil {\n\t\tcleanupErr = errors.Join(cleanupErr, err)\n\t}\n\treturn cleanupErr\n}\n\n'''
          if anchor not in text:
              raise SystemExit('helper anchor not found')
          text = text.replace(anchor, helpers + anchor, 1)
          p.write_text(text)

          t = Path('internal/web/service/gateway_network_lifecycle_test.go')
          text = t.read_text()
          anchor = '''func TestGatewayLegacySuspendCapturesBaselineAndDisablesOldBootUnits(t *testing.T) {\n'''
          tests = '''func TestGatewayMissingStateIsVisibleAndFailsClosed(t *testing.T) {\n\ts, h, cfg := newGatewayTestHost(t)\n\tbaseline := map[string]string{}\n\tfor key, value := range h.sys {\n\t\tbaseline[key] = value\n\t}\n\tif err := s.Enable(context.Background(), cfg); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif err := os.Remove(s.paths.state); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tstatus := s.Status(context.Background())\n\tif !status.Configured || !strings.Contains(status.Error, "recovery state is missing") {\n\t\tt.Fatalf("orphaned networking was hidden: %+v", status)\n\t}\n\tif err := s.Suspend(context.Background()); err == nil || !strings.Contains(err.Error(), "recovery state is missing") {\n\t\tt.Fatalf("missing-state suspension error=%v", err)\n\t}\n\tif h.firewall != "" || h.rules != 0 || h.route != "" || h.enabled {\n\t\tt.Fatalf("missing-state suspend did not fail closed: %+v", h)\n\t}\n\tif h.sys["net.ipv4.ip_forward"] != "1" {\n\t\tt.Fatal("missing-state cleanup guessed the original ip_forward value")\n\t}\n\tif _, err := os.Stat(s.paths.rpFilter); err != nil {\n\t\tt.Fatal("suspend discarded the only remaining rp_filter recovery data:", err)\n\t}\n\t// The disabled unit files/snapshot are intentionally still enough for\n\t// Status to advertise recovery until explicit cleanup is requested.\n\tif status := s.Status(context.Background()); !status.Configured || status.Error == "" {\n\t\tt.Fatalf("suspended orphan disappeared from status: %+v", status)\n\t}\n\tif err := s.Disable(context.Background()); err == nil || !strings.Contains(err.Error(), "net.ipv4.ip_forward") {\n\t\tt.Fatalf("missing-state disable error=%v", err)\n\t}\n\tfor key, value := range baseline {\n\t\tif strings.HasSuffix(key, "/rp_filter") && h.sys[key] != value {\n\t\t\tt.Fatalf("rp_filter baseline not restored for %s: got=%s want=%s", key, h.sys[key], value)\n\t\t}\n\t}\n\tif h.sys["net.ipv4.ip_forward"] != "1" {\n\t\tt.Fatal("disable guessed an unrecoverable forwarding baseline")\n\t}\n\tif status := s.Status(context.Background()); status.Configured || status.Error != "" {\n\t\tt.Fatalf("fully cleaned orphan still visible: %+v", status)\n\t}\n}\n\nfunc TestGatewayRuleOnlyOrphanIsDetectedAndRemoved(t *testing.T) {\n\ts, h, _ := newGatewayTestHost(t)\n\th.rules = 1\n\th.route = "local default dev lo scope host\\n"\n\tstatus := s.Status(context.Background())\n\tif !status.Configured || status.Error == "" {\n\t\tt.Fatalf("rule-only orphan was hidden: %+v", status)\n\t}\n\tif err := s.Disable(context.Background()); err == nil {\n\t\tt.Fatal("rule-only cleanup hid the missing recovery state")\n\t}\n\tif h.rules != 0 || h.route != "" {\n\t\tt.Fatalf("owned policy residue survived cleanup: %+v", h)\n\t}\n}\n\n'''
          if anchor not in text:
              raise SystemExit('test anchor not found')
          t.write_text(text.replace(anchor, tests + anchor, 1))
          PY

          gofmt -w internal/web/service/gateway_network.go internal/web/service/gateway_network_lifecycle_test.go

      - name: Test Gateway packages
        run: |
          go test ./internal/gateway ./internal/web/service

      - name: Commit patch and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/gateway-orphan-patch.yml
          git add internal/web/service/gateway_network.go internal/web/service/gateway_network_lifecycle_test.go
          git commit -m "fix(gateway): fail closed without recovery state"
          git push origin HEAD:fix/gateway-fail-closed
