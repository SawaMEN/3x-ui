\tListenerReady    bool                 `json:"listenerReady"`
\tConfigured       bool                 `json:"configured"`
\tRecoveryRequired bool                 `json:"recoveryRequired"`
\tConfig           GatewayNetworkConfig `json:"config"`
'''
