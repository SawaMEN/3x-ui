          test = r'''func TestGatewayOrphanRecoveryCleansOwnedObjectsWithoutGuessingForwarding(t *testing.T) {
	s, h, cfg := newGatewayTestHost(t)
	baselineRP := map[string]string{}
	for key, value := range h.sys {
		if strings.HasSuffix(key, "/rp_filter") {
			baselineRP[key] = value
		}
	}
	ctx := context.Background()
	if err := s.Enable(ctx, cfg); err != nil {
		t.Fatal(err)
	}
	if err := os.Remove(s.paths.state); err != nil {
		t.Fatal(err)
	}
	status := s.Status(ctx)
	if status.Configured || !status.RecoveryRequired {
		t.Fatalf("orphaned Gateway state was hidden: %+v", status)
	}
	if err := s.Suspend(ctx); err != nil {
		t.Fatal(err)
	}
	if h.firewall != "" {
		t.Fatal("orphan suspension left TPROXY interception active")
	}
	if err := s.Disable(ctx); err != nil {
		t.Fatal(err)
	}
	if h.rules != 0 || h.route != "" || h.firewall != "" || h.enabled {
		t.Fatalf("orphan cleanup leaked owned network objects: %+v", h)
	}
	if h.sys["net.ipv4.ip_forward"] != "1" {
		t.Fatalf("orphan cleanup guessed an unavailable forwarding baseline: %q", h.sys["net.ipv4.ip_forward"])
	}
	for key, value := range baselineRP {
		if h.sys[key] != value {
			t.Fatalf("rp_filter baseline not restored for %s: got=%q want=%q", key, h.sys[key], value)
		}
	}
	if status := s.Status(ctx); status.RecoveryRequired || status.Configured {
		t.Fatalf("orphan cleanup remained visible: %+v", status)
	}
}

'''
