\t\treturn status
\t}
'''
          if old not in text:
              raise SystemExit('Status missing-state anchor not found')
          text = text.replace(old, new, 1)

          anchor = 'func (s *GatewayNetworkService) checkSupport() error {'
          if anchor not in text:
              raise SystemExit('checkSupport anchor not found')
          helpers = r'''func gatewayPathExists(path string) (bool, error) {
	_, err := os.Stat(path)
	if err == nil {
		return true, nil
	}
	if os.IsNotExist(err) {
		return false, nil
	}
	return false, err
}

// orphanGatewayStatus detects only objects with Gateway-specific identities.
// It intentionally does not infer the previous sysctl baseline when gateway.env
// is missing: that value cannot be reconstructed safely from the live host.
func (s *GatewayNetworkService) orphanGatewayStatus(ctx context.Context) (GatewayNetworkStatus, error) {
	status := GatewayNetworkStatus{}
	paths := s.networkPaths()
	for _, path := range []string{paths.rpFilter, paths.nft, paths.routingUnit, paths.firewallUnit, paths.restoreScript} {
		exists, err := gatewayPathExists(path)
		if err != nil {
			return status, err
		}
		if exists {
			status.RecoveryRequired = true
			status.Persistent = true
		}
	}

	rules, err := s.command(ctx, "ip", "-N", "-4", "rule", "show")
	if err != nil {
		return status, err
	}
	ownedRules := gatewayOwnedRulePriorities(rules)
	routes, routeErr := s.command(ctx, "ip", "-4", "route", "show", "table", "100")
	if routeErr != nil && !strings.Contains(routes, "FIB table does not exist") {
		return status, routeErr
	}
	ownedRoute := routeErr == nil && gatewayHasOwnedRoute(routes)
	if len(ownedRules) != 0 || ownedRoute {
		status.RecoveryRequired = true
	}
	status.PolicyRoute = len(ownedRules) == 1 && ownedRoute && !gatewayForeignRule(rules)

	tables, err := s.command(ctx, "nft", "list", "tables")
	if err != nil {
		return status, err
	}
	if gatewayTablePresent(tables, "inet", "xui_gateway") {
		if live, tableErr := s.command(ctx, "nft", "list", "table", "inet", "xui_gateway"); tableErr == nil && strings.Contains(live, "3x-ui gateway v2") {
			status.RecoveryRequired = true
			status.NFTables = true
		}
	}
	if gatewayTablePresent(tables, "ip", "xui_gateway_nat") {
		if live, tableErr := s.command(ctx, "nft", "list", "table", "ip", "xui_gateway_nat"); tableErr == nil && strings.Contains(live, "masquerade") {
			status.RecoveryRequired = true
			status.NAT = true
		}
	}
	status.ListenerReady = s.listenerReady(ctx)
	return status, nil
}

func (s *GatewayNetworkService) suspendOrphanGateway(ctx context.Context, status GatewayNetworkStatus) error {
	if !status.RecoveryRequired {
		return nil
	}
	paths := s.networkPaths()
	if exists, _ := gatewayPathExists(paths.firewallUnit); exists {
		if err := s.commandOnly(ctx, "systemctl", "disable", "--now", "xui-gateway-firewall.service"); err != nil {
			return err
		}
	}
	// Only delete live tables when their Gateway ownership was observable or a
	// persisted Gateway nft file proves that these app-specific table names are ours.
	ownedNFT := status.NFTables || status.NAT
	if !ownedNFT {
		if data, err := os.ReadFile(paths.nft); err == nil {
			ownedNFT = strings.Contains(string(data), "table inet xui_gateway")
		}
	}
	if ownedNFT {
		return s.removeGatewayTables(ctx)
	}
	return nil
}

func (s *GatewayNetworkService) cleanupOrphanGateway(ctx context.Context) error {
	status, err := s.orphanGatewayStatus(ctx)
	if err != nil {
		return err
	}
	if !status.RecoveryRequired {
		return nil
	}
	if err := s.suspendOrphanGateway(ctx, status); err != nil {
		return err
	}
	paths := s.networkPaths()
	var cleanupErr error
	if exists, _ := gatewayPathExists(paths.routingUnit); exists {
		if err := s.commandOnly(ctx, "systemctl", "disable", "--now", "xui-gateway-routing.service"); err != nil {
			cleanupErr = errors.Join(cleanupErr, err)
		}
	}
	rules, err := s.command(ctx, "ip", "-N", "-4", "rule", "show")
	if err != nil {
		cleanupErr = errors.Join(cleanupErr, err)
	} else {
		for _, priority := range gatewayOwnedRulePriorities(rules) {
			if err := s.commandOnly(ctx, "ip", "-4", "rule", "del", "priority", priority, "from", "all", "fwmark", "0x40/0xc0", "table", "100"); err != nil {
				cleanupErr = errors.Join(cleanupErr, err)
			}
		}
	}
	routes, routeErr := s.command(ctx, "ip", "-4", "route", "show", "table", "100")
	if routeErr != nil && !strings.Contains(routes, "FIB table does not exist") {
		cleanupErr = errors.Join(cleanupErr, routeErr)
	} else if routeErr == nil && gatewayHasOwnedRoute(routes) {
		if err := s.commandOnly(ctx, "ip", "-4", "route", "del", "local", "default", "dev", "lo", "table", "100"); err != nil {
			cleanupErr = errors.Join(cleanupErr, err)
		}
	}

	// rp_filter has its own durable baseline. Restore it when available. The
	// original ip_forward value lived only in gateway.env, so without that file
	// the current ip_forward value must be preserved rather than guessed.
	rpRestored := false
	if exists, _ := gatewayPathExists(paths.rpFilter); exists {
		if err := s.restoreGatewayRPFilter(ctx); err != nil {
			cleanupErr = errors.Join(cleanupErr, fmt.Errorf("restore orphaned Gateway rp_filter: %w", err))
		} else {
			rpRestored = true
		}
	}
	for _, path := range []string{paths.nft, paths.routingUnit, paths.firewallUnit, paths.restoreScript} {
		if err := os.Remove(path); err != nil && !os.IsNotExist(err) {
			cleanupErr = errors.Join(cleanupErr, err)
		}
	}
	if rpRestored {
		if err := os.Remove(paths.rpFilter); err != nil && !os.IsNotExist(err) {
			cleanupErr = errors.Join(cleanupErr, err)
		}
	}
	if err := s.commandOnly(ctx, "systemctl", "daemon-reload"); err != nil {
		cleanupErr = errors.Join(cleanupErr, err)
	}
	return cleanupErr
}

'''
          text = text.replace(anchor, helpers + anchor, 1)

          old = '''func (s *GatewayNetworkService) Suspend(ctx context.Context) error {
