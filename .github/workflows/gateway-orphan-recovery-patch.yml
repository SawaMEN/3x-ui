name: Gateway orphan recovery patch

on:
  push:
    branches:
      - fix/gateway-fail-closed

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
