<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{.Description}}">
<title>{{.Title}}</title>
<style>
:root{color-scheme:light;--paper:#f6efe4;--ink:#302820;--accent:#895134;--soft:#e6d7c3}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.7 system-ui,sans-serif}a{color:inherit;text-underline-offset:5px}a:focus-visible{outline:3px solid var(--accent);outline-offset:6px}header,main,footer{width:min(1120px,90%);margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:24px;padding:28px 0;border-bottom:1px solid var(--accent)}nav{display:flex;gap:22px;flex-wrap:wrap}.brand{font-weight:750;text-decoration:none;overflow-wrap:anywhere}.hero{display:grid;grid-template-columns:3fr 2fr;align-items:center;gap:60px;padding:80px 0}h1{font:clamp(2.6rem,6vw,5.5rem)/1.08 Georgia,serif;letter-spacing:-.04em;margin:18px 0;overflow-wrap:anywhere}h2{font:2rem/1.2 Georgia,serif}h3{font:1.5rem/1.3 Georgia,serif;margin:12px 0}.eyebrow{font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700}.intro{max-width:42em;overflow-wrap:anywhere}.button{display:inline-block;padding:10px 22px;border:1px solid var(--accent);border-radius:99px;margin-top:18px;text-decoration:none}.art{aspect-ratio:1;position:relative;overflow:hidden;border-radius:48% 48% 12px 12px;background:var(--soft);border:1px solid var(--accent)}.art:before,.art:after{content:"";position:absolute;background:var(--accent)}.art:before{width:55%;height:55%;border-radius:50%;left:22%;top:14%;opacity:.8}.art:after{width:80%;height:38%;bottom:0;left:10%;border-radius:50% 50% 0 0;opacity:.5}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;padding:24px 0 60px}.cards article{border-top:2px solid var(--accent);padding-top:20px}.number{font-size:.8rem;opacity:.7}.about{padding:36px;border:1px solid var(--accent);margin-bottom:60px;border-radius:12px;max-width:800px}footer{padding:24px 0 36px;border-top:1px solid var(--accent);font-size:.85rem;overflow-wrap:anywhere}
.gallery{--paper:#f3f3ee;--ink:#172b30;--accent:#3a6870;--soft:#c8dbd8}.gallery .art{border-radius:0;background:linear-gradient(145deg,var(--soft) 50%,var(--accent) 50%)}.gallery .art:before{border-radius:0;transform:rotate(20deg);background:var(--paper)}.gallery .cards article{padding:24px;background:var(--soft);border:0}.gallery h1{font-family:system-ui,sans-serif;font-weight:650}
.editorial{--paper:#fcfaf3;--ink:#263427;--accent:#526a39;--soft:#dce2c7}.editorial .hero{grid-template-columns:2fr 1fr}.editorial .art{border-radius:50%}.editorial .cards{grid-template-columns:1fr}.editorial .cards article{display:grid;grid-template-columns:40px 1fr 2fr;gap:24px;align-items:start}.editorial .cards h3,.editorial .cards p{margin:0}.editorial .about{border-radius:0;border-width:1px 0;padding:30px 0}
.night{color-scheme:dark;--paper:#141d2c;--ink:#e8edf7;--accent:#adbef3;--soft:#2b3956}.night .art{border-radius:24px;background:radial-gradient(circle at 75% 25%,#e8edf7 0 2px,transparent 3px),radial-gradient(circle at 20% 60%,#e8edf7 0 1px,transparent 2px),var(--soft)}.night .art:before{box-shadow:20px 8px 0 4px var(--soft);background:var(--accent);width:40%;height:40%;left:20%;top:20%}.night .art:after{transform:rotate(-20deg);height:10%;bottom:22%;border-radius:50%}.night .cards article{background:var(--soft);padding:24px;border:0;border-radius:12px}
@media(max-width:700px){header{align-items:flex-start;flex-direction:column;gap:12px}nav{gap:18px}.hero,.editorial .hero{grid-template-columns:1fr;gap:28px;padding:42px 0}.art{width:min(100%,300px);justify-self:center}.cards{grid-template-columns:1fr}.editorial .cards article{grid-template-columns:28px 1fr;gap:12px}.editorial .cards p{grid-column:2}.about{padding:24px}h1{font-size:clamp(2.5rem,12vw,4rem)}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body class="{{.Layout}}">
<header><a class="brand" href="#home">{{.Title}}</a><nav aria-label="Main navigation"><a href="#collection">{{.Section}}</a><a href="#about">About</a></nav></header>
<main id="home">
<section class="hero" aria-labelledby="headline"><div><span class="eyebrow">{{.Category}}</span><h1 id="headline">{{.Headline}}</h1><p class="intro">{{.Description}}</p><a class="button" href="#collection">{{.Action}}</a></div><div class="art" aria-hidden="true"></div></section>
<section id="collection" aria-labelledby="collection-title"><span class="eyebrow">The collection</span><h2 id="collection-title">{{.Section}}</h2><div class="cards">{{range .Articles}}<article><span class="number">{{.Number}}</span><h3>{{.Title}}</h3><p>{{.Text}}</p></article>{{end}}</div></section>
<section id="about" class="about"><span class="eyebrow">About this space</span><h2>{{.AboutTitle}}</h2><p>{{.About}}</p></section>
</main><footer>{{.Domain}} · {{.Title}}</footer>
</body>
</html>
